<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Running War Room</title>
<meta name="description" content="ห้องติดตามการแข่งเดินกับทีมข้างหน้า: วันนี้ไล่ทันหรือโดนทิ้ง วางแผนด้วย Simulator และเจาะข้อมูลใน Explore">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f3fc">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%231d48c8%22/%3E%3Crect x=%2212%22 y=%2216%22 width=%2240%22 height=%2228%22 rx=%225%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22/%3E%3Cpath d=%22M19 37l7-7 5 4 9-10%22 fill=%22none%22 stroke=%22%233db5ff%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M24 50h16%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300..700&family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Running War Room: blue = ทีมเรา and a good day, red = a day we fall behind (the hero panel turns red), sky = the
   one accent. Lavender-blue ground, soft white rounded panels, one deep hero panel per screen. Light only (user). */
:root {
  color-scheme: light;
  --ground: #f3f3fc; --panel: #ffffff; --tint: #f5f5fd;
  --ink: #0f1a33; --ink-2: #4f5b75; --muted: #5c6780; --rule: #e1e7f1; --rule-2: #edf1f7;
  --blue: #1d48c8; --blue-2: #2c66f0; --navy: #0b1c4a; --blue-ink: #c6d6fb; --blue-soft: #e2eafd; --blue-tint: rgba(44, 102, 240, .12);
  --sky: #3db5ff; --sky-ink: #0a6aa8;
  --red: #c0222e; --red-2: #e0303c; --red-deep: #5e0b14; --red-soft: #fde2e2; --red-ink: #ffe4e4; --red-tint: rgba(224, 48, 60, .12);
  --ld: #1f2633; --ghost: #a3adc1;
  --good: #0b5ea8; --good-soft: #dcefff;
  --shadow: 0 1px 2px rgba(11, 28, 74, .05), 0 14px 32px -18px rgba(11, 28, 74, .28);
  /* Explore draws the other team: never our blue, never alarm red; weekday = steel blue, off day = orange, empty = gray */
  --hot: #2b7bab; --hot-ink: #1b5a82; --off: #d96f0e; --off-ink: #9a4a00; --idle: #c9ced9;
  --m1: #2a78d6; --m2: #e87ba4; --m3: #1baf7a; --m4: #eda100; --m5: #6250d6; --m6: #008300;
  --font: "Anuphan", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num: "Archivo", "Anuphan", system-ui, sans-serif;
  --r: 22px; --step: 120ms;
  --nav-h: 64px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scrollbar-color: #b9c4da var(--ground); }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.6 var(--font); font-variant-numeric: tabular-nums; }
::selection { background: var(--sky); color: var(--navy); }
:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
a { color: inherit; text-underline-offset: 3px; }
.n { font-family: var(--num); font-variant-numeric: tabular-nums; font-stretch: 106%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground); }

/* ---------- top bar + tabs (tabs sit in the bar on desktop, at the thumb on phones) ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(243, 243, 252, .96); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 16px; }
.brand { display: grid; gap: 3px; line-height: 1.1; margin-right: auto; }
.brand b { font-size: 17px; font-weight: 700; color: var(--blue); letter-spacing: -.005em; }
.brand::after { content: ""; width: 24px; height: 3px; border-radius: 2px; background: var(--sky); }
.fresh { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.fresh i { width: 7px; height: 7px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 3px rgba(61, 181, 255, .25); }
.fresh.old i { background: #e8a200; box-shadow: 0 0 0 3px rgba(232, 162, 0, .25); }
.fresh.stale { color: var(--red); font-weight: 600; }
.fresh.stale i { background: var(--red-2); box-shadow: 0 0 0 3px var(--red-tint); }
.tabs { display: flex; gap: 4px; }
.tabs button { appearance: none; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; color: var(--ink-2); padding: 7px 14px; border-radius: 999px; transition: background-color 160ms, color 160ms; }
.tabs button svg { width: 18px; height: 18px; flex: none; }
@media (hover: hover) { .tabs button:hover { color: var(--ink); background: var(--blue-soft); } }
.tabs button[aria-selected="true"] { background: var(--blue); color: #fff; font-weight: 600; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 18px 20px; }
.h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 0 12px; font-size: 16px; font-weight: 700; color: var(--blue); }
.h span { font-size: 12px; font-weight: 400; color: var(--muted); text-align: right; }

/* ---------- WAR ROOM ---------- */
.war { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.war > *, .sim > * { min-width: 0; }
.sim .col { display: contents; }
.sim .s-main { order: 1; } .sim .s-ctl { order: 2; } .sim .s-hero { order: 3; } .sim .s-cps { order: 4; }
.hero { border-radius: var(--r); padding: 20px 20px 16px; color: #fff; background: linear-gradient(155deg, var(--blue-2), var(--blue) 45%, var(--navy)); box-shadow: 0 18px 36px -20px rgba(11, 28, 74, .7); transition: background 400ms; position: relative; overflow: hidden; }
.hero .when { font-size: 13px; color: var(--blue-ink); }
.hero .verb { font-size: 18px; font-weight: 600; margin-top: 12px; }
.hero .big { font-family: var(--num); font-stretch: 112%; font-weight: 800; font-size: clamp(60px, 18vw, 92px); line-height: .95; letter-spacing: -.035em; margin-top: 2px; }
.hero .unit { font-size: 13px; color: var(--blue-ink); margin-top: 4px; }
.delta { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 4px 12px 4px 8px; background: var(--good-soft); color: var(--good); }
.delta svg { width: 16px; height: 16px; flex: none; }
.delta .n { font-weight: 800; }
.hero .rule { margin-top: 12px; }
.hero svg text { font-family: var(--font); }
/* a day we fall behind: the whole hero turns red and says so (user, 2026-10-31: "ดู impact กว่านี้") */
.bad .hero { background: linear-gradient(155deg, var(--red-2), var(--red) 45%, var(--red-deep)); box-shadow: 0 18px 40px -18px rgba(94, 11, 20, .75); }
.bad .hero .when, .bad .hero .unit { color: var(--red-ink); }
.bad .delta { background: #fff; color: var(--red); font-size: 15px; }
.alarm { display: none; margin: 14px -20px -16px; padding: 10px 20px; background: rgba(0, 0, 0, .22); font-size: 14px; font-weight: 600; align-items: center; gap: 8px; }
.alarm svg { width: 18px; height: 18px; flex: none; }
.bad .alarm { display: flex; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 10px; }
.vs .t { display: grid; min-width: 0; }
.vs .t.r { text-align: right; }
.vs .who { font-size: 13px; color: var(--ink-2); }
.vs .v { font-family: var(--num); font-stretch: 108%; font-weight: 800; font-size: clamp(32px, 9vw, 42px); line-height: 1.05; letter-spacing: -.03em; color: var(--ld); }
.vs .us .v { color: var(--blue); }
.vs.lost .rv .v { color: var(--red); }
/* today chart day nav (user, 2026-11-01): title + note on the left, two small chevron pills on the right */
.day-h { align-items: center; }
.day-h .ttl { display: grid; text-align: left; font-size: 16px; font-weight: 700; color: var(--blue); }
.day-h .ttl small { font-size: 12px; font-weight: 400; color: var(--muted); }
.dnav { display: flex; gap: 6px; flex: none; }
.dnav button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); color: var(--blue); cursor: pointer; transition: border-color 160ms, color 160ms, transform 160ms; }
.dnav button svg { width: 16px; height: 16px; }
.dnav button:disabled { color: var(--idle); cursor: default; }
@media (hover: hover) { .dnav button:not(:disabled):hover { border-color: var(--blue-2); } }
.dnav button:not(:disabled):active { transform: scale(.97); }
.dnav button:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; }
.vs .x { font-family: var(--num); font-style: italic; font-weight: 700; font-size: 14px; color: var(--sky-ink); padding-bottom: 8px; }
.readout { margin-top: 10px; font-size: 13px; color: var(--ink-2); min-height: 21px; }
.readout b { color: var(--ink); font-weight: 700; font-family: var(--num); }
.today-c { touch-action: pan-y; cursor: crosshair; margin-top: 6px; }
.today-c svg { display: block; width: 100%; height: auto; overflow: visible; }
.warn { background: var(--navy); color: #fff; border-radius: var(--r); padding: 16px 20px; font-size: 14px; line-height: 1.55; }
.warn b { color: var(--sky); font-weight: 700; }
.bad .warn { background: var(--red-deep); }
.bad .warn b { color: #ffb4b4; }
.goal .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goal .v { font-family: var(--num); font-stretch: 108%; font-weight: 800; font-size: 30px; letter-spacing: -.03em; line-height: 1; color: var(--blue); }
.goal .v small { font-family: var(--font); font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.goal .pct { font-family: var(--num); font-weight: 700; color: var(--blue); font-size: 15px; }
.track { position: relative; height: 10px; margin: 16px 0 8px; background: var(--blue-soft); border-radius: 5px; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--blue-2); max-width: 100%; }
.track { margin-top: 30px; }
.track b { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--navy); }
.track b span { position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--navy); }
.track b.end span { left: auto; right: 0; transform: none; }
.track b.start span { left: 0; transform: none; }
.goal .foot { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
.tl { position: relative; display: grid; gap: 14px; padding-left: 82px; }
.tl::before { content: ""; position: absolute; left: 68px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--blue-soft); }
.tl > div { position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px; font-size: 14px; }
.tl .tm { position: absolute; left: -82px; width: 52px; text-align: right; font-family: var(--num); font-weight: 600; font-size: 13px; line-height: 1.35; color: var(--muted); top: 1px; }
.tl .tm small { display: block; font-size: 12px; font-weight: 500; }   /* a run (user, 2026-11-02): start, then –end */
.tl > div.run { min-height: 36px; }
.tl > div::before { content: ""; position: absolute; left: -21px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 3px solid var(--red-2); }
.tl > div.g::before { background: var(--sky); border-color: var(--blue); }
.tl > div.best::before { background: var(--panel); border-color: var(--blue); }
/* who added the rival's steps (user, 2026-11-02): one bar split by member, the top ones in their Explore colours,
   the rest together in grey; under a key moment and under each race board checkpoint */
.wa { flex-basis: 100%; display: grid; gap: 5px; }
.wa-bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; }
.wa-bar i { display: block; height: 100%; min-width: 3px; }
.wa-bar i.rest { background: var(--idle); }
.wa-lg { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.wa-lg > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.wa-lg i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.wa-lg i.rest { background: var(--idle); }
.wa-lg b { font-family: var(--num); font-weight: 700; color: var(--ink); }
.wa.slim { margin-top: -2px; }
.wa.slim .wa-lg { gap: 0 10px; }
.tl .d { font-family: var(--num); font-weight: 700; white-space: nowrap; color: var(--red); }
.tl .g .d { color: var(--blue); }
/* race board (user, 2026-11-03, was a day list with today's checkpoints open): one grid row per day, newest first.
   Four window cells = how the gap moved in that window (blue = good for us, red = bad), the windows add up to the
   day's change; the last column = the gap at the day's close + the day's change. A cell opens its detail under the
   day (one at a time); today's who-walked story lives in key moments only. */
.rg { display: grid; gap: 0; }
.rg-row { display: grid; grid-template-columns: 50px repeat(4, minmax(0, 1fr)) 92px; gap: 4px; align-items: center; padding: 5px 0; border-top: 1px solid var(--rule-2); }
.rg-head { border-top: 0; padding: 0 0 4px; font-size: 11px; line-height: 1.25; color: var(--muted); text-align: center; align-items: end; }
.rg-head > :last-child { text-align: right; }
.rg-today { background: var(--tint); border-radius: 14px; border-top: 0; padding-left: 6px; padding-right: 6px; margin: 0 -6px; }
.rg-today + .rg-row { border-top: 0; }
.rg-d { font-weight: 600; font-size: 14px; color: var(--ink); line-height: 1.2; min-width: 0; }
.rg-d small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.rg-d .rb-tag { margin-top: 2px; }
.rg-c { appearance: none; border: 0; font: inherit; min-height: 44px; border-radius: 10px; display: grid; place-items: center; padding: 0 2px;
  font-family: var(--num); font-weight: 700; font-size: 13px; letter-spacing: -.01em; white-space: nowrap; background: none; color: var(--muted); }
button.rg-c { cursor: pointer; transition: box-shadow 160ms, transform 160ms; }
.rg-c.up { background: var(--good-soft); color: var(--good); }
.rg-c.dn { background: var(--red-soft); color: var(--red); }
.rg-c.eq { background: var(--tint); color: var(--ink-2); font-family: var(--font); font-weight: 500; font-size: 11px; }
.rg-c.wt { font-family: var(--font); font-weight: 400; font-size: 12px; border: 1px dashed var(--rule); }
.rg-c.live { outline: 1.5px dashed currentColor; outline-offset: -3px; }
@media (hover: hover) { button.rg-c:hover { box-shadow: inset 0 0 0 1.5px currentColor; } }
button.rg-c:active { transform: scale(.97); }
button.rg-c[aria-expanded="true"] { box-shadow: inset 0 0 0 2px currentColor; }
.rg-x { text-align: right; min-width: 0; }
.rb-g { font-family: var(--num); font-stretch: 108%; font-weight: 800; font-size: 17px; letter-spacing: -.02em; line-height: 1.1; color: var(--ink); white-space: nowrap; }
.rb-g small { font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-right: 3px; }
.rg-today .rb-g { color: var(--blue); }
.bad .rg-today .rb-g { color: var(--red); }
.rb-c { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--good); white-space: nowrap; }
.rb-c svg { width: 14px; height: 14px; flex: none; }
.rb-c .n { font-family: var(--num); font-weight: 700; }
.rb-c.no { color: var(--red); }
.rb-c.na { color: var(--muted); font-weight: 400; }
.rb-tag { display: table; font-size: 11px; font-weight: 600; line-height: 1.6; color: #fff; background: var(--blue); border-radius: 999px; padding: 0 7px; }
.rg-more { grid-column: 1 / -1; margin: 4px 0 6px; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--rule); display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.rg-more .rg-mt { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; }
.rg-more .rg-mt b { color: var(--ink); font-weight: 600; }
.rg-more .rg-mt .rb-g { font-size: 15px; font-weight: 700; }
.rg-more .note { font-size: 12px; color: var(--muted); }
@media (max-width: 420px) {   /* narrow phones: tighter columns, the window numbers stay 4 characters + sign */
  .rg-row { grid-template-columns: 42px repeat(4, minmax(0, 1fr)) 78px; gap: 3px; }
  .rg-c { font-size: 12px; }
  .rb-g { font-size: 15px; }
}
.rb-more { display: flex; margin: 0 0 4px; }
.rb-more button { appearance: none; cursor: pointer; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px; min-height: 40px; font-size: 13px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: border-color 160ms; }
@media (hover: hover) { .rb-more button:hover { border-color: var(--blue-2); } }
.rb-more button:active { transform: scale(.97); }
.rb-foot { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.rb-foot i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.empty { font-size: 14px; color: var(--muted); margin: 0; }
.kv { display: grid; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule-2); font-size: 14px; color: var(--ink-2); }
.kv div:first-child { border-top: 0; padding-top: 0; }
.kv div:last-child { padding-bottom: 0; }
.kv b { color: var(--ink); font-weight: 600; text-align: right; }
.kv .ok { color: var(--good); }
.kv .no { color: var(--red); }

/* ---------- SIMULATOR ---------- */
.sim { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.sim .hero .big { font-size: clamp(40px, 12vw, 64px); font-stretch: 104%; }
.sim .hero .sub { font-size: 14px; color: var(--blue-ink); margin-top: 6px; }
.bad .sim .hero .sub, .sim.bad .hero .sub { color: var(--red-ink); }
.ctl { display: grid; gap: 2px; }
.ctl + .ctl { margin-top: 16px; }
.ctl .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.ctl .lab b { font-family: var(--num); font-stretch: 108%; font-size: 26px; font-weight: 800; color: var(--blue); letter-spacing: -.02em; }
.ctl input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; margin: 6px 0 2px; height: 30px; background: transparent; cursor: pointer; --p: 50%; }
.ctl input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--blue-2) var(--p), var(--blue-soft) var(--p)); }
.ctl input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--blue-soft); }
.ctl input[type=range]::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--blue-2); }
.ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border-radius: 50%; background: #fff; border: 3px solid var(--blue-2); box-shadow: 0 2px 6px rgba(11, 28, 74, .25); }
.ctl input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--blue-2); box-shadow: 0 2px 6px rgba(11, 28, 74, .25); }
.bad .ctl input[type=range]::-webkit-slider-thumb, .sim.bad .ctl input[type=range]::-webkit-slider-thumb { border-color: var(--blue); }
.ctl .hint { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.ctl .hint .hot { color: #9a5b00; font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills.row { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; }
.pills.row button { justify-content: center; padding: 7px 4px; }
.pills.two button { flex-direction: column; gap: 0; line-height: 1.3; }
.pills.stack { display: grid; grid-template-columns: minmax(0, 1fr); }
.pills.stack button { justify-content: space-between; }
@media (min-width: 900px) { .pills.stack { grid-template-columns: repeat(3, minmax(0, 1fr)); } .pills.stack button { flex-direction: column; justify-content: center; gap: 0; } }

function drawIn(node, delay, dur = 900) { node.setAttribute("pathLength", 1); return run(node, [{ strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 0 }], delay, dur); }
function rise(node, delay, dur = 550) { node.style.transformBox = "fill-box"; node.style.transformOrigin = "50% 100%"; return run(node, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], delay, dur); }
function fade(node, delay, dur = 350) { return run(node, [{ opacity: 0 }, { opacity: 1 }], delay, dur); }
// bib numerals: navy on the light member hues, white on the dark ones
function bibInk(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] > .25 ? INK : "#fff";
}

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.hidden = false;
  const x = ev.clientX, y = ev.clientY, r = tip.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x + 14)) + "px";
  tip.style.top = (y - r.height - 14 < 8 ? y + 18 : y - r.height - 14) + "px";
}
function hideTip() { tip.hidden = true; }
function hover(node, html) {
  node.style.cursor = "default";
  node.addEventListener("pointerenter", e => showTip(e, html()));
  node.addEventListener("pointermove", e => showTip(e, html()));
  node.addEventListener("pointerleave", hideTip);
}
document.addEventListener("scroll", hideTip, { passive: true });

const ARROW = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const movedAt = (m, date) => m.moved.find(x => x.d === date);
const MW = host => Math.max(260, Math.min(520, host.clientWidth || 300));
const MINI = {
  pair(host, m) {
    const w = MW(host), h = 70, max = Math.max(...m.items.map(x => x[1]));
    const s = svgIn(host, w, h, m.items.map(x => `${x[0]} ${k(x[1])}`).join(", "));
    m.items.forEach(([lab, v, t], i) => {
      const y = 6 + i * 32;
      txt(s, 0, y + 15, lab, { "font-size": 12, fill: INK2 });
      hover(hbar(s, 66, y, (w - 66 - 50) * v / max, 22, { fill: t === "weekday" ? HOT : OFF, class: "mk" }), () => `<b>${lab}</b><div class="r"><span>เฉลี่ยต่อคนต่อวัน</span><b>${full(v)}</b></div>`);
      txt(s, 66 + (w - 66 - 50) * v / max + 6, y + 16, k(v), { "font-size": 13, "font-weight": 600, "font-style": "italic", fill: INK });
    });
  },
  days(host, m) {
    const w = MW(host), h = 96, max = Math.max(...m.items.map(x => x[1])), n = m.items.length, bw = Math.min(56, (w - 8) / n - 6);
    const s = svgIn(host, w, h, "ก้าวเฉลี่ยต่อคนรายวัน"); hatch(s, "mh", OFF);
    m.items.forEach(([lab, v, t, st], i) => {
      const x = 4 + i * (bw + 6), bh = (h - 32) * v / max, y = h - 16 - bh;
      hover(vbar(s, x, y, bw, bh, { fill: st === "est" ? "url(#mh)" : t === "weekday" ? HOT : OFF, stroke: st === "est" ? OFF : null, class: "mk" }), () => `<b>${lab}</b> · ${t === "weekday" ? "วันทำงาน" : "วันหยุด"}<div class="r"><span>เฉลี่ยต่อคน</span><b>${full(v)}</b></div>${st === "est" ? `<div>ประมาณ</div>` : ""}`);
      txt(s, x + bw / 2, h - 3, lab.split(" ")[0], { "text-anchor": "middle", "font-size": 11, fill: MUTED });
      if (i === 0 || i === n - 1 || v === max) txt(s, x + bw / 2, y - 4, k(v), { "text-anchor": "middle", "font-size": 11, "font-weight": 600, fill: INK });
    });
  },
  hours(host, m) {
    const w = MW(host), h = 96, max = Math.max(...m.items), bw = (w - 4) / 24 - 2;
    const s = svgIn(host, w, h, `ก้าวรายชั่วโมง ช่วง ${m.hi[0]}–${m.hi[1]} น. สูงสุด`);
    m.items.forEach((v, i) => {
      const x = 2 + i * (bw + 2), bh = (h - 30) * v / max;
      hover(vbar(s, x, h - 16 - bh, bw, bh, { fill: i >= m.hi[0] && i < m.hi[1] ? OFF : "#c3cbd8", class: "mk" }), () => `<b>${String(i).padStart(2, "0")}:00–${String(i + 1).padStart(2, "0")}:00</b><div class="r"><span>เฉลี่ยต่อคนต่อวัน</span><b>${full(v)}</b></div>`);
    });
    [0, 6, 12, 18, 24].forEach(hr => txt(s, Math.min(w - 8, 2 + hr * (bw + 2)), h - 3, hr === 24 ? "24" : String(hr).padStart(2, "0"), { "text-anchor": hr ? "middle" : "start", "font-size": 11, fill: MUTED }));
  },
  share(host, m) {
    const w = MW(host), h = 72, tot = m.items.reduce((s, x) => s + x[1], 0);
    const s = svgIn(host, w, h, "สัดส่วนยอดของแต่ละคน");
    let x = 0, top2 = 0;
    m.items.forEach(([a, v], i) => {

      if (i < 2) top2 += bw + 2;
      x += bw + 2;
    });
    // bracket over the two leaders, the rest labelled as one group
    el("path", { d: `M1,40V46H${top2 - 3}V40`, fill: "none", stroke: INK, "stroke-width": 1.2 }, s);
    txt(s, 0, 64, `${m.items[0][0]} + ${m.items[1][0]}`, { "font-size": 12, "font-weight": 600, fill: INK });
    txt(s, w, 64, `อีก ${m.items.length - 2} คน`, { "text-anchor": "end", "font-size": 12, fill: MUTED });
  },
  slope(host, m) {
    const w = MW(host), h = 104, max = Math.max(...m.items.map(x => x[1])), Y = v => 14 + (h - 30) * (1 - v / max), xa = 40, xb = w - 120;
    const s = svgIn(host, w, h, "เฉลี่ยวันหยุดเทียบวันทำงานของแต่ละคน");
    txt(s, xa, h - 2, "วันหยุด", { "text-anchor": "middle", "font-size": 11, fill: MUTED });
    txt(s, xb, h - 2, "วันทำงาน", { "text-anchor": "middle", "font-size": 11, fill: MUTED });
    const order = [...m.items].sort((a, b) => (a[0] === m.hi) - (b[0] === m.hi));
    for (const [a, o, wk] of order) {
      const on = a === m.hi, col = on ? hue[a] : "#c3cbd8";
      el("line", { x1: xa, x2: xb, y1: Y(o), y2: Y(wk), stroke: col, "stroke-width": on ? 3 : 1.5 }, s);
      el("circle", { cx: xa, cy: Y(o), r: on ? 5 : 3, fill: col }, s);
      el("circle", { cx: xb, cy: Y(wk), r: on ? 5 : 3, fill: col }, s);
      if (on) { txt(s, xb + 8, Y(wk) + 4, `${a} ${k(wk)}`, { "font-size": 12, "font-weight": 600, fill: INK }); txt(s, xa - 8, Y(o) + 4, k(o), { "text-anchor": "end", "font-size": 12, "font-weight": 600, fill: INK }); }
    }
  },
};

/* ================= WAR ROOM (user, 2026-10-31) =================
   Today against the team next to us in the ranking (rank 1 while we chase, rank 2 once we lead). Every number comes
   from tools/build_lead.py (D.war); the page only draws. Blue = we walked more today, red = we fell behind. */
const WR = D.war, SM = D.sim;
const hm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const KIND = { weekday: "วันทำงาน", off: "วันหยุด" };
const ARROW_IN = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6L5 14M5 7v7h7"/></svg>`;
const ARROW_OUT = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 14L15 6M8 6h7v7"/></svg>`;
const ALERT = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l8 14H2z"/><path d="M10 8v4M10 14.5v.5"/></svg>`;
const rvName = r => `อันดับ ${r}`;

// freshness: how long ago the last Team Ranking capture was (the page is rebuilt about every hour)
function drawFresh() {
  const f = $("#fresh"), at = WR ? WR.as_of : D.as_of;
  const t = new Date(`${at.date}T${at.time}:00+07:00`), h = (Date.now() - t) / 36e5;
  const ago = h < 1 ? "" : h < 24 ? ` · ${Math.floor(h)} ชม.ที่แล้ว` : ` · ${Math.floor(h / 24)} วันที่แล้ว`;
  f.className = "fresh" + (h >= 6 ? " stale" : h >= 2 ? " old" : "");
  f.lastElementChild.textContent = `${h >= 24 ? at.label + " " : ""}อัปเดต ${at.time}${ago}`;
}

function drawWar() {
  const host = $("#war");
  if (!WR) { host.innerHTML = `<div class="panel pad"><p class="empty">ยังไม่มีภาพ Team Ranking ที่อ่านได้ แคปหน้า Team Ranking แล้วรันใหม่</p></div>`; return; }
  const chase = WR.mode === "chase", rv = rvName(WR.rival.rank), a = WR.as_of, T = WR.today;
  const good = T.us >= T.rival;
  host.className = "war" + (good ? "" : " bad");
  const moved = WR.base.gap - WR.gap;                    // + = good for us (the gap closed, or our lead grew)
  const since = WR.base.night ? "เทียบกับเมื่อวาน" : `ตั้งแต่ ${WR.base.time}`;
  const dtext = chase ? (moved >= 0 ? `ระยะห่างแคบลง <span class="n">${full(moved)}</span> ${since}` : `ระยะห่างขยับขึ้น <span class="n">${full(-moved)}</span> ${since}`)
    : (moved >= 0 ? `นำเพิ่ม <span class="n">${full(moved)}</span> ${since}` : `นำลดลง <span class="n">${full(-moved)}</span> ${since}`);
  const alarm = chase ? `วันนี้${rv} เดินมากกว่าเรา ${full(T.rival - T.us)} ก้าวต่อคน` : `วันนี้${rv} ไล่เข้ามา ${full(T.rival - T.us)} ก้าวต่อคน`;
  const heavy = WR.heavy, now = T.now;
  const warn = heavy ? (now < heavy.from * 60
      ? `<b>ช่วงเย็นยังมาไม่ถึง:</b> ${rv} เดิน ${heavy.share}% ของวันช่วง ${heavy.from}–${heavy.to} น. ช่องว่างน่าจะ${chase ? "กว้างขึ้น" : "แคบลง"}ตอนค่ำ แคปอีกทีหลัง ${heavy.to}:00`
      : now < heavy.to * 60 ? `<b>ตอนนี้คือช่วงที่${rv} เดินหนัก:</b> ${heavy.share}% ของวันเขามาช่วง ${heavy.from}–${heavy.to} น. แคปอีกทีหลัง ${heavy.to}:00`
      : `<b>ผ่านช่วงที่${rv} เดินหนักแล้ว</b> (${heavy.from}–${heavy.to} น.) ตัวเลขตอนนี้ใกล้ยอดจบวันแล้ว`) : "";
  const tg = WR.target, pct = tg.today ? Math.round(T.us / tg.today * 100) : 0;
  const ms = WR.moments;
  host.innerHTML = `
    <section class="hero" aria-label="สถานะตอนนี้">
      <div class="when">${a.dow} ${a.label} · ${KIND[a.kind]} · ${a.days_left ? `อีก ${a.days_left} วันจบการแข่ง` : "วันสุดท้ายของการแข่ง"}</div>
      <div class="verb">${chase ? `ตามหลัง${rv}` : `นำ${rv}`}</div>
      <div class="big">${full(Math.abs(WR.gap))}</div>
      <div class="unit">ก้าวต่อคน</div>
      <div class="delta">${moved >= 0 ? ARROW_IN : ARROW_OUT}<span>${dtext}</span></div>
      <div class="rule" id="dist"></div>
      <div class="alarm" role="status">${ALERT}<span>${alarm}</span></div>
    </section>
    <section class="panel pad w-vs" id="day" aria-label="ก้าวสะสมรายวัน"></section>
    ${WR.race && WR.race.days.length ? `<section class="panel pad w-race" id="race" aria-label="ระยะห่างรายวัน"></section>` : ""}
    ${warn ? `<section class="warn">${warn}</section>` : ""}
    <section class="panel pad goal">

      <div class="row1"><span class="v">${full(T.us)}<small>จาก ${full(tg.today)}</small></span><span class="pct">${pct}%</span></div>
      <div class="track"><i style="width:${Math.min(100, pct)}%"></i><b class="${tg.by_now / tg.today > .75 ? "end" : tg.by_now / tg.today < .2 ? "start" : ""}" style="left:${Math.min(100, tg.by_now / tg.today * 100).toFixed(1)}%"><span>ควรถึงตอนนี้ ${full(tg.by_now)}</span></b></div>
      <div class="foot"><span>ตามจังหวะปกติของ${KIND[tg.kind]}</span><span>${T.us >= tg.today ? "ถึงเป้าแล้ว" : `อีก ${full(tg.today - T.us)}`}</span></div>
    </section>
    <section class="panel pad w-mom">
      <div class="h">เหตุการณ์สำคัญวันนี้<span>ช่วงที่ระยะห่างขยับเกิน 500</span></div>
      ${ms.length ? `<div class="tl">${ms.map(m => m.gain == null
        ? `<div class="best"><span class="tm">${m.time}</span><span>${esc(m.text)}</span><span></span></div>`
        : `<div class="${m.gain > 0 ? "g" : ""}${m.from ? " run" : ""}"><span class="tm">${m.from ? `${esc(m.from)}<small>–${m.time}</small>` : m.time}</span><span>${esc(m.text)}</span><span class="d">${m.gain > 0 ? "+" : ""}${full(Math.abs(m.gain))}</span>${whoStrip(m.who, true)}</div>`).join("")}</div>`
        : `<p class="empty">วันนี้ยังไม่มีช่วงไหนที่ระยะห่างขยับเกิน 500</p>`}
    </section>`;
  drawDistance($("#dist"), good);
  drawDay();
  drawRace();
}

// who on the rival team added the steps since the capture before (user, 2026-11-02): w = {items: [[alias, steps]],
// total} from build_lead.py (member screenshots taken with the Team Ranking captures). Up to 3 gainers are named; with
// more, the top 2 are named and the rest grouped. Each member's own steps, not per person; no judgement, aliases only.
function whoStrip(w, slim) {
  if (!w || !w.total) return "";
  const named = w.items.length <= (slim ? 2 : 3) ? w.items : w.items.slice(0, 2), rest = w.items.slice(named.length);
  const rs = rest.reduce((a, x) => a + x[1], 0), pc = v => (v / w.total * 100).toFixed(1);
  const bar = named.map(([a, v]) => `<i style="width:${pc(v)}%;background:${hue[a]}"></i>`).join("") +
    (rs ? `<i class="rest" style="width:${pc(rs)}%"></i>` : "");
  const lg = named.map(([a, v]) => `<span><i style="background:${hue[a]}"></i>${esc(a)} <b>+${k(v)}</b></span>`).join("") +
    (rs && !slim ? `<span><i class="rest"></i>อีก ${rest.length} คน <b>+${k(rs)}</b></span>` : "");   // slim (key moments): the event's own number is the total
  const say = named.map(([a, v]) => `${a} ${full(v)}`).concat(rs ? [`อีก ${rest.length} คน ${full(rs)}`] : []).join(", ");
  return `<span class="wa${slim ? " slim" : ""}" role="img" aria-label="ก้าวที่${rvName(WR.rival.rank)}เพิ่มมาจาก ${esc(say)}">${slim ? "" : `<span class="wa-bar" aria-hidden="true">${bar}</span>`}` +
    `<span class="wa-lg" aria-hidden="true">${lg}</span></span>`;
}

// the vs panel for one day (user, 2026-11-01): today by default, chevrons step back to earlier days with captures
let warDay = null;   // index into WR.history; null = the latest day
const CHEV_L = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5"/></svg>`;
function drawDay(focusBtn) {
  const host = $("#day"), H = WR.history || [], rv = rvName(WR.rival.rank);
  const last = H.length - 1, i = warDay == null ? last : warDay;
  const d = H[i] || { ...WR.today, date: WR.as_of.date, night: WR.base.night, base_time: WR.base.time, kind: WR.as_of.kind, ghost: WR.ghost, heavy: WR.heavy };
  const isToday = d.date === WR.as_of.date, good = d.us >= d.rival;
  const since = isToday ? (WR.base.night ? "เทียบกับเมื่อวาน" : `ตั้งแต่ ${WR.base.time}`) : (d.night ? "เทียบกับวันก่อน" : `ตั้งแต่ ${d.base_time}`);
  const nm = j => H[j] ? (H[j].date === WR.as_of.date ? "วันนี้" : `${H[j].dow} ${H[j].label}`) : "";
  host.innerHTML = `
    <div class="h day-h">
      <span class="ttl">${isToday ? "วันนี้" : `${d.dow} ${d.label} `}เดินไปเท่าไร<small>ก้าวต่อคน ${since}</small></span>
      ${H.length > 1 ? `<span class="dnav">
        <button type="button" data-step="-1" ${i <= 0 ? "disabled" : ""} aria-label="${i > 0 ? `ดู ${nm(i - 1)}` : "ไม่มีวันก่อนหน้า"}">${CHEV_L}</button>
        <button type="button" data-step="1" ${i >= last ? "disabled" : ""} aria-label="${i < last ? `ดู ${nm(i + 1)}` : "นี่คือวันล่าสุด"}">${CHEV}</button>
      </span>` : ""}
    </div>
    <div class="vs${good ? "" : " lost"}">
      <div class="t us"><span class="who">ทีมเรา</span><span class="v">${full(d.us)}</span></div>
      <span class="x">vs</span>
      <div class="t r rv"><span class="who">${rv}</span><span class="v">${full(d.rival)}</span></div>
    </div>
    <div class="readout" id="readout" aria-live="polite"></div>
    <div class="today-c" id="today"></div>`;
  host.querySelectorAll(".dnav button").forEach(b => b.addEventListener("click", () => {
    const j = i + Number(b.dataset.step);
    warDay = j >= last ? null : j;
    drawDay(b.dataset.step);
  }));
  if (focusBtn) {   // keep keyboard focus on the chevron just pressed (or its neighbour when it became disabled)
    const bs = host.querySelectorAll(".dnav button"), b = bs[focusBtn === "1" ? 1 : 0];
    (b.disabled ? bs[focusBtn === "1" ? 0 : 1] : b).focus();
  }
  drawToday($("#today"), d, isToday, good);
}

// race board (user, 2026-11-03): a day × window grid, newest day first, the latest R.show days (the rest behind a
// toggle). A window cell = how the gap moved in it (+ = good for us, blue; − = bad, red), so a day's cells add up to
// its change in the last column; a window with no capture is merged into the next (build_lead.py race_windows), "รอ"
// = still ahead today, "–" = nothing to compare. Tapping a cell opens its detail under the day (one at a time): the
// capture, the gap then and, on past days, which rival members added steps (today's live in key moments only).
const UP = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4.5M5 9.5l5-5 5 5"/></svg>`;
const DOWN = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v11.5M5 10.5l5 5 5-5"/></svg>`;
const CHEV = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>`;
const WIN_FROM = ["เมื่อคืน", "09:00", "15:00", "21:00"], WIN_TO = ["09:00", "15:00", "21:00", "ปิดวัน"];
const WIN_HEAD = ["ถึง<br>9 โมง", "9–15", "15–21", "21–ปิด"];
let raceAll = false, raceOpen = null;   // raceOpen = "date/window index"
function drawRace(focusKey) {
  const host = $("#race"), R = WR.race;
  if (!host || !R) return;
  const chase = WR.mode === "chase", rv = rvName(WR.rival.rank);
  const gw = chase ? ["ไล่ได้", "โดนไล่คืน"] : ["นำเพิ่ม", "นำลดลง"];
  const gapTxt = g => (g > 0) === chase ? full(Math.abs(g)) : `<small>${g > 0 ? "ตาม" : g < 0 ? "นำ" : "เสมอ"}</small>${full(Math.abs(g))}`;
  const chg = (c, word) => {
    if (c == null) return `<span class="rb-c na">–</span>`;
    if (c === 0) return `<span class="rb-c na">เท่าเดิม</span>`;
    return `<span class="rb-c ${c > 0 ? "ok" : "no"}">${c > 0 ? UP : DOWN}${word ? `<span>${gw[c > 0 ? 0 : 1]}</span>` : ""}<span class="n">${full(Math.abs(c))}</span></span>`;
  };
  const short = v => { const a = Math.abs(v); return (v > 0 ? "+" : "−") + (a < 1000 ? a : a < 9950 ? (a / 1000).toFixed(1) + "k" : Math.round(a / 1000) + "k"); };
  const range = (d, w) => `${WIN_FROM[w.c0]}–${w.c1 === 3 && d.today ? "ตอนนี้" : WIN_TO[w.c1]}`;
  const cell = (d, w, j) => {
    const span = `grid-column:${w.c0 + 2} / ${w.c1 + 3}`, name = `${d.dow} ${d.label} ${range(d, w)}`;
    if (w.state === "wait") return `<span class="rg-c wt" style="${span}" aria-label="${name} ยังไม่ถึงเวลา">รอ</span>`;
    if (w.state === "none" || w.change == null)
      return `<span class="rg-c" style="${span}" aria-label="${name} ไม่มีภาพให้เทียบ">–</span>`;
    const key = `${d.date}/${j}`, c = w.change;
    const cls = c > 0 ? "up" : c < 0 ? "dn" : "eq";
    return `<button type="button" class="rg-c ${cls}${w.live ? " live" : ""}" style="${span}" data-k="${key}" aria-expanded="${raceOpen === key}"` +
      ` aria-label="${name} ${c === 0 ? "เท่าเดิม" : `${gw[c > 0 ? 0 : 1]} ${full(Math.abs(c))}`}">${c === 0 ? "เท่าเดิม" : short(c)}</button>`;
  };
  const more = (d, w) => `<div class="rg-more" role="region" aria-label="รายละเอียด ${d.dow} ${d.label} ${range(d, w)}">` +
    `<div class="rg-mt"><span><b>${d.dow} ${d.label} · ${range(d, w)}</b> (ภาพ ${w.time})</span><span>${chase ? "ตามอยู่" : "นำอยู่"} <span class="rb-g">${full(Math.abs(w.gap))}</span></span></div>` +
    `<div>${chg(w.change, true)}${w.c0 !== w.c1 ? ` <span class="note">(ไม่มีภาพที่ ${WIN_TO.slice(w.c0, w.c1).join(", ")} จึงรวมเป็นช่วงเดียว)</span>` : ""}</div>` +
    (d.today ? `<div class="note">ใครเดินช่วงไหนวันนี้ ดูที่เหตุการณ์สำคัญวันนี้</div>` : w.who && w.who.total ? `<div class="note">ฝั่ง${rv}เพิ่มจาก</div>${whoStrip(w.who)}` : "") + `</div>`;
  const row = d => {
    const open = d.win.findIndex((w, j) => raceOpen === `${d.date}/${j}`);
    return `<div class="rg-row${d.today ? " rg-today" : ""}">` +
      `<span class="rg-d">${d.dow} ${d.label.split(" ")[0]}${d.today ? `<span class="rb-tag">วันนี้</span>` : `<small>${d.label.split(" ")[1]}</small>`}</span>` +
      d.win.map((w, j) => cell(d, w, j)).join("") +
      `<span class="rg-x"><span class="rb-g">${gapTxt(d.gap)}</span><br>${chg(d.change)}</span>` +
      (open >= 0 ? more(d, d.win[open]) : "") + `</div>`;
  };
  // newest day first (user, 2026-11-02): the list is built oldest-first in build_lead.py, shown reversed here
  const newest = R.days.slice().reverse();
  const hidden = Math.max(0, newest.length - R.show), shown = raceAll ? newest : newest.slice(0, R.show);
  host.innerHTML = `<div class="h">ระยะห่างรายวัน<span>ก้าวต่อคน · เรา vs ${rv}</span></div>` +
    `<div class="rg"><div class="rg-row rg-head" aria-hidden="true"><span></span>${WIN_HEAD.map(t => `<span>${t}</span>`).join("")}<span>ปิดวัน</span></div>` +
    shown.map(row).join("") + `</div>` +
    (hidden ? `<div class="rb-more" style="margin-top:8px"><button type="button" aria-expanded="${raceAll}">${raceAll ? `ย่อเหลือ ${R.show} วันล่าสุด` : `ดูทั้งหมด ${R.days.length} วัน`}</button></div>` : "") +
    `<p class="rb-foot"><i style="background:var(--good-soft);box-shadow:inset 0 0 0 1px var(--good)"></i>${gw[0]} <i style="background:var(--red-soft);box-shadow:inset 0 0 0 1px var(--red);margin-left:8px"></i>${gw[1]} ในช่วงนั้น · แตะช่องเพื่อดูรายละเอียด</p>`;
  host.querySelectorAll("button.rg-c").forEach(b => b.addEventListener("click", () => {
    raceOpen = raceOpen === b.dataset.k ? null : b.dataset.k;
    drawRace(b.dataset.k);
  }));
  if (focusKey) { const b = host.querySelector(`button.rg-c[data-k="${focusKey}"]`); if (b) b.focus(); }
  const b = host.querySelector(".rb-more button");
  if (b) b.addEventListener("click", () => { raceAll = !raceAll; drawRace(); host.querySelector(".rb-more button").focus(); });
}

// distance rule: one bar from "level with them" (right end) back to the gap; hollow = last night, solid = now
function drawDistance(host, good) {
  const w = Math.max(260, Math.min(host.clientWidth || 320, 520)), h = 56, L = 8, R = w - 8, y = 28;
  const s = svgIn(host, w, h, `ระยะห่าง${WR.base.night ? "เมื่อคืน" : ""} ${full(Math.abs(WR.base.gap))} ตอนนี้ ${full(Math.abs(WR.gap))}`);
  const max = Math.max(Math.abs(WR.base.gap), Math.abs(WR.gap), 1);   // the left end is whichever gap is larger: both ends carry a label
  const X = v => L + (R - L) * (1 - Math.min(max, Math.abs(v)) / max);
  const a = X(WR.base.gap), b = X(WR.gap);
  el("line", { x1: L, x2: R, y1: y, y2: y, stroke: "#fff", "stroke-opacity": .2, "stroke-width": 6, "stroke-linecap": "round" }, s);
  run(el("line", { x1: Math.min(a, b), x2: Math.max(a, b), y1: y, y2: y, stroke: good ? C("--sky") : "#fff", "stroke-width": 6, "stroke-linecap": "round" }, s), [{ opacity: 0 }, { opacity: 1 }], 200, 500);
  el("line", { x1: a, x2: a, y1: y - 7, y2: y + 7, stroke: "#fff", "stroke-opacity": .7, "stroke-width": 2, "stroke-linecap": "round" }, s);
  run(el("rect", { x: b - 2, y: y - 12, width: 4, height: 24, rx: 2, fill: good ? C("--sky") : "#fff" }, s),
    [{ transform: `translate(${a - b}px, 0)` }, { transform: "none" }], 150, 900);
  el("line", { x1: R, x2: R, y1: y - 10, y2: y + 10, stroke: "#fff", "stroke-width": 2, "stroke-linecap": "round" }, s);
  txt(s, R, y - 15, WR.mode === "chase" ? `ทัน${rvName(WR.rival.rank)}` : "เสมอกัน", { "text-anchor": "end", "font-size": 11, "font-weight": 600, fill: "#fff" });
  txt(s, Math.max(L, Math.min(R - 40, a)), y + 24, `${WR.base.night ? "เมื่อคืน" : WR.base.time} ${full(Math.abs(WR.base.gap))}`, { "text-anchor": a < 60 ? "start" : "middle", "font-size": 11, fill: "#fff", "fill-opacity": .8 });
  txt(s, b, y - 15, "ตอนนี้", { "text-anchor": b < L + 24 ? "start" : "middle", "font-size": 11, "font-weight": 700, fill: "#fff" });
}

// one day's steps for both teams as two rising lines; the space between them is who is winning the day.
// Distilled (user, 2026-10-31): no grid, no legend, names at the line ends, the rest of the day faded.
// Time window (user, 2026-11-01): today before 18:00 zooms to the hours that matter (from the first walking up to
// about an hour past now); from 18:00 and on past days it shows the whole day. 00:00-06:00 is cut whenever
// nobody walked then (no capture with steps before 06:00).
function drawToday(host, d, isToday, good) {
  const w = W(host), narrow = w < 560, L = 0;
  let h = 210;
  if (!narrow) {   // desktop: fill the panel down to the bottom of the left column
    const g = $(".war .goal"), top_ = host.getBoundingClientRect().top;
    h = Math.max(300, Math.round(g ? g.getBoundingClientRect().bottom - top_ - 20 : 300));
  }
  const R = w - (narrow ? 72 : 96), top = 24, bot = h - 20;
  const G = d.ghost, rv = rvName(WR.rival.rank), now = isToday ? WR.today.now : null;
  const raw = d.series, end = raw[raw.length - 1][0];
  // window
  const x0 = raw.some(r => r[0] < 360 && (r[1] || r[2])) ? 0 : 360;
  const focus = isToday && now < 1080;
  const x1 = focus ? Math.min(1440, Math.max(Math.ceil((now + 60) / 60) * 60, x0 + 360)) : 1440;
  const S = raw.filter(r => r[0] >= x0);
  if (!S.length) S.push(raw[raw.length - 1]);   // lines start at the first real capture inside the window
  const ghostAt = m => { if (!G) return null; const h_ = Math.min(23, Math.floor(m / 60)), a = h_ ? G[h_ - 1] : 0; return a + (G[h_] - a) * (m - h_ * 60) / 60; };
  const top_v = focus ? Math.max(d.us, d.rival, G ? ghostAt(x1) : 0, 1) * 1.12
    : Math.max(d.us, d.rival, G ? G[23] : 0, isToday ? WR.target.today * .4 : 0, 1) * 1.05;
  const X = m => L + (R - L) * (m - x0) / (x1 - x0), Y = v => bot - (bot - top) * v / top_v;
  const s = svgIn(host, w, h, `ก้าวสะสม${isToday ? "วันนี้" : `${d.dow} ${d.label}`} ทีมเรา ${full(d.us)} ${rv} ${full(d.rival)}`);
  const usC = good ? C("--blue-2") : C("--blue"), rvC = good ? C("--ld") : C("--red-2"), mu = C("--muted");
  if (isToday) el("rect", { x: X(now), y: top - 12, width: Math.max(0, X(x1) - X(now)), height: bot - top + 12, rx: 8, fill: C("--tint") }, s);
  if (d.heavy) {   // the rival's heavy window, clipped to what the chart shows
    const a = Math.max(x0, d.heavy.from * 60), b = Math.min(x1, d.heavy.to * 60);
    if (b > a) {
      el("rect", { x: X(a), y: top - 2, width: X(b) - X(a), height: bot - top + 2, fill: C("--sky"), "fill-opacity": .14 }, s);
      // the "now" label sits right-aligned above the now line; when the band's label would run into it, tuck the label inside the band instead
      const hx = (X(a) + X(b)) / 2, hit = isToday && hx + 58 > X(now) - 4 - 70;
      txt(s, hx, hit ? top + 12 : top - 10, "ช่วงเวลาคู่แข่งเดินเยอะ", { "text-anchor": "middle", "font-size": 10, "font-weight": 600, fill: C("--sky-ink") });
    }
  }
  el("line", { x1: L, x2: X(x1), y1: bot, y2: bot, stroke: C("--rule"), "stroke-width": 1.5 }, s);
  if (G) {
    const gp = [[x0, ghostAt(x0)], ...G.map((v, i) => [(i + 1) * 60, v]).filter(([m]) => m > x0 && m < x1), [x1, ghostAt(x1)]];
    el("path", { d: "M" + gp.map(([m, v]) => `${X(m).toFixed(1)},${Y(v).toFixed(1)}`).join(" L"), fill: "none", stroke: C("--ghost"), "stroke-width": 2, "stroke-dasharray": "0.5 5", "stroke-linecap": "round" }, s);
  }
  const P_ = i => S.map(r => `${X(r[0]).toFixed(1)},${Y(r[i]).toFixed(1)}`);
  fade(el("path", { d: "M" + P_(1).join(" L") + " L" + P_(2).reverse().join(" L") + " Z", fill: good ? C("--blue-tint") : C("--red-tint") }, s), 600, 500);
  drawIn(el("path", { d: "M" + P_(2).join(" L"), fill: "none", stroke: rvC, "stroke-width": 2, "stroke-linejoin": "round" }, s), 0, 900);
  drawIn(el("path", { d: "M" + P_(1).join(" L"), fill: "none", stroke: usC, "stroke-width": 3.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, s), 100, 900);
  // line ends: today at "now", a past day at its last capture
  const at = isToday ? now : end, yU = Y(d.us), yR = Y(d.rival);
  el("circle", { cx: X(at), cy: yU, r: 5, fill: usC, stroke: "#fff", "stroke-width": 2 }, s);
  el("circle", { cx: X(at), cy: yR, r: 4, fill: rvC, stroke: "#fff", "stroke-width": 2 }, s);
  let lu = yU, lr = yR;
  if (Math.abs(lu - lr) < 28) { const m = (lu + lr) / 2, up = d.us >= d.rival; lu = m + (up ? -14 : 14); lr = m + (up ? 14 : -14); }
  const lx = X(at) + 10;
  txt(s, lx, lu - 1, "ทีมเรา", { "font-size": 11, "font-weight": 700, fill: usC });
  txt(s, lx, lu + 12, full(d.us), { "font-size": 11, "font-weight": 700, fill: usC, "font-family": "Archivo, sans-serif" });
  txt(s, lx, lr + 2, rv, { "font-size": 11, "font-weight": 600, fill: rvC });
  txt(s, lx, lr + 15, full(d.rival), { "font-size": 11, "font-weight": 600, fill: rvC, "font-family": "Archivo, sans-serif" });
  if (G) {   // the usual day's name at its right end; skipped when it would sit on the line-end labels
    const gy = Y(ghostAt(x1)), crowded = lx > X(x1) - 70 && (Math.abs(gy - lu) < 30 || Math.abs(gy - lr) < 30);
    if (!crowded) {
      txt(s, X(x1) + 6, gy + 4, `ปกติ${KIND[d.kind]}`, { "font-size": 10, fill: mu });
      if (!focus) txt(s, X(x1) + 6, gy + 17, `~${k(G[23])}`, { "font-size": 10, "font-weight": 600, fill: mu });
    }
  }
  if (isToday) {
    el("line", { x1: X(now), x2: X(now), y1: top - 6, y2: bot, stroke: C("--ink"), "stroke-opacity": .35, "stroke-width": 1.5 }, s);
    txt(s, X(now) - 4, top - 10, `ตอนนี้ ${hm(now)}`, { "text-anchor": "end", "font-size": 10, "font-weight": 600, fill: mu });
  }
  // clock labels: every 2 h in a short window, every 6 h (from the window start) otherwise
  const step = x1 - x0 <= 600 ? 120 : 360;
  for (let m = Math.ceil(x0 / step) * step; m <= x1; m += step)
    txt(s, X(m), h - 3, hm(m), { "text-anchor": m === x0 ? "start" : m === x1 ? "end" : "middle", "font-size": 10, fill: mu });
  // scrub: the readout follows the finger; leaving it shows the usual-day comparison
  const cur = el("g", { opacity: 0 }, s);
  el("line", { x1: 0, x2: 0, y1: top, y2: bot, stroke: C("--blue"), "stroke-opacity": .5 }, cur);
  const c1 = el("circle", { r: 5, fill: usC, stroke: "#fff", "stroke-width": 2 }, cur), c2 = el("circle", { r: 4, fill: rvC, stroke: "#fff", "stroke-width": 2 }, cur);
  const ro = $("#readout"), from = d.night ? "วันนั้นเขาเดิน" : `ตั้งแต่ ${d.base_time} เขาเดิน`;
  const read = m => {
    if (m == null || m >= at || m < S[0][0]) {
      cur.setAttribute("opacity", 0);
      ro.innerHTML = isToday
        ? (G ? `${KIND[d.kind]}ปกติ เวลานี้${rv} เดินได้ราว <b>${full(ghostAt(now))}</b> วันนี้เขาเดิน <b>${full(d.rival)}</b>` : `แตะหรือลากบนกราฟเพื่อดูตัวเลข ณ เวลานั้น`)
        : (G ? `${KIND[d.kind]}ปกติ ${rv} เดินทั้งวันราว <b>${full(G[23])}</b> ${from} <b>${full(d.rival)}</b>` : `ภาพสุดท้ายของวัน ${d.close} แตะหรือลากบนกราฟเพื่อดูตัวเลข ณ เวลานั้น`);
      return;
    }
    let r = S[0]; for (const x of S) if (x[0] <= m) r = x;
    cur.setAttribute("opacity", 1); cur.setAttribute("transform", `translate(${X(m)},0)`);
    c1.setAttribute("cy", Y(r[1])); c2.setAttribute("cy", Y(r[2]));
    ro.innerHTML = `<b>${hm(r[0])}</b> ทีมเรา <b>${full(r[1])}</b> vs <b>${full(r[2])}</b> ${rv}`;
  };
  const pick = e => { const b = s.getBoundingClientRect(), x = (e.clientX - b.left) * w / b.width; return Math.max(x0, Math.min(x1, Math.round(x0 + (x - L) / (R - L) * (x1 - x0)))); };
  s.addEventListener("pointermove", e => read(pick(e)));
  s.addEventListener("pointerdown", e => read(pick(e)));
  s.addEventListener("pointerleave", () => read(null));
  read(null);
}

/* ================= SIMULATOR =================
   Inputs come from tools/build_lead.py (D.sim): the remaining days, what the other team walks on each (low / usual /
   high from its own past days), today's share still to come, and the plans per deadline day for the rival's usual / strong walk (build_lead computes every number).
   The page only adds them up: gap_end = gap_now − Σ (ours × share of the day − theirs).
   The target is a per-person average. "Carriers" only re-split that same average over the team (k people walk x every
   day, the rest walk what is left), so the chart never moves with them and the table always agrees with it. */
const SIMK = "rwr-sim3";
const simState = (() => {
  const d = { cover: 0, day: null, k: 0, x: null, custom: false, wk: null, off: null };
  try { return { ...d, ...JSON.parse(localStorage.getItem(SIMK) || "{}") }; } catch (e) { return d; }
})();
const saveSim = () => { try { localStorage.setItem(SIMK, JSON.stringify(simState)); } catch (e) { /* private mode */ } };
let simDockObs = null;   // scroll handler that shows the phone result bar, added once
let simCopyTimer = null;

// the plan in force: the ready-made target for the chosen cover, or the typed-in numbers
// the deadline day: planning starts tomorrow (today has only its last few hours left), default = the last day
const simDays = () => SM.days.map((d, i) => i).filter(i => i >= 1);
function simDay() {
  const ds = simDays(), last = ds[ds.length - 1];
  return simState.day != null && ds.includes(simState.day) ? simState.day : last;
}
function simPlan() {
  const cover = Math.min(simState.cover, SM.plans.length - 1), day = simDay();
  const t = SM.plans[cover][day];
  return simState.custom ? { weekday: simState.wk ?? t.weekday, off: simState.off ?? t.off, cover, day } : { ...t, cover, day };
}
// who walks what: k carriers at x every day, the rest make up the team average (rounded up to 100 so the average never dips under the plan)
function simSplit(plan) {
  const n = SM.members, kk = Math.min(simState.k, SM.carry.max_k, n - 1);
  const lo = Math.ceil(plan.off / 1000) * 1000;
  const hi = kk ? Math.max(lo, Math.floor(Math.min(SM.carry.max_steps, n * Math.min(plan.weekday, plan.off) / kk) / SM.carry.step) * SM.carry.step) : lo;
  const x = Math.min(hi, Math.max(lo, simState.x ?? lo + 5000));
  const rest = t => kk ? Math.max(0, Math.ceil((n * plan[t] - kk * x) / (n - kk) / 100) * 100) : plan[t];
  return { n, kk, lo, hi, x, rest: { weekday: rest("weekday"), off: rest("off") } };
}

function simRun(plan) {
  const j = SM.scenarios ? plan.cover + 1 : 1;
  let g = SM.g0, cross = null, cum = WR ? WR.us.avg : 0;
  const pts = [g], ours = [];
  SM.days.forEach((d, i) => {
    const o = plan[d.kind === "off" ? "off" : "weekday"] * d.frac;
    g -= o - d.rival[j]; cum += o;
    pts.push(g); ours.push(Math.round(cum));
    if (cross === null && g <= 0) cross = i;
  });
  return { pts, cross, end: g, ours };
}

  const covers = SM.scenarios ? ["คู่แข่งเดินปกติ", "คู่แข่งเดินแรง"] : [];
  const part = SM.days[0].today && SM.days[0].frac < 1;

// the message for the group chat: aliases and numbers only, no team or person names
function simCopyText() {

  $("#s-out").innerHTML = sp.kk ? row(`เดอะแบก ${sp.kk} คน`, sp.x, sp.x, "hv") + row(`อีก ${sp.n - sp.kk} คน`, sp.rest.weekday, sp.rest.off)

  const ourL = [WR ? WR.us.avg : 0, ...r.ours], rvL = ourL.map((v, i) => v + r.pts[i]);   // both lines are average steps per person: up = more steps

  // two lines of average steps per person: ours (white, solid) vs rival (dashed). Walk more = our line climbs toward / past theirs
  const c = $("#s-chart"), w = Math.max(260, Math.min(c.clientWidth || 320, 640)), h = 190, L = 4, R = w - 96, top = 14, bot = h - 22;

  const marks = [[0, "วันนี้"], ...SM.checkpoints.map(i => [i + 1, SM.days[i].label])];
  marks.filter(([i], j) => j === 0 || X(i) - X(0) > 46).forEach(([i, l], j) => txt(s, X(i), h - 4, l, { "text-anchor": j === 0 ? "start" : i === ourL.length - 1 ? "end" : "middle", "font-size": 10, fill: "#fff", "fill-opacity": .8 }));

function viewDaily(host) {

  host.innerHTML = `<h2>${f ? `ก้าวต่อวันของ ${esc(f)}` : `ก้าวเฉลี่ยต่อคนต่อวัน (${ANL})`}</h2>` +

    `<div class="legend"><span><i style="background:${HOT}"></i>วันทำงาน</span><span><i style="background:${OFF}"></i>วันหยุด</span><span><i class="hatch"></i>ประมาณ</span><span><i style="border:1.5px dashed ${MUTED}"></i>ยังไม่จบวัน</span></div><div id="c"></div><div class="miss" id="miss"></div><div class="halves" id="halves"></div>`;
  const c = $("#c", host), w = W(c), h = w < 560 ? 230 : 280, L = 40, R = 8, T = 18, B = 40;

  } else mm.innerHTML = "";
  const max = niceMax(Math.max(...vals.filter(v => v != null)) * 1.08);
  const n = days.length, slot = (w - L - R) / n, bw = Math.max(4, slot - (w < 560 ? 3 : 6));
  const Y = v => T + (h - T - B) * (1 - v / max);

  for (const v of ticks(max)) { el("line", { x1: L, x2: w - R, y1: Y(v), y2: Y(v), stroke: v ? RULE2 : RULE }, s); txt(s, L - 6, Y(v) + 4, v ? k(v).replace(".0k", "k") : "0", { "text-anchor": "end", "font-size": 11, fill: MUTED }); }

  days.forEach((d, i) => { if (isOff(d)) el("rect", { x: L + i * slot, y: T - 6, width: slot, height: h - T - B + 6, fill: C("--tint") }, s); });
  days.forEach((d, i) => {
    const x = L + i * slot + (slot - bw) / 2, v = vals[i];
    const show = w >= 560 || i % 2 === 0;
    if (show) txt(s, x + bw / 2, h - B + 16, d.label.split(" ")[0], { "text-anchor": "middle", "font-size": 11, fill: d.status === "future" ? "#7a869c" : INK2 });

// projected cumulative, day by day: today's rest, then each remaining day at its type's rate
const todayIdx = days.findIndex(d => d.status === "partial");
const asofAbs = days.findIndex(d => d.d === D.as_of.date) * 1440 + (+D.as_of.time.slice(0, 2)) * 60 + (+D.as_of.time.slice(3));
function memberPath(m) {
  const p = P.members[m.alias], out = {};
  ["mid", "low", "high"].forEach((name, j) => {
    let v = m.latest; const pts = [[asofAbs, v]];
    if (todayIdx >= 0) { v += p.rest[j]; pts.push([(todayIdx + 1) * 1440, v]); }
    days.forEach((d, i) => { if (d.status === "future") { v += p.rates[isOff(d) ? "off" : "weekday"][j]; pts.push([(i + 1) * 1440, v]); } });
    out[name] = pts;
  });
  return out;
}
function teamPath() {
  const all = M.map(memberPath), out = {};
  for (const name of ["mid", "low", "high"]) out[name] = all[0][name].map((p, i) => [p[0], mean(all.map(a => a[name][i][1]))]);
  return out;
}

      const cell = el("rect", { x: lab + hr * cw + 1, y, width: cw - 2, height: rh, rx: 3, fill: v < 1 ? C("--tint") : `color-mix(in oklab, ${isOff(d) ? OFF : HOT} ${Math.round(10 + t * 85)}%, #ffffff)` }, hs);
      fade(cell, hr * 22, 300);   // a clock sweep across the hours
      hover(cell, () => `<b>${d.dow} ${d.label}</b> ${String(hr).padStart(2, "0")}:00–${String(hr + 1).padStart(2, "0")}:00<div class="r"><span>${f ? esc(f) : "เฉลี่ยต่อคน"}</span><b>${full(v)}</b></div>${d.status === "partial" ? `<div>${STATUS.partial}</div>` : ""}`);
    });
  });
  for (let hr = 0; hr <= 24; hr += 3) txt(hs, lab + hr * cw, hh - 4, String(hr).padStart(2, "0"), { "text-anchor": "middle", "font-size": 11, fill: MUTED });
  drawHourBoard($("#hb", host));
}

// every member × hour of day (user, 2026-11-02): เฉลี่ย = usual steps per hour on finished days of one type, วันนี้ =
// today's steps with each member's usual 3 busiest hours framed. Both modes share one colour scale. All numbers come
// from build_lead.py hour_board(); the page only merges the hours before `from` into one column.
function drawHourBoard(host) {
  const B = D.hour_board;
  if (!host || !B) return;
  const T0 = B.today, today = state.hb === "today", typ = today ? T0.type : (state.hbType || T0.type);
  const TL = { weekday: "วันทำงาน", off: "วันหยุด" }, col = typ === "off" ? OFF : HOT;
  const cols = [Array.from({ length: B.from }, (_, h) => h), ...Array.from({ length: 24 - B.from }, (_, i) => [B.from + i])];
  const sumOf = (arr, hs) => hs.reduce((a, h) => a + (arr ? arr[h] || 0 : 0), 0);
  const nowH = Math.floor(T0.min / 60);
  const cell = (r, hs) => {
    if (!today) return r.usual[typ] ? { v: sumOf(r.usual[typ], hs) } : { none: true };
    if (hs[0] > nowH) return { future: true };
    if (!hs.some(h => r.known[h])) return { unknown: true };
    return { v: sumOf(r.today, hs), part: hs.includes(nowH) };
  };
  // one scale for both modes and both day types, so switching never changes what a shade means
  const gmax = Math.max(1, ...B.members.flatMap(r => cols.flatMap(hs => [sumOf(r.today, hs), sumOf(r.usual.weekday, hs), sumOf(r.usual.off, hs)])));
  const n = Math.max(0, ...B.members.map(r => r.n[typ] || 0));
  host.innerHTML = `<h2>ช่วงเวลาที่แต่ละคนเดิน</h2>` +
    `<p class="sub">${today
      ? `ก้าวจริงวันนี้ (${T0.dow} ${esc(T0.label)}) ถึง ${T0.time} ทีละชั่วโมง กรอบประคือ 3 ชั่วโมงที่คนนั้นเดินเยอะที่สุดใน${TL[T0.type]}ปกติ`
      : `ก้าวเฉลี่ยทีละชั่วโมงของแต่ละคนใน${TL[typ]}ที่จบแล้ว (${n} วัน) ยิ่งเข้มยิ่งเดินมาก`}</p>` +
    `<div class="view-tools"><div class="seg sm" id="hbm"><button type="button" data-m="avg" aria-pressed="${!today}">เฉลี่ย</button><button type="button" data-m="today" aria-pressed="${today}">วันนี้</button></div>` +
    (today ? "" : `<div class="seg sm" id="hbt"><button type="button" data-t="weekday" aria-pressed="${typ === "weekday"}">วันทำงาน</button><button type="button" data-t="off" aria-pressed="${typ === "off"}">วันหยุด</button></div>`) + `</div>` +
    `<div class="legend">${today ? `<span><i style="border:1.5px dashed ${INK}"></i>ช่วงที่ปกติเดินเยอะ</span><span><i class="nodata"></i>ไม่มีภาพหน้าจอช่วงนั้น</span><span><i class="line" style="background:${INK}"></i>ตอนนี้</span>` : ""}</div>` +
    `<div id="hbc"></div><p class="sub" style="margin-top:8px">ช่องแรกคือรวมก่อน 0${B.from}:00 · "รวม" นับเฉพาะก้าวที่บอกชั่วโมงได้ จึงอาจน้อยกว่ายอดทั้งวัน · แตะชื่อเพื่อดูทีละคน</p>`;
  host.querySelectorAll("#hbm button").forEach(b => b.onclick = () => go({ hb: b.dataset.m }));
  host.querySelectorAll("#hbt button").forEach(b => b.onclick = () => go({ hbType: b.dataset.t }));

  const c = $("#hbc", host), w = W(c), narrow = w < 560;
  const lab = narrow ? 84 : 110, sumW = narrow ? 44 : 60, gap = 4, top = today ? 18 : 4, rh = narrow ? 26 : 30;
  const cw = (w - lab - sumW - gap) / cols.length, X = j => lab + j * cw + (j ? gap : 0);
  const hh = top + B.members.length * (rh + 3) + 20;
  const s = svgIn(c, w, hh, today ? "ก้าววันนี้รายคนรายชั่วโมง" : "ก้าวเฉลี่ยรายคนรายชั่วโมง");
  hatch(s, "hbh", RULE);
  const hhmm = h => String(h % 24).padStart(2, "0") + ":00";
  B.members.forEach((r, ri) => {
    const y = top + ri * (rh + 3), dim = state.focus && state.focus !== r.alias;
    const g = el("g", { opacity: dim ? .28 : 1 }, s);
    const name = el("g", { style: "cursor:pointer" }, g);
    el("circle", { cx: 10, cy: y + rh / 2, r: 9, fill: hue[r.alias] }, name);
    txt(name, 10, y + rh / 2 + 4, String(byAlias[r.alias].pos), { "text-anchor": "middle", "font-size": 11, "font-weight": 600, fill: bibInk(hue[r.alias]) });
    txt(name, 25, y + rh / 2 + 4, r.alias, { "font-size": 13, "font-weight": state.focus === r.alias ? 700 : 500, fill: INK });
    name.addEventListener("click", () => go({ focus: state.focus === r.alias ? null : r.alias }));
    let tot = 0;
    cols.forEach((hs, j) => {
      const x = X(j) + 1, cw2 = cw - 2, v = cell(r, hs);
      const range = `${hhmm(hs[0])}–${hhmm(hs[hs.length - 1] + 1)}`;
      let node;
      if (v.future) node = el("rect", { x, y, width: cw2, height: rh, rx: 3, fill: "none", stroke: RULE, "stroke-width": 1 }, g);
      else if (v.unknown || v.none) node = el("rect", { x, y, width: cw2, height: rh, rx: 3, fill: "url(#hbh)" }, g);
      else {
        tot += v.v;
        const t = Math.sqrt(v.v / gmax);   // square root: one spike would otherwise wash out every usual hour
        node = el("rect", { x, y, width: cw2, height: rh, rx: 3, fill: v.v < 1 ? C("--tint") : `color-mix(in oklab, ${col} ${Math.round(10 + t * 85)}%, #ffffff)` }, g);
      }
      fade(node, j * 18, 300);
      const usual = r.usual[typ] ? sumOf(r.usual[typ], hs) : null;
      hover(node, () => `<b>${esc(r.alias)}</b> · ${range}` +
        (v.future ? `<div>ยังไม่ถึงเวลานี้</div>`
          : v.unknown ? `<div>ไม่มีภาพหน้าจอพอจะบอกว่าเดินเท่าไหร่</div>`
          : v.none ? `<div>ยังไม่มี${TL[typ]}ที่จบแล้วของคนนี้</div>`
          : `<div class="r"><span>${today ? "วันนี้" : `เฉลี่ย${TL[typ]}`}</span><b>${full(v.v)}</b></div>${v.part ? `<div>ชั่วโมงนี้ยังไม่จบ</div>` : ""}`) +
        (today && usual != null ? `<div class="r"><span>ปกติ (${TL[typ]})</span><b>${full(usual)}</b></div>` : ""));
    });
    txt(g, w - 2, y + rh / 2 + 4, k(tot), { "text-anchor": "end", "font-size": 12, "font-weight": 600, fill: INK });
    const p = today && r.peak[typ];
    if (p) {
      const j0 = cols.findIndex(hs => hs.includes(p[0])), j1 = cols.findIndex(hs => hs.includes(p[1] - 1));
      el("rect", { x: X(j0) - .5, y: y - 1.5, width: X(j1) + cw - X(j0) + 1, height: rh + 3, rx: 5, fill: "none", stroke: INK, "stroke-width": 1.5, "stroke-dasharray": "4 3" }, g);
    }
  });
  // axis: the merged night column, then every 3 hours at the hour boundaries; "รวม" over the totals
  const ay = hh - 4;
  txt(s, X(0) + cw / 2, ay, `<0${B.from}`, { "text-anchor": "middle", "font-size": 10, fill: MUTED });
  for (let h = B.from + 1; h <= 24; h++) if (h % 3 === 0) txt(s, X(h - B.from + 1), ay, String(h).padStart(2, "0"), { "text-anchor": "middle", "font-size": 11, fill: MUTED });
  txt(s, w - 2, ay, "รวม", { "text-anchor": "end", "font-size": 11, fill: MUTED });
  if (today && nowH >= B.from) {
    const nx = X(nowH - B.from + 1) + cw * (T0.min % 60) / 60, yb = top + B.members.length * (rh + 3) - 3;
    el("line", { x1: nx, x2: nx, y1: 12, y2: yb, stroke: INK, "stroke-width": 1.5, opacity: .7 }, s);
    txt(s, Math.min(nx, w - sumW - 4), 10, `ตอนนี้ ${T0.time}`, { "text-anchor": nx > w - sumW - 40 ? "end" : "middle", "font-size": 10, "font-weight": 600, fill: INK });
  }
}

const DRAW = { daily: viewDaily, member: viewMember, trend: viewTrend, hours: viewHours };

/* ---------- state, routing: #war (start), #sim, #explore/<view>/... ---------- */
const TABS = ["war", "sim", "explore"];
function render() {
  TABS.forEach(t => { $(`#${t}`).hidden = state.tab !== t; $(`#tab-${t}`).setAttribute("aria-selected", state.tab === t); });
  drawFresh();
  if (state.tab === "war") drawWar();
  else if (state.tab === "sim") drawSim();
  else { drawKnow(); drawControls(); const v = $("#view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view"); DRAW[state.view](v); }
}
function hashOf() {
  if (state.tab !== "explore") return "#" + state.tab;
  const q = [state.view];
  if (state.view === "trend") q.push(state.scope, state.mode);
  if (state.view === "hours") { if (state.hb === "today") q.push("today"); else if (state.hbType) q.push(state.hbType); }
  if (state.focus) q.push("@" + state.focus);
  return "#explore/" + q.map(encodeURIComponent).join("/");
}
function go(patch) {
  const prevTab = state.tab;
  ANIM = !RM && !(Object.keys(patch).length === 1 && "focus" in patch);
  if (("view" in patch || "focus" in patch) && !("tab" in patch)) patch.tab = "explore";
  Object.assign(state, patch);
  history.replaceState(null, "", hashOf());
  render();
  if (prevTab !== state.tab) window.scrollTo({ top: 0 });
}
function fromHash() {
  const parts = location.hash.slice(1).split("/").map(decodeURIComponent);
  if (parts[0] === "sim" || parts[0] === "how" || parts[0] === "win") { state.tab = "sim"; return; }
  if (parts[0] !== "explore") return;
  state.tab = "explore";
  if (DRAW[parts[1]]) state.view = parts[1];
  for (const p of parts.slice(2)) {
    if (p.startsWith("@") && byAlias[p.slice(1)]) state.focus = p.slice(1);
    else if (p === "team" || p === "member") state.scope = p;
    else if (p === "cum" || p === "day") state.mode = p;
    else if (p === "today") state.hb = p;
    else if (p === "weekday" || p === "off") state.hbType = p;
  }
}
TABS.forEach(t => $(`#tab-${t}`).onclick = () => go({ tab: t }));
$(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = TABS.indexOf(state.tab), t = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
  go({ tab: t }); $(`#tab-${t}`).focus();
});

$("#limits").innerHTML = [

  "เส้นจุด \"ปกติ\" ในกราฟวันนี้ และจุด \"ควรได้ถึงตอนนี้\" ใช้จังหวะเดินรายชั่วโมงของทีมที่วิเคราะห์ในวันประเภทเดียวกัน (วันทำงาน / วันหยุด) จากวันที่จบแล้ว",
  "เป้าวันนี้: เดินมากกว่าวันปกติของทีมข้างหน้าเท่ากันทุกวันที่เหลือ จนจบเท่ากันพอดีวันสุดท้าย วันหยุดเป้าจึงสูงกว่าวันทำงาน",
  "แถบสีแบ่งตามคน ใต้เหตุการณ์สำคัญและใต้แต่ละช่วงเวลาในระยะห่างรายวัน: ก้าวที่สมาชิกแต่ละคนของทีมที่วิเคราะห์เพิ่มขึ้นระหว่างภาพก่อนหน้ากับภาพนั้น เป็นก้าวรวมของคนนั้นเอง (ไม่ใช่ต่อคนของทีม) อ่านจากภาพ leaderboard ที่แคปพร้อม Team Ranking ช่วงไหนไม่มีภาพรายคนจะไม่แสดง ก้าวที่ app เพิ่ง sync อาจเดินมาก่อนช่วงนั้น",
  "Simulator: ตารางคือก้าวที่แต่ละคนต้องเดินทุกวันที่เหลือ เพื่อไปถึงเส้นของอีกทีมพอดี เผื่อว่าเขาเดินแบบปกติ (ค่าเฉลี่ยของแต่ละคน) หรือแรง (วันที่ดีที่สุด) เดอะแบกแค่แบ่งค่าเฉลี่ยเดิมใหม่ กราฟจึงไม่ขยับ วันนี้นับเฉพาะส่วนของวันที่ยังเหลือ",
  ...(M.some(m => m.nosync.length) ? [`ถ้ายอดของใครไม่ขยับเลยทั้งวัน (วันนี้นับหลัง 18:00) ถือว่ายังไม่ sync แสดงเป็น "ยังไม่ sync" ไม่นับเป็น 0 และไม่รวมในค่าเฉลี่ยกับอัตราเดินของคนนั้น ก้าวที่ sync มาทีหลังจะไปอยู่ในวันถัดไป (มี * ในคำอธิบาย): ${M.filter(m => m.nosync.length).map(m => `${m.alias} ${m.nosync.map(x => days.find(d => d.d === x).label).join(", ")}`).join(" · ")}`] : []),
  ...M.flatMap(m => m.moved.map(x => `${m.alias} ${days.find(d => d.d === x.d).label}: ยอด ${full(x.steps)} ก้าว sync เข้ามาตอน ${x.at} ถือเป็นก้าวของ ${days.find(d => d.d === x.d).label} (ตามที่ผู้ดูแลระบุ) แสดงด้วย *`)),
  ...(M.some(m => m.unsynced) ? [`วันนี้ ${M.filter(m => m.unsynced).map(m => m.alias).join(", ")} คาดการณ์นับวันนี้ให้เต็มวัน`] : []),
  "ตัวเลขทั้งหมดอ่านจากภาพหน้าจอ leaderboard ที่แคปไว้ (OCR) app แสดงก้าวปัดเป็นหลักร้อย (เช่น 24.4k)",
  `ยอดรายวัน = ยอดสะสมในภาพสุดท้ายของวัน ลบยอดสะสมในภาพสุดท้ายของวันก่อน ก้าวที่เดินหลังภาพสุดท้ายของวันจะไปนับรวมในวันถัดไป`,
  `${days.find(d => d.status === "est")?.label || "วันแรก"} ไม่มีภาพหน้าจอ เป็นค่าประมาณ: ยอดสะสมในภาพแรกของวันถัดไป หักก้าวช่วงเช้ามืดที่คนนั้นเดินตามปกติ`,
  `ช่วงเวลาในวัน: ก้าวระหว่างสองภาพจะเฉลี่ยแบ่งตามนาที (ถ้าสองภาพห่างกันไม่เกิน ${D.hour_gap / 60} ชั่วโมง) app อาจ sync ช้ากว่ากิจกรรมจริง (ประมาณ 10–15 นาที) เวลาจึงคลาดได้เล็กน้อย`,
  "คาดการณ์: แต่ละคนเดินเท่าค่าเฉลี่ยของตัวเองในวันทำงานและวันหยุดที่ผ่านมา ช่วงต่ำ–สูง ใช้วันที่น้อยที่สุดและมากที่สุดของแต่ละประเภท วันหยุดนักขัตฤกษ์นับเป็นวันหยุด",
  `วันนี้ (${D.as_of.label}) ยังไม่จบ ตัวเลขถึง ${D.as_of.time} บางคนอาจยังไม่ sync`,
].map(s => `<li>${esc(s)}</li>`).join("");

fromHash();
render();
window.scrollTo(0, 0); addEventListener("load", () => window.scrollTo(0, 0));   // a hash like #war names a section id: never let the browser jump under the sticky header
setInterval(drawFresh, 60000);
let rt, lastW = $(".wrap").clientWidth;
new ResizeObserver(() => { const w = $(".wrap").clientWidth; if (w === lastW) return; lastW = w; clearTimeout(rt); rt = setTimeout(() => { ANIM = false; render(); }, 120); }).observe($(".wrap"));
})();
</script>
