  for (let hr = 0; hr <= 24; hr += 3) txt(hs, lab + hr * cw, hh - 4, String(hr).padStart(2, "0"), { "text-anchor": "middle", "font-size": 11, fill: MUTED });
  drawHourBoard($("#hb", host));
}

// every member × hour of day (user, 2026-11-02): เฉลี่ย = usual steps per hour on finished days of one type, วันนี้ =
// today's steps with each member's usual 3 busiest hours framed. Both modes share one colour scale. All numbers come
// from build_lead.py hour_board(); the page only merges the hours before `from` into one column.
function drawHourBoard(host) {
  const B = D.hour_board;
  if (!host || !B) return;
  // `today` = the per-day mode (วันนี้ and the days before it, user 2026-11-04); `isNow` = the selected day is today
  const T0 = B.today, today = state.hb === "today";
  const sel = B.days.some(x => x.d === state.hbDay) ? state.hbDay : T0.d, isNow = sel === T0.d;
  const SD = B.days.find(x => x.d === sel) || T0;
  const typ = today ? SD.type : (state.hbType || T0.type);
  const TL = { weekday: "วันทำงาน", off: "วันหยุด" }, col = typ === "off" ? OFF : HOT;
  const cols = [Array.from({ length: B.from }, (_, h) => h), ...Array.from({ length: 24 - B.from }, (_, i) => [B.from + i])];
  const sumOf = (arr, hs) => hs.reduce((a, h) => a + (arr ? arr[h] || 0 : 0), 0);
  const nowH = Math.floor(T0.min / 60);
  const cell = (r, hs) => {
    if (!today) return r.usual[typ] ? { v: sumOf(r.usual[typ], hs) } : { none: true };
    const dd = r.day[sel];
    if (isNow && hs[0] > nowH) return { future: true };
    if (!dd || !hs.some(h => dd.known[h])) return { unknown: true };
    return { v: sumOf(dd.steps, hs), part: isNow && hs.includes(nowH) };
  };
  // fixed hour bins for both modes, every day and both day types, so switching never changes what a shade means
  const n = Math.max(0, ...B.members.map(r => r.n[typ] || 0));
  const dayName = `${SD.dow} ${esc(SD.label)}`;
  const chip = x => `<button type="button" data-d="${x.d}" data-off="${x.type === "off" ? 1 : 0}" aria-pressed="${x.d === sel}" aria-label="${esc(x.dow + " " + x.label)}">${x.d === T0.d ? "วันนี้" : `${esc(x.dow)} ${esc(x.label.split(" ")[0])}`}</button>`;
  host.innerHTML = `<h2>ช่วงเวลาที่แต่ละคนเดิน</h2>` +
    `<p class="sub">${today
      ? `ก้าวจริง${isNow ? `วันนี้ (${dayName}) ถึง ${T0.time}` : `ของวัน ${dayName}`} ทีละชั่วโมง กรอบประคือ 3 ชั่วโมงที่คนนั้นเดินเยอะที่สุดใน${TL[SD.type]}ปกติ`
      : `ก้าวเฉลี่ยทีละชั่วโมงของแต่ละคนใน${TL[typ]}ที่จบแล้ว (${n} วัน) ยิ่งเข้มยิ่งเดินมาก`}</p>` +
    `<div class="view-tools"><div class="seg sm" id="hbm"><button type="button" data-m="avg" aria-pressed="${!today}">เฉลี่ย</button><button type="button" data-m="today" aria-pressed="${today}">รายวัน</button></div>` +
    (today ? "" : `<div class="seg sm" id="hbt"><button type="button" data-t="weekday" aria-pressed="${typ === "weekday"}">วันทำงาน</button><button type="button" data-t="off" aria-pressed="${typ === "off"}">วันหยุด</button></div>`) + `</div>` +
    (today ? `<div class="daystrip" id="hbd" role="group" aria-label="เลือกวัน">${B.days.map(chip).join("")}</div>` : "") +
    `<div class="legend"><span>ก้าว/ชม.</span>${hourKey(col)}${today ? `<span><i style="border:1.5px dashed ${INK}"></i>ช่วงที่ปกติเดินเยอะ</span><span><i class="nodata"></i>ไม่มีภาพหน้าจอช่วงนั้น</span>${isNow ? `<span><i class="line" style="background:${INK}"></i>ตอนนี้</span>` : ""}` : ""}</div>` +
    `<div id="hbc"></div><p class="sub" style="margin-top:8px">ช่องแรกคือรวมก่อน 0${B.from}:00 · "รวม" คือยอดทั้งวัน เท่ากับหน้ารายคน · แตะชื่อเพื่อดูทีละคน</p>`;
  host.querySelectorAll("#hbm button").forEach(b => b.onclick = () => go({ hb: b.dataset.m }));
  host.querySelectorAll("#hbt button").forEach(b => b.onclick = () => go({ hbType: b.dataset.t }));
  host.querySelectorAll("#hbd button").forEach(b => b.onclick = () => go({ hbDay: b.dataset.d === T0.d ? null : b.dataset.d }));
  const strip = $("#hbd", host), on = strip && strip.querySelector('[aria-pressed="true"]');
  if (on) strip.scrollLeft = on.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2;   // keep the chosen day in view

  const c = $("#hbc", host), w = W(c), narrow = w < 560;
  const lab = narrow ? 84 : 110, sumW = narrow ? 44 : 60, gap = 4, top = today && isNow ? 18 : 6, rh = narrow ? 26 : 30;
  const cw = (w - lab - sumW - gap) / cols.length, X = j => lab + j * cw + (j ? gap : 0);
  const hh = top + B.members.length * (rh + 3) + 20;
  const s = svgIn(c, w, hh, today ? `ก้าว${isNow ? "วันนี้" : dayName}รายคนรายชั่วโมง` : "ก้าวเฉลี่ยรายคนรายชั่วโมง");
  hatch(s, "hbh", RULE);
  const hhmm = h => String(h % 24).padStart(2, "0") + ":00";
  B.members.forEach((r, ri) => {
    const y = top + ri * (rh + 3), dim = state.focus && state.focus !== r.alias;
    const g = el("g", { opacity: dim ? .28 : 1 }, s);
    const name = el("g", { style: "cursor:pointer" }, g);
    el("circle", { cx: 10, cy: y + rh / 2, r: 9, fill: hue[r.alias] }, name);
    txt(name, 10, y + rh / 2 + 4, String(byAlias[r.alias].pos), { "text-anchor": "middle", "font-size": 11, "font-weight": 600, fill: bibInk(hue[r.alias]) });
    txt(name, 25, y + rh / 2 + 4, r.alias, { "font-size": 13, "font-weight": state.focus === r.alias ? 700 : 500, fill: INK });
    name.addEventListener("click", () => go({ focus: state.focus === r.alias ? null : r.alias }));
    let tot = 0;
    cols.forEach((hs, j) => {
      const x = X(j) + 1, cw2 = cw - 2, v = cell(r, hs);
      const range = `${hhmm(hs[0])}–${hhmm(hs[hs.length - 1] + 1)}`;
      let node;
      if (v.future) node = el("rect", { x, y, width: cw2, height: rh, rx: 3, fill: "none", stroke: RULE, "stroke-width": 1 }, g);
      else if (v.unknown || v.none) node = el("rect", { x, y, width: cw2, height: rh, rx: 3, fill: "url(#hbh)" }, g);
      else {
        tot += v.v;
        node = el("rect", { x, y, width: cw2, height: rh, rx: 3, fill: v.v < 1 ? C("--tint") : hourFill(col, v.v) }, g);
      }
      fade(node, j * 18, 300);
      const usual = r.usual[typ] ? sumOf(r.usual[typ], hs) : null;
      hover(node, () => `<b>${esc(r.alias)}</b> · ${range}` +
        (v.future ? `<div>ยังไม่ถึงเวลานี้</div>`
          : v.unknown ? `<div>ไม่มีภาพหน้าจอพอจะบอกว่าเดินเท่าไหร่</div>`
          : v.none ? `<div>ยังไม่มี${TL[typ]}ที่จบแล้วของคนนี้</div>`
          : `<div class="r"><span>${today ? (isNow ? "วันนี้" : dayName) : `เฉลี่ย${TL[typ]}`}</span><b>${full(v.v)}</b></div>${v.part ? `<div>ชั่วโมงนี้ยังไม่จบ</div>` : ""}`) +
        (today && usual != null ? `<div class="r"><span>ปกติ (${TL[typ]})</span><b>${full(usual)}</b></div>` : ""));
    });
    // "รวม" = the same day total as ก้าวรายคนต่อวัน (today) or its usual day (เฉลี่ย), not only the steps placed in an hour
    const di = days.findIndex(d => d.d === sel), dayTot = today ? byAlias[r.alias].daily[di] : (P.members[r.alias] || {})[typ];
    txt(g, w - 2, y + rh / 2 + 4, k(dayTot != null ? dayTot : tot), { "text-anchor": "end", "font-size": 12, "font-weight": 600, fill: INK });
    const p = today && r.peak[typ];
    if (p) {
      const j0 = cols.findIndex(hs => hs.includes(p[0])), j1 = cols.findIndex(hs => hs.includes(p[1] - 1));
      el("rect", { x: X(j0) - .5, y: y - 1.5, width: X(j1) + cw - X(j0) + 1, height: rh + 3, rx: 5, fill: "none", stroke: INK, "stroke-width": 1.5, "stroke-dasharray": "4 3" }, g);
    }
  });
  // axis: the merged night column, then every 3 hours at the hour boundaries; "รวม" over the totals
  const ay = hh - 4;
  txt(s, X(0) + cw / 2, ay, `<0${B.from}`, { "text-anchor": "middle", "font-size": 10, fill: MUTED });
  for (let h = B.from + 1; h <= 24; h++) if (h % 3 === 0) txt(s, X(h - B.from + 1), ay, String(h).padStart(2, "0"), { "text-anchor": "middle", "font-size": 11, fill: MUTED });
  txt(s, w - 2, ay, "รวม", { "text-anchor": "end", "font-size": 11, fill: MUTED });
  if (today && isNow && nowH >= B.from) {
    const nx = X(nowH - B.from + 1) + cw * (T0.min % 60) / 60, yb = top + B.members.length * (rh + 3) - 3;
    el("line", { x1: nx, x2: nx, y1: 12, y2: yb, stroke: INK, "stroke-width": 1.5, opacity: .7 }, s);
    txt(s, Math.min(nx, w - sumW - 4), 10, `ตอนนี้ ${T0.time}`, { "text-anchor": nx > w - sumW - 40 ? "end" : "middle", "font-size": 10, "font-weight": 600, fill: INK });
  }
}

// the gap between the two teams at every day's close (user, 2026-11-09): average steps per person, ours minus theirs,
// from the first night with both teams' screenshots, plus "now". Up = we lead (Team Blue), down = we trail (Alarm
// Red). The race board's own numbers (war.race.days, build_lead.py): the page only flips the sign so up is good.
function drawGap(c) {
  const days_ = ((WR && WR.race && WR.race.days) || []).filter(x => x.gap != null);
  if (days_.length < 2) { c.innerHTML = `<p class="sub">ยังไม่มีข้อมูลพอ</p>`; return; }
  const P_ = days_.map(d => ({ d, v: -d.gap })), n = P_.length, last = P_[n - 1], live = last.d.today;
  const BLUE = C("--blue-2"), RED = C("--red-2");
  const w = W(c), narrow = w < 560, h = narrow ? 230 : 270, L = narrow ? 38 : 44, R = 12, Tp = 26, B = 40;
  const vs = P_.map(p => p.v), lo = Math.min(0, ...vs), hi = Math.max(0, ...vs), pad = (hi - lo) * .14;
  const step = [2500, 5000, 10000, 20000].find(st => (hi - lo) / st <= 5) || 20000;
  const y0 = lo - pad, y1 = hi + pad, Y = v => Tp + (h - Tp - B) * (y1 - v) / (y1 - y0);
  const X = i => L + 10 + (w - L - R - 20) * i / (n - 1), zy = Y(0);
  const s = svgIn(c, w, h, "ช่องว่างก้าวเฉลี่ยต่อคนระหว่างทีมเรากับ" + ANL + " ณ สิ้นแต่ละวัน");
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) {
    if (v) el("line", { x1: L, x2: w - R, y1: Y(v), y2: Y(v), stroke: RULE2 }, s);
    txt(s, L - 6, Y(v) + 4, v ? `${v < 0 ? "−" : "+"}${Math.abs(v) / 1000}k` : "0", { "text-anchor": "end", "font-size": 11, fill: MUTED });
  }
  // area to the zero line: blue where above it, red where below (one polygon, two clips)
  const line = P_.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`);
  const area = `M${X(0).toFixed(1)},${zy.toFixed(1)} L${line.join(" L")} L${X(n - 1).toFixed(1)},${zy.toFixed(1)} Z`;
  const defs = el("defs", {}, s);
  el("rect", { x: L, y: 0, width: w - L, height: zy }, el("clipPath", { id: "gcu" }, defs));
  el("rect", { x: L, y: zy, width: w - L, height: h - zy }, el("clipPath", { id: "gcd" }, defs));
  fade(el("path", { d: area, fill: BLUE, "fill-opacity": .16, "clip-path": "url(#gcu)" }, s), 300, 500);
  fade(el("path", { d: area, fill: RED, "fill-opacity": .14, "clip-path": "url(#gcd)" }, s), 300, 500);
  el("line", { x1: L, x2: w - R, y1: zy, y2: zy, stroke: INK2, "stroke-width": 1.5 }, s);
  txt(s, L + 4, zy - 6, "เรานำ", { "font-size": 11, "font-weight": 600, fill: C("--blue") });
  txt(s, L + 4, zy + 15, "ตามหลัง", { "font-size": 11, "font-weight": 600, fill: C("--red") });
  const solid = live ? line.slice(0, -1) : line;
  drawIn(el("path", { d: "M" + solid.join(" L"), fill: "none", stroke: C("--navy"), "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, s), 0, 900);
  if (live) fade(el("path", { d: `M${line[n - 2]} L${line[n - 1]}`, fill: "none", stroke: C("--navy"), "stroke-width": 2.5, "stroke-dasharray": "2 5", "stroke-linecap": "round" }, s), 900, 300);
  const sg = v => (v > 0 ? "+" : v < 0 ? "−" : "") + (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(1).replace(".0", "") + (narrow ? "" : "k") : Math.abs(v));
  P_.forEach((p, i) => {
    const x = X(i), y = Y(p.v), col = p.v >= 0 ? BLUE : RED, now = live && i === n - 1, g = el("g", {}, s);
    fade(el("circle", { cx: x, cy: y, r: now ? 6 : 5, fill: now ? "#fff" : col, stroke: now ? col : "#fff", "stroke-width": now ? 3 : 2 }, g), 700 + i * 50, 250);
    // phone: only the points that tell the story carry a number (first, the two latest, best, worst); the rest in the tooltip
    const key = !narrow || i === 0 || i >= n - 2 || p.v === lo || p.v === hi;
    if (key) fade(txt(g, x, p.v >= 0 ? y - 10 : y + 19, sg(p.v), { "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle", "font-size": narrow ? 10 : 12, "font-weight": 700, fill: p.v >= 0 ? C("--blue") : C("--red") }), 800 + i * 50, 250);
    if (!narrow || i % 2 === 0 || i === n - 1) txt(s, x, h - B + 16, now ? "ตอนนี้" : p.d.label.split(" ")[0], { "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle", "font-size": 11, fill: INK2, "font-weight": now ? 600 : 400 });
    if (!narrow || i % 2 === 0 || i === n - 1) txt(s, x, h - B + 29, p.d.dow, { "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle", "font-size": 10, fill: MUTED });
    const slot = (w - L - R - 20) / (n - 1);
    hover(el("rect", { x: x - slot / 2, y: Tp - 10, width: slot, height: h - Tp + 10, fill: "transparent" }, g), () =>
      `<b>${p.d.dow} ${p.d.label}</b> · ${now ? "ตอนนี้ " + esc(p.d.time) : "สิ้นวัน"}<div class="r"><span>${p.v >= 0 ? "เรานำ" : "เราตามหลัง"}</span><b style="color:${col}">${full(Math.abs(p.v))}</b></div>` +
      (p.d.change == null ? "" : `<div class="r"><span>${now ? "วันนี้ถึงตอนนี้" : "ทั้งวัน"} เรา${p.d.change >= 0 ? "เดินมากกว่า" : "เดินน้อยกว่า"}เขา</span><b>${full(Math.abs(p.d.change))}</b></div>`));
  });
}

// our team (user, 2026-11-09): only Team Ranking screenshots exist for us, so one average per person per day from
// 30 Oct, whole days only. One vertical bar per day in our blue (one blue: off days are a tinted column), the analysed
// team's same day as a thick orange marker with a white edge (orange on blue reads at a glance, also for colour-blind
// readers), and the difference under each day. Bars over paired bars or dumbbells: the user's call after trying both.
// Numbers from build_lead.py strategy.day_vs / day_vs_type.
function viewUs(host) {
  const S = D.strategy || {}, V = (S.day_vs || []).filter(x => x.whole), T = S.day_vs_type || {};
  const US = C("--blue-2"), RV = C("--off"), GOOD = C("--good"), BAD = C("--red");
  host.innerHTML = `<h2>ก้าวเฉลี่ยต่อคนต่อวัน เราเทียบ${ANL}</h2>` +
    `<div class="legend"><span><i style="background:${US}"></i>เรา</span><span><i class="line" style="background:${RV};height:4px"></i>${ANL}</span></div><div id="c"></div>` +
    `<h2 style="margin-top:26px;font-size:16px">ช่องว่างระหว่างสองทีม</h2><p class="sub">ก้าวเฉลี่ยต่อคน ณ สิ้นวัน เหนือเส้น = เรานำ ใต้เส้น = เราตามหลัง</p><div id="gc"></div><div class="halves us-halves" id="halves"></div>`;
  drawGap($("#gc", host));
  const c = $("#c", host);
  if (!V.length) { c.innerHTML = `<p class="sub">ยังไม่มีวันที่นับได้ครบวัน</p>`; return; }
  const w = W(c), narrow = w < 560, h = narrow ? 270 : 310, L = 36, R = 6, Tp = 22, B = 58;
  const max = niceMax(Math.max(...V.flatMap(x => [x.us_gain, x.leader_gain])) * 1.08);
  const n = V.length, slot = (w - L - R) / n, bw = Math.max(10, Math.min(44, slot * .6));
  const Y = v => Tp + (h - Tp - B) * (1 - Math.max(0, v) / max), base = Y(0);
  const s = svgIn(c, w, h, "ก้าวเฉลี่ยต่อคนต่อวันของทีมเรา เทียบ" + ANL);
  V.forEach((d, i) => { if (d.type !== "weekday") el("rect", { x: L + i * slot + 1, y: Tp - 8, width: slot - 2, height: h - Tp - 4, rx: 8, fill: C("--tint") }, s); });
  for (const v of ticks(max)) { el("line", { x1: L, x2: w - R, y1: Y(v), y2: Y(v), stroke: v ? RULE2 : RULE }, s); txt(s, L - 6, Y(v) + 4, v ? k(v).replace(".0k", "k") : "0", { "text-anchor": "end", "font-size": 11, fill: MUTED }); }
  const kk = v => narrow ? String(Math.round(v / 1000)) : k(v).replace(".0k", "k");   // phone: whole thousands, so 14 neighbours never touch (exact values in the tooltip)
  V.forEach((d, i) => {
    const off = d.type !== "weekday", cx = L + i * slot + slot / 2, x = cx - bw / 2, diff = d.us_gain - d.leader_gain, win = diff >= 0;
    const g = el("g", {}, s);
    rise(vbar(g, x, Y(d.us_gain), bw, base - Y(d.us_gain), { fill: US }), i * 40);
    // the rival's day: white halo under an orange bar-wide marker, so it reads on the blue bar and on the ground alike
    const ty = Y(d.leader_gain), tw = bw + (narrow ? 8 : 14);
    fade(el("line", { x1: cx - tw / 2, x2: cx + tw / 2, y1: ty, y2: ty, stroke: "#fff", "stroke-width": 8, "stroke-linecap": "round" }, g), i * 40 + 450, 300);
    fade(el("line", { x1: cx - tw / 2, x2: cx + tw / 2, y1: ty, y2: ty, stroke: RV, "stroke-width": 4, "stroke-linecap": "round" }, g), i * 40 + 450, 300);
    fade(txt(s, cx, Math.min(Y(d.us_gain), ty) - 8, kk(d.us_gain), { "text-anchor": "middle", "font-size": narrow ? 10 : 12, "font-weight": 700, fill: C("--blue") }), i * 40 + 350, 300);
    txt(s, cx, base + 16, d.label.split(" ")[0], { "text-anchor": "middle", "font-size": 11, fill: INK2 });
    txt(s, cx, base + 29, d.dow, { "text-anchor": "middle", "font-size": 10, fill: off ? INK : MUTED, "font-weight": off ? 600 : 400 });
    const ad = Math.abs(diff), dtxt = ad < 1000 ? full(ad) : kk(ad);
    txt(s, cx, base + 47, `${win ? "+" : "−"}${dtxt}`, { "text-anchor": "middle", "font-size": narrow ? 10 : 12, "font-weight": 700, "letter-spacing": narrow ? "-.3" : "0", fill: win ? GOOD : BAD, "font-family": "var(--num)" });
    hover(el("rect", { x: L + i * slot, y: Tp - 8, width: slot, height: h - Tp, fill: "transparent" }, g), () =>
      `<b>${d.dow} ${d.label}</b> · ${TYPE[d.type] || ""}<div class="r"><span><i style="background:${US}"></i>เรา</span><b>${full(d.us_gain)}</b></div>` +
      `<div class="r"><span><i style="background:${RV}"></i>${ANL}</span><b>${full(d.leader_gain)}</b></div>` +
      `<div class="r"><span>${win ? "เรามากกว่า" : "เราน้อยกว่า"}</span><b style="color:${win ? GOOD : BAD}">${full(ad)}</b></div>`);
  });
  txt(s, L - 6, base + 47, "ต่าง", { "text-anchor": "end", "font-size": 10, fill: MUTED });
  const half = (typ, label) => {
    const t = T[typ];
    if (!t) return `<div><h3>${label}</h3><p class="sub">ยังไม่มีวันที่ครบ</p></div>`;
    const diff = t.us - t.leader;
    return `<div><h3>${label}</h3><div class="big" style="color:${C("--blue")}">${k(t.us)}<small>ก้าว/คน/วัน</small></div>` +
      `<p class="vsl"><span style="color:${C("--off-ink")}">${ANL} <b>${k(t.leader)}</b></span><b class="${diff >= 0 ? "ok" : "no"}">${diff >= 0 ? "เรามากกว่า" : "เราน้อยกว่า"} ${k(Math.abs(diff))}</b></p>` +
      `<p class="vsl"><span>ชนะ ${t.won} จาก ${t.n} วัน</span></p></div>`;
  };
  $("#halves", host).innerHTML = half("weekday", "วันทำงาน") + half("off", "วันหยุด");

  const fig = (v, cls = "") => `<b class="fig${cls ? " " + cls : ""}">${v}</b>`;
  const nm = (a, cls = "") => `<b class="nm${cls ? " " + cls : ""}">${esc(a)}</b>`;
  let html = `<div class="stl"><h2>${Q ? "โหมดซ่อนตัว: ใครเก็บก้าวไว้คืนก่อนวันสุดท้าย" : "โหมดซ่อนตัว"}</h2>` +
    `<p class="what">โหมดซ่อนตัว คือเดินไปแต่ยังไม่ sync แล้ว sync ทีเดียวทีหลัง ไม่ผิดกติกา ทีมเราก็ใช้</p>`;

  if (Q) {
    // Beat 1: who went quiet early (clock rows, all members)
    html += `<section class="beat b1"><h3>${esc(Q.d12.dow)} ${esc(Q.d12.label)} ยอดขยับครั้งสุดท้ายกี่โมง</h3>` +
      (Q.hid_names.length
        ? `<p>วันนั้น ${stlNames(Q.hid_names.map(a => nm(a, "off")))} ยอดหยุดขยับเร็วกว่าทุกวันก่อนหน้า` +
          (Q.normal_names.length ? ` ส่วน ${stlNames(Q.normal_names.map(a => nm(a)))} ขยับตามเวลาปกติ` : "") + `</p>`
        : `<p>วันนั้นทุกคนยอดขยับตามเวลาปกติ</p>`) +
      `<div class="stl-c" id="slq"></div>` +
      `<p class="note" id="slqn">ขีดและจุดคือเวลาที่เราเห็นยอดขยับครั้งสุดท้าย นับเฉพาะวันที่มีภาพแคปหลัง ${esc(R.night_from)}</p></section>`;
    // Beat 2: where the quiet steps went (one two-day line per quiet member)
    if (HID.length) {
      const capped = HID.some(m => m.est_capped);
      html += `<section class="beat"><h3>ก้าวที่เงียบไป ไปโผล่ที่ไหน</h3>` +
        `<p>ก้าวที่เงียบไป โผล่มาเป็นก้อนในวันที่ ${esc(Q.d13.label)}</p>` +
        `<div class="stl-c" id="slm"></div>` +
        `<p class="cav"><i aria-hidden="true"></i>ก้อนนี้มีก้าวของ ${esc(Q.d13.label)} เองปนอยู่ด้วย ส่วนหนึ่งคือก้าวของ ${esc(Q.d12.label)}</p>` +
        `<p class="note">ราวๆ มาจากที่คนนั้นมักเดินจากเวลาเดียวกันถึงเที่ยงคืน ช่วง ${esc(stlRange(Q.est.from, Q.est.to))} ` +
        `ซึ่งเป็นช่วงท้ายที่ทุกคนเดินเยอะกว่าช่วงแรก${capped ? " และไม่เกินที่เดินทันก่อนเที่ยงคืน" : ""} ` +
        `ตัวเลขรายคนคือก้าวของคนนั้นเอง ไม่ใช่เฉลี่ยต่อคน</p></section>`;
    }
  }

  // Beat 3: what the lumps did to the race (v2 D5/D11 + D21): heading, sentence, chart title, chart, the honest half
  if (F) {
    html += `<section class="beat"><h3>ก้อนใหญ่โผล่ตอนดึก</h3>` +
      (F.low == null
        ? `<p>ตอนค่ำเรานำเยอะ พอก้อนใหญ่ของ${ANL} โผล่ตอนดึก เที่ยงคืนเหลือนำแค่ ${fig(k(F.lead_end), "us")} ต่อคน</p>`
        : `<p>ก้อนใหญ่ของ${ANL} โผล่${F.dump_first ? `ช่วง ${F.dump_first} ถึง ${F.dump_last}` : "ตอนดึก"} เลยแซงเราไปพักหนึ่ง</p>`) +
      `<p class="ct">เรานำหรือตามหลัง ต่อคน คืนสุดท้าย</p><div class="stl-c" id="slc"></div>` +
      (F.us_first ? `<p>ทีมเราก็ sync ทีเดียวตอนดึกเหมือนกัน หลัง ${F.us_first} เพิ่มมาอีก ${fig(k(F.us_late), "us")} ต่อคน` +
        `${F.lead_end >= 0 ? " เลยกลับมานำตอนเที่ยงคืน" : ""} เกมนี้สองทีมเล่นเหมือนกัน</p>` : "") + `</section>`;
  }

  // footer: the board rule stands; sources
  if (Q || F) html += `<div class="foot"><p class="note">ใน Daily และ Players ก้าวทุกก้าวยังนับเป็นของวันที่ขึ้นบน leaderboard ` +
    `หน้านี้แค่ดูว่าใครหยุด sync เร็วกว่าปกติ แล้วประมาณว่าเก็บไว้ราวเท่าไหร่ ยอดรายคนมาจากภาพที่แคปไว้ของแต่ละคน ` +
    `คืนสุดท้ายใช้ยอดเฉลี่ยต่อคนจาก Team Ranking</p></div>`;
  host.innerHTML = html + `</div>`;

  if (Q) stlClock($("#slq", host), Q, $("#slqn", host));
  if (HID.length) stlTrail($("#slm", host), Q, HID);
  if (F) stlLead($("#slc", host), F);
}

const DRAW = { daily: viewDaily, member: viewMember, trend: viewTrend, hours: viewHours, us: viewUs, stealth: viewStealth };

/* ---------- state, routing: #war (start), #sim, #explore/<view>/... ---------- */
const TABS = ["war", "sim", "explore"];
function render() {
  TABS.forEach(t => { $(`#${t}`).hidden = state.tab !== t; $(`#tab-${t}`).setAttribute("aria-selected", state.tab === t); });
  drawFresh();
  if (state.tab === "war") drawWar();
  else if (state.tab === "sim") drawSim();
  else { drawControls(); const v = $("#view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view"); DRAW[state.view](v); }
}
function hashOf() {
  if (state.tab !== "explore") return "#" + state.tab;
  const q = [state.view];
  if (state.view === "trend") { q.push(state.scope, state.mode); if (state.tday) q.push("on" + state.tday); }
  if (state.view === "hours") { if (state.hb === "today") { q.push("today"); if (state.hbDay) q.push(state.hbDay); } else if (state.hbType) q.push(state.hbType); }
  if (state.focus) q.push("@" + state.focus);
  return "#explore/" + q.map(encodeURIComponent).join("/");
}
function go(patch) {
  const prevTab = state.tab;
  ANIM = !RM && !(Object.keys(patch).length === 1 && "focus" in patch);
  if (("view" in patch || "focus" in patch) && !("tab" in patch)) patch.tab = "explore";
  Object.assign(state, patch);
  history.replaceState(null, "", hashOf());
  render();
  if (prevTab !== state.tab) window.scrollTo({ top: 0 });
}
function fromHash() {
  const parts = location.hash.slice(1).split("/").map(decodeURIComponent);
  /* final day: Simulator entry hidden (user, 2026-11-14); #sim etc. fall back to War Room */
  if (parts[0] === "sim" || parts[0] === "how" || parts[0] === "win") return;
  if (parts[0] !== "explore") return;
  state.tab = "explore";
  if (DRAW[parts[1]]) state.view = parts[1];
  for (const p of parts.slice(2)) {
    if (p.startsWith("@") && byAlias[p.slice(1)]) state.focus = p.slice(1);
    else if (p === "team" || p === "member") state.scope = p;
    else if (p === "cum" || p === "day") state.mode = p;
    else if (p === "today") state.hb = p;
    else if (/^on\d{4}-\d{2}-\d{2}$/.test(p)) state.tday = p.slice(2);   // the trend opened on one day
    else if (/^\d{4}-\d{2}-\d{2}$/.test(p)) { state.hb = "today"; state.hbDay = p; }   // a past day on the hour board
    else if (p === "weekday" || p === "off") state.hbType = p;
  }
}
TABS.forEach(t => $(`#tab-${t}`).onclick = () => go({ tab: t }));
$(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = TABS.indexOf(state.tab), t = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
  go({ tab: t }); $(`#tab-${t}`).focus();
});

  ...(M.some(m => m.nosync.length) ? [`ถ้ายอดของใครไม่ขยับเลยทั้งวัน (วันนี้นับหลัง 18:00) ถือว่ายังไม่ sync แสดงเป็น "ยังไม่ sync" ไม่นับเป็น 0 และไม่รวมในค่าเฉลี่ยกับอัตราเดินของคนนั้น ก้าวที่ sync มาทีหลังจะไปอยู่ในวันถัดไป (มี * ในคำอธิบาย): ${M.filter(m => m.nosync.length).map(m => `${m.alias} ${m.nosync.map(x => days.find(d => d.d === x).label).join(", ")}`).join(" · ")}`] : []),
  ...M.flatMap(m => m.moved.map(x => `${m.alias} ${days.find(d => d.d === x.d).label}: ยอด ${full(x.steps)} ก้าว sync เข้ามาตอน ${x.at} ถือเป็นก้าวของ ${days.find(d => d.d === x.d).label} (ตามที่ผู้ดูแลระบุ) แสดงด้วย *`)),

  `ยอดรายวัน = ยอดสะสมในภาพสุดท้ายของวัน ลบยอดสะสมในภาพสุดท้ายของวันก่อน ก้าวที่เดินหลังภาพสุดท้ายของวันจะไปนับรวมในวันถัดไป`,
  `${days.find(d => d.status === "est")?.label || "วันแรก"} ไม่มีภาพหน้าจอ เป็นค่าประมาณ: ยอดสะสมในภาพแรกของวันถัดไป หักก้าวช่วงเช้ามืดที่คนนั้นเดินตามปกติ`,
  `ช่วงเวลาในวัน: ก้าวระหว่างสองภาพจะเฉลี่ยแบ่งตามนาที (ถ้าสองภาพห่างกันไม่เกิน ${D.hour_gap / 60} ชั่วโมง) app อาจ sync ช้ากว่ากิจกรรมจริง (ประมาณ 10–15 นาที) เวลาจึงคลาดได้เล็กน้อย`,
  "คาดการณ์: แต่ละคนเดินเท่าค่าเฉลี่ยของตัวเองในวันทำงานและวันหยุดที่ผ่านมา ช่วงต่ำ–สูง ใช้วันที่น้อยที่สุดและมากที่สุดของแต่ละประเภท วันหยุดนักขัตฤกษ์นับเป็นวันหยุด",
  `วันนี้ (${D.as_of.label}) ยังไม่จบ ตัวเลขถึง ${D.as_of.time} บางคนอาจยังไม่ sync`,
].map(s => `<li>${esc(s)}</li>`).join("");

fromHash();
render();
window.scrollTo(0, 0); addEventListener("load", () => window.scrollTo(0, 0));   // a hash like #war names a section id: never let the browser jump under the sticky header
setInterval(drawFresh, 60000);
let rt, lastW = $(".wrap").clientWidth;
new ResizeObserver(() => { const w = $(".wrap").clientWidth; if (w === lastW) return; lastW = w; clearTimeout(rt); rt = setTimeout(() => { ANIM = false; render(); }, 120); }).observe($(".wrap"));
})();
