<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Running War Room</title>
<meta name="description" content="ห้องติดตามการแข่งเดินกับทีมข้างหน้า: วันนี้ไล่ทันหรือโดนทิ้ง วางแผนด้วย Simulator และเจาะข้อมูลใน Explore">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f3fc">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%231d48c8%22/%3E%3Crect x=%2212%22 y=%2216%22 width=%2240%22 height=%2228%22 rx=%225%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22/%3E%3Cpath d=%22M19 37l7-7 5 4 9-10%22 fill=%22none%22 stroke=%22%233db5ff%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M24 50h16%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300..700&family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Running War Room: blue = ทีมเรา and a good day, red = a day we fall behind (the hero panel turns red), sky = the
   one accent. Lavender-blue ground, soft white rounded panels, one deep hero panel per screen. Light only (user). */
:root {
  color-scheme: light;
  --ground: #f3f3fc; --panel: #ffffff; --tint: #f5f5fd;
  --ink: #0f1a33; --ink-2: #4f5b75; --muted: #5c6780; --rule: #e1e7f1; --rule-2: #edf1f7;
  --blue: #1d48c8; --blue-2: #2c66f0; --navy: #0b1c4a; --blue-ink: #c6d6fb; --blue-soft: #e2eafd; --blue-tint: rgba(44, 102, 240, .12);
  --sky: #3db5ff; --sky-ink: #0a6aa8;
  --red: #c0222e; --red-2: #e0303c; --red-deep: #5e0b14; --red-soft: #fde2e2; --red-ink: #ffe4e4; --red-tint: rgba(224, 48, 60, .12);
  --ld: #1f2633; --ghost: #a3adc1;
  --good: #0b5ea8; --good-soft: #dcefff;
  --shadow: 0 1px 2px rgba(11, 28, 74, .05), 0 14px 32px -18px rgba(11, 28, 74, .28);
  /* Explore draws the other team: never our blue, never alarm red; weekday = steel blue, off day = orange, empty = gray */
  --hot: #2b7bab; --hot-ink: #1b5a82; --off: #d96f0e; --off-ink: #9a4a00; --idle: #c9ced9;
  --m1: #2a78d6; --m2: #e87ba4; --m3: #1baf7a; --m4: #eda100; --m5: #6250d6; --m6: #008300;
  --font: "Anuphan", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num: "Archivo", "Anuphan", system-ui, sans-serif;
  --r: 22px; --step: 120ms;
  --nav-h: 64px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scrollbar-color: #b9c4da var(--ground); }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.6 var(--font); font-variant-numeric: tabular-nums; }
::selection { background: var(--sky); color: var(--navy); }
:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
a { color: inherit; text-underline-offset: 3px; }
.n { font-family: var(--num); font-variant-numeric: tabular-nums; font-stretch: 106%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground); }

/* ---------- top bar + tabs (tabs sit in the bar on desktop, at the thumb on phones) ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(243, 243, 252, .96); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 16px; }
.brand { display: grid; gap: 3px; line-height: 1.1; margin-right: auto; }
.brand b { font-size: 17px; font-weight: 700; color: var(--blue); letter-spacing: -.005em; }
.brand::after { content: ""; width: 24px; height: 3px; border-radius: 2px; background: var(--sky); }
.fresh { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.fresh i { width: 7px; height: 7px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 3px rgba(61, 181, 255, .25); }
.fresh.old i { background: #e8a200; box-shadow: 0 0 0 3px rgba(232, 162, 0, .25); }
.fresh.stale { color: var(--red); font-weight: 600; }
.fresh.stale i { background: var(--red-2); box-shadow: 0 0 0 3px var(--red-tint); }
.tabs { display: flex; gap: 4px; }
.tabs button { appearance: none; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; color: var(--ink-2); padding: 7px 14px; border-radius: 999px; transition: background-color 160ms, color 160ms; }
.tabs button svg { width: 18px; height: 18px; flex: none; }
@media (hover: hover) { .tabs button:hover { color: var(--ink); background: var(--blue-soft); } }
.tabs button[aria-selected="true"] { background: var(--blue); color: #fff; font-weight: 600; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 18px 20px; }
.h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 0 12px; font-size: 16px; font-weight: 700; color: var(--blue); }
.h span { font-size: 12px; font-weight: 400; color: var(--muted); text-align: right; }

/* ---------- WAR ROOM ---------- */
.war { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.war > *, .sim > * { min-width: 0; }
.sim .col { display: contents; }
.sim .s-plan { order: 1; } .sim .s-scn { order: 2; } .sim .s-cps { order: 3; }
.hero { border-radius: var(--r); padding: 20px 20px 16px; color: #fff; background: linear-gradient(155deg, var(--blue-2), var(--blue) 45%, var(--navy)); box-shadow: 0 18px 36px -20px rgba(11, 28, 74, .7); transition: background 400ms; position: relative; overflow: hidden; }
.hero .when { font-size: 13px; color: var(--blue-ink); }
.hero .verb { font-size: 18px; font-weight: 600; margin-top: 12px; }
.hero .big { font-family: var(--num); font-stretch: 112%; font-weight: 800; font-size: clamp(60px, 18vw, 92px); line-height: .95; letter-spacing: -.035em; margin-top: 2px; }
.hero .unit { font-size: 13px; color: var(--blue-ink); margin-top: 4px; }
.delta { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 4px 12px 4px 8px; background: var(--good-soft); color: var(--good); }
.delta svg { width: 16px; height: 16px; flex: none; }
.delta .n { font-weight: 800; }
.hero .rule { margin-top: 12px; }
.hero svg text { font-family: var(--font); }
/* a day we fall behind: the whole hero turns red and says so (user, 2026-10-31: "ดู impact กว่านี้") */
.bad .hero { background: linear-gradient(155deg, var(--red-2), var(--red) 45%, var(--red-deep)); box-shadow: 0 18px 40px -18px rgba(94, 11, 20, .75); }
.bad .hero .when, .bad .hero .unit { color: var(--red-ink); }
.bad .delta { background: #fff; color: var(--red); font-size: 15px; }
.alarm { display: none; margin: 14px -20px -16px; padding: 10px 20px; background: rgba(0, 0, 0, .22); font-size: 14px; font-weight: 600; align-items: center; gap: 8px; }
.alarm svg { width: 18px; height: 18px; flex: none; }
.bad .alarm { display: flex; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 10px; }
.vs .t { display: grid; min-width: 0; }
.vs .t.r { text-align: right; }
.vs .who { font-size: 13px; color: var(--ink-2); }
.vs .v { font-family: var(--num); font-stretch: 108%; font-weight: 800; font-size: clamp(32px, 9vw, 42px); line-height: 1.05; letter-spacing: -.03em; color: var(--ld); }
.vs .us .v { color: var(--blue); }
.bad .vs .rv .v { color: var(--red); }
.vs .x { font-family: var(--num); font-style: italic; font-weight: 700; font-size: 14px; color: var(--sky-ink); padding-bottom: 8px; }
.readout { margin-top: 10px; font-size: 13px; color: var(--ink-2); min-height: 21px; }
.readout b { color: var(--ink); font-weight: 700; font-family: var(--num); }
.today-c { touch-action: pan-y; cursor: crosshair; margin-top: 6px; }
.today-c svg { display: block; width: 100%; height: auto; overflow: visible; }
.warn { background: var(--navy); color: #fff; border-radius: var(--r); padding: 16px 20px; font-size: 14px; line-height: 1.55; }
.warn b { color: var(--sky); font-weight: 700; }
.bad .warn { background: var(--red-deep); }
.bad .warn b { color: #ffb4b4; }
.goal .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goal .v { font-family: var(--num); font-stretch: 108%; font-weight: 800; font-size: 30px; letter-spacing: -.03em; line-height: 1; color: var(--blue); }
.goal .v small { font-family: var(--font); font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.goal .pct { font-family: var(--num); font-weight: 700; color: var(--blue); font-size: 15px; }
.track { position: relative; height: 10px; margin: 16px 0 8px; background: var(--blue-soft); border-radius: 5px; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--blue-2); max-width: 100%; }
.track { margin-top: 30px; }
.track b { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--navy); }
.track b span { position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--navy); }
.track b.end span { left: auto; right: 0; transform: none; }
.track b.start span { left: 0; transform: none; }
.goal .foot { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
.tl { position: relative; display: grid; gap: 14px; padding-left: 74px; }
.tl::before { content: ""; position: absolute; left: 60px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--blue-soft); }
.tl div { position: relative; display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.tl .tm { position: absolute; left: -74px; width: 44px; text-align: right; font-family: var(--num); font-weight: 600; font-size: 13px; color: var(--muted); top: 1px; }
.tl div::before { content: ""; position: absolute; left: -21px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 3px solid var(--red-2); }
.tl div.g::before { background: var(--sky); border-color: var(--blue); }
.tl div.best::before { background: var(--panel); border-color: var(--blue); }
.tl .d { font-family: var(--num); font-weight: 700; white-space: nowrap; color: var(--red); }
.tl .g .d { color: var(--blue); }
.empty { font-size: 14px; color: var(--muted); margin: 0; }
.kv { display: grid; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule-2); font-size: 14px; color: var(--ink-2); }
.kv div:first-child { border-top: 0; padding-top: 0; }
.kv div:last-child { padding-bottom: 0; }
.kv b { color: var(--ink); font-weight: 600; text-align: right; }
.kv .ok { color: var(--good); }
.kv .no { color: var(--red); }

/* ---------- SIMULATOR ---------- */
.sim { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.sim .hero .big { font-size: clamp(40px, 12vw, 64px); font-stretch: 104%; }
.sim .hero .sub { font-size: 14px; color: var(--blue-ink); margin-top: 6px; }
.bad .sim .hero .sub, .sim.bad .hero .sub { color: var(--red-ink); }
.ctl { display: grid; gap: 2px; }
.ctl + .ctl { margin-top: 16px; }
.ctl .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.ctl .lab b { font-family: var(--num); font-stretch: 108%; font-size: 26px; font-weight: 800; color: var(--blue); letter-spacing: -.02em; }
.ctl input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; margin: 6px 0 2px; height: 30px; background: transparent; cursor: pointer; --p: 50%; }
.ctl input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--blue-2) var(--p), var(--blue-soft) var(--p)); }
.ctl input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--blue-soft); }
.ctl input[type=range]::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--blue-2); }
.ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border-radius: 50%; background: #fff; border: 3px solid var(--blue-2); box-shadow: 0 2px 6px rgba(11, 28, 74, .25); }
.ctl input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--blue-2); box-shadow: 0 2px 6px rgba(11, 28, 74, .25); }
.bad .ctl input[type=range]::-webkit-slider-thumb, .sim.bad .ctl input[type=range]::-webkit-slider-thumb { border-color: var(--blue); }
.ctl .hint { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.ctl .hint .hot { color: #9a5b00; font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills.row { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; }
.pills.row button { justify-content: center; padding: 7px 4px; }
.pills.two button { flex-direction: column; gap: 0; line-height: 1.3; }
.pills.stack { display: grid; grid-template-columns: minmax(0, 1fr); }
.pills.stack button { justify-content: space-between; }
@media (min-width: 900px) { .pills.stack { grid-template-columns: repeat(3, minmax(0, 1fr)); } .pills.stack button { flex-direction: column; justify-content: center; gap: 0; } }
.pills button { appearance: none; border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 7px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; font-size: 14px; min-height: 40px; align-items: center; }
.pills button small { font-size: 12px; color: var(--muted); }
@media (hover: hover) { .pills button:hover { border-color: var(--blue-2); } }
.pills button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.pills button[aria-pressed="true"] small { color: var(--blue-ink); }
.squad-out { margin-top: 14px; display: grid; gap: 8px; }
.squad-out div { display: flex; justify-content: space-between; gap: 12px; background: var(--tint); border-radius: 14px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); }
.squad-out b { font-family: var(--num); font-weight: 800; font-size: 18px; color: var(--ink); white-space: nowrap; }
.squad-out .no b { color: var(--red); }
.split { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule-2); }
.h.sm { font-size: 15px; margin-bottom: 10px; }
.squad-out .who-s { display: inline-flex; align-items: baseline; gap: 4px; flex-wrap: wrap; justify-content: flex-end; color: var(--muted); font-size: 13px; }
.squad-out .who-s b { font-size: 17px; }
.squad-out .who-s b.hv { color: var(--blue); }
.squad-out .who-s em { font-style: normal; color: var(--muted); margin: 0 4px; }
/* phones: the plan's result follows the sliders once the hero has scrolled away */
.s-dock { display: none; }
@media (max-width: 899px) {
  .s-dock { position: fixed; z-index: 24; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 18px; border-radius: 999px; color: #fff; font-size: 13px;
    background: linear-gradient(155deg, var(--blue), var(--navy)); box-shadow: 0 10px 24px -10px rgba(11, 28, 74, .6);
    opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 200ms cubic-bezier(.16, 1, .3, 1), transform 200ms cubic-bezier(.16, 1, .3, 1), background 400ms; }
  .s-dock.on { opacity: 1; transform: none; }
  .s-dock.bad { background: linear-gradient(155deg, var(--red), var(--red-deep)); box-shadow: 0 10px 24px -10px rgba(94, 11, 20, .6); }
  .s-dock b { font-family: var(--num); font-stretch: 104%; font-weight: 800; font-size: 16px; }
  .s-dock span { color: var(--blue-ink); }
  .s-dock.bad span { color: var(--red-ink); }
  #sim { padding-bottom: 56px; }
}
.note-s { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

/* ---------- EXPLORE (incumbent views, restyled through the tokens) ---------- */
.know { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 12px; margin: 0 -2px 4px; }
.know .card { scroll-snap-align: start; display: grid; gap: 6px; align-content: start; padding: 16px 18px; }
.know .card h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.know .card strong { font-family: var(--num); font-stretch: 108%; font-size: 28px; font-weight: 800; color: var(--ld); line-height: 1.1; letter-spacing: -.02em; }
.know .card p { margin: 0; font-size: 13px; color: var(--ink-2); }
.know .mini { min-height: 72px; }
.know-h { margin: 18px 0 10px; font-size: 16px; font-weight: 700; color: var(--blue); }
.proof { appearance: none; border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 5px 12px 5px 14px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); justify-self: start; }
@media (hover: hover) { .proof:hover { border-color: var(--blue-2); background: var(--tint); } }
.proof svg { width: 14px; height: 14px; }
.mini .mk { transition: opacity 150ms; }
.mini svg:hover .mk { opacity: .4; }
.mini svg .mk:hover { opacity: 1; }
.bar { display: grid; gap: 10px; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; justify-self: start; }
.seg button { appearance: none; border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
@media (hover: hover) { .seg button:hover { background: var(--tint); color: var(--ink); } }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.seg.sm button { padding: 4px 12px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 4px 12px 4px 8px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
@media (hover: hover) { .chip:hover { border-color: var(--ink-2); } }
.chip[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: #fff; }
.chip .bib { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; font-style: italic; }
.proof:active, .chip:active, .seg button:active, .pills button:active, .tabs button:active { transform: scale(.97); }
.view { padding: 18px 20px 20px; }
.view h2 { margin: 0; font-size: 18px; font-weight: 600; color: var(--blue); }
.view .sub { margin: 2px 0 12px; color: var(--muted); font-size: 13px; }
.view-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin: 4px 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 3px; border-radius: 2px; }
.legend i.dash { height: 0; border-top: 2px dashed currentColor; width: 16px; border-radius: 0; }
.legend i.hatch { background: repeating-linear-gradient(135deg, var(--off) 0 2px, #fff 2px 5px); border: 1px solid var(--off); }
.halves { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; border-top: 1px solid var(--rule); }
.halves > div { padding: 14px 4px 0; }
.halves > div + div { border-left: 1px solid var(--rule); padding-left: 20px; }
.halves h3 { margin: 0 0 2px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.halves h3 i { width: 12px; height: 12px; border-radius: 3px; }
.halves .big { font-family: var(--num); font-weight: 800; font-size: 32px; line-height: 1.1; letter-spacing: -.02em; }
.halves .big small { font-family: var(--font); font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 4px; letter-spacing: 0; }

<script>
(() => {
const D = JSON.parse(document.getElementById("data").textContent);

/* ---------- svg helpers ---------- */

function vbar(parent, x, y, w, h, attrs) {

function hbar(parent, x, y, w, h, attrs) {

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p * 2) / 2 * p; }
function ticks(max, n = 4) { const st = niceMax(max / n); const out = []; for (let v = 0; v <= max + 1e-9; v += st) out.push(v); return out; }
const W = host => Math.max(280, Math.min(host.clientWidth || 600, 1080));

/* ---------- motion: marks run out from their start (expo ease-out), never on resize ---------- */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.16, 1, .3, 1)";
let ANIM = !RM;
function run(node, frames, delay = 0, dur = 650) {
  if (ANIM && node.animate) node.animate(frames, { duration: dur, delay, easing: EASE, fill: "backwards" });

}
function drawIn(node, delay, dur = 900) { node.setAttribute("pathLength", 1); return run(node, [{ strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 0 }], delay, dur); }
function rise(node, delay, dur = 550) { node.style.transformBox = "fill-box"; node.style.transformOrigin = "50% 100%"; return run(node, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], delay, dur); }
function fade(node, delay, dur = 350) { return run(node, [{ opacity: 0 }, { opacity: 1 }], delay, dur); }
// bib numerals: navy on the light member hues, white on the dark ones
function bibInk(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] > .25 ? INK : "#fff";
}

const tip = $("#tip");
function showTip(ev, html) {

const ARROW = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      txt(s, x + bw / 2, h - 3, lab.split(" ")[0], { "text-anchor": "middle", "font-size": 11, fill: MUTED });

/* ================= WAR ROOM (user, 2026-10-31) =================

function drawWar() {

  const heavy = WR.heavy, now = T.now;

      ? `<b>ช่วงเย็นยังมาไม่ถึง:</b> ${rv} เดิน ${heavy.share}% ของวันช่วง ${heavy.from}–${heavy.to} น. ช่องว่างน่าจะ${chase ? "กว้างขึ้น" : "แคบลง"}ตอนค่ำ แคปอีกทีหลัง ${heavy.to}:00`
      : now < heavy.to * 60 ? `<b>ตอนนี้คือช่วงที่${rv} เดินหนัก:</b> ${heavy.share}% ของวันเขามาช่วง ${heavy.from}–${heavy.to} น. แคปอีกทีหลัง ${heavy.to}:00`
      : `<b>ผ่านช่วงที่${rv} เดินหนักแล้ว</b> (${heavy.from}–${heavy.to} น.) ตัวเลขตอนนี้ใกล้ยอดจบวันแล้ว`) : "";
  const tg = WR.target, pct = tg.today ? Math.round(T.us / tg.today * 100) : 0;

  host.innerHTML = `

        <div class="t us"><span class="who">ทีมเรา</span><span class="v">${full(T.us)}</span></div>
        <span class="x">vs</span>

      </div>

    <section class="panel pad goal">
      <div class="h">เป้าวันนี้ของทีมเรา<span>${KIND[tg.kind]} · ต่อคน</span></div>

      <div class="track"><i style="width:${Math.min(100, pct)}%"></i><b class="${tg.by_now / tg.today > .75 ? "end" : tg.by_now / tg.today < .2 ? "start" : ""}" style="left:${Math.min(100, tg.by_now / tg.today * 100).toFixed(1)}%"><span>ควรถึงตอนนี้ ${full(tg.by_now)}</span></b></div>
      <div class="foot"><span>ตามจังหวะปกติของ${KIND[tg.kind]}</span><span>${T.us >= tg.today ? "ถึงเป้าแล้ว" : `อีก ${full(tg.today - T.us)}`}</span></div>

      ${ms.length ? `<div class="tl">${ms.map(m => m.gain == null

// distance rule: one bar from "level with them" (right end) back to the gap; hollow = last night, solid = now
function drawDistance(host, good) {
  const w = Math.max(260, Math.min(host.clientWidth || 320, 520)), h = 56, L = 8, R = w - 8, y = 28;
  const s = svgIn(host, w, h, `ระยะห่าง${WR.base.night ? "เมื่อคืน" : ""} ${full(Math.abs(WR.base.gap))} ตอนนี้ ${full(Math.abs(WR.gap))}`);
  const max = Math.max(Math.abs(WR.base.gap), Math.abs(WR.gap), 1);   // the left end is whichever gap is larger: both ends carry a label
  const X = v => L + (R - L) * (1 - Math.min(max, Math.abs(v)) / max);
  const a = X(WR.base.gap), b = X(WR.gap);
  el("line", { x1: L, x2: R, y1: y, y2: y, stroke: "#fff", "stroke-opacity": .2, "stroke-width": 6, "stroke-linecap": "round" }, s);
  run(el("line", { x1: Math.min(a, b), x2: Math.max(a, b), y1: y, y2: y, stroke: good ? C("--sky") : "#fff", "stroke-width": 6, "stroke-linecap": "round" }, s), [{ opacity: 0 }, { opacity: 1 }], 200, 500);
  el("line", { x1: a, x2: a, y1: y - 7, y2: y + 7, stroke: "#fff", "stroke-opacity": .7, "stroke-width": 2, "stroke-linecap": "round" }, s);
  run(el("rect", { x: b - 2, y: y - 12, width: 4, height: 24, rx: 2, fill: good ? C("--sky") : "#fff" }, s),
    [{ transform: `translate(${a - b}px, 0)` }, { transform: "none" }], 150, 900);
  el("line", { x1: R, x2: R, y1: y - 10, y2: y + 10, stroke: "#fff", "stroke-width": 2, "stroke-linecap": "round" }, s);
  txt(s, R, y - 15, WR.mode === "chase" ? `ทัน${rvName(WR.rival.rank)}` : "เสมอกัน", { "text-anchor": "end", "font-size": 11, "font-weight": 600, fill: "#fff" });
  txt(s, Math.max(L, Math.min(R - 40, a)), y + 24, `${WR.base.night ? "เมื่อคืน" : WR.base.time} ${full(Math.abs(WR.base.gap))}`, { "text-anchor": a < 60 ? "start" : "middle", "font-size": 11, fill: "#fff", "fill-opacity": .8 });
  txt(s, b, y - 15, "ตอนนี้", { "text-anchor": b < L + 24 ? "start" : "middle", "font-size": 11, "font-weight": 700, fill: "#fff" });
}

// today: both teams' steps since last night as two rising lines; the space between them is who is winning the day.
// Distilled (user, 2026-10-31): no grid, no legend, names at the line ends, the rest of the day faded.
function drawToday(host, good) {
  const w = W(host), narrow = w < 560, L = 0;
  let h = 210;
  if (!narrow) {   // desktop: fill the panel down to the bottom of the left column
    const g = $(".war .goal"), top_ = host.getBoundingClientRect().top;
    h = Math.max(300, Math.round(g ? g.getBoundingClientRect().bottom - top_ - 20 : 300));
  }
  const R = w - (narrow ? 72 : 96), top = 24, bot = h - 20;
  const T = WR.today, G = WR.ghost, now = T.now;
  const top_v = Math.max(T.us, T.rival, G ? G[23] : 0, WR.target.today * .4) * 1.05;
  const X = m => L + (R - L) * m / 1440, Y = v => bot - (bot - top) * v / top_v;
  const s = svgIn(host, w, h, `ก้าวสะสมวันนี้ ทีมเรา ${full(T.us)} ${rvName(WR.rival.rank)} ${full(T.rival)}`);
  const usC = good ? C("--blue-2") : C("--blue"), rvC = good ? C("--ld") : C("--red-2"), mu = C("--muted");
  el("rect", { x: X(now), y: top - 12, width: Math.max(0, X(1440) - X(now)), height: bot - top + 12, rx: 8, fill: C("--tint") }, s);
  if (WR.heavy) {
    const hv = WR.heavy;
    el("rect", { x: X(hv.from * 60), y: top - 2, width: X(hv.to * 60) - X(hv.from * 60), height: bot - top + 2, fill: C("--sky"), "fill-opacity": .14 }, s);
    txt(s, X((hv.from + hv.to) * 30), top - 10, "เขาเดินหนัก", { "text-anchor": "middle", "font-size": 10, "font-weight": 600, fill: C("--sky-ink") });
  }
  el("line", { x1: L, x2: X(1440), y1: bot, y2: bot, stroke: C("--rule"), "stroke-width": 1.5 }, s);
  if (G) {
    const gp = [[0, 0], ...G.map((v, i) => [(i + 1) * 60, v])];
    el("path", { d: "M" + gp.map(([m, v]) => `${X(m).toFixed(1)},${Y(v).toFixed(1)}`).join(" L"), fill: "none", stroke: C("--ghost"), "stroke-width": 2, "stroke-dasharray": "0.5 5", "stroke-linecap": "round" }, s);
    txt(s, X(1440) + 6, Y(G[23]) + 4, `ปกติ${KIND[WR.as_of.kind]}`, { "font-size": 10, fill: mu });
    txt(s, X(1440) + 6, Y(G[23]) + 17, `~${k(G[23])}`, { "font-size": 10, "font-weight": 600, fill: mu });
  }
  const P_ = i => T.series.map(r => `${X(r[0]).toFixed(1)},${Y(r[i]).toFixed(1)}`);
  fade(el("path", { d: "M" + P_(1).join(" L") + " L" + P_(2).reverse().join(" L") + " Z", fill: good ? C("--blue-tint") : C("--red-tint") }, s), 600, 500);
  drawIn(el("path", { d: "M" + P_(2).join(" L"), fill: "none", stroke: rvC, "stroke-width": 2, "stroke-linejoin": "round" }, s), 0, 900);
  drawIn(el("path", { d: "M" + P_(1).join(" L"), fill: "none", stroke: usC, "stroke-width": 3.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, s), 100, 900);
  const yU = Y(T.us), yR = Y(T.rival);
  el("circle", { cx: X(now), cy: yU, r: 5, fill: usC, stroke: "#fff", "stroke-width": 2 }, s);
  el("circle", { cx: X(now), cy: yR, r: 4, fill: rvC, stroke: "#fff", "stroke-width": 2 }, s);
  let lu = yU, lr = yR;
  if (Math.abs(lu - lr) < 28) { const m = (lu + lr) / 2, up = T.us >= T.rival; lu = m + (up ? -14 : 14); lr = m + (up ? 14 : -14); }
  const lx = X(now) + 10;
  txt(s, lx, lu - 1, "ทีมเรา", { "font-size": 11, "font-weight": 700, fill: usC });
  txt(s, lx, lu + 12, full(T.us), { "font-size": 11, "font-weight": 700, fill: usC, "font-family": "Archivo, sans-serif" });
  txt(s, lx, lr + 2, rvName(WR.rival.rank), { "font-size": 11, "font-weight": 600, fill: rvC });
  txt(s, lx, lr + 15, full(T.rival), { "font-size": 11, "font-weight": 600, fill: rvC, "font-family": "Archivo, sans-serif" });
  el("line", { x1: X(now), x2: X(now), y1: top - 6, y2: bot, stroke: C("--ink"), "stroke-opacity": .35, "stroke-width": 1.5 }, s);
  txt(s, X(now) - 4, top - 10, `ตอนนี้ ${hm(now)}`, { "text-anchor": "end", "font-size": 10, "font-weight": 600, fill: mu });
  ["00:00", "06:00", "12:00", "18:00", "24:00"].forEach((t, i) => txt(s, X(i * 360), h - 3, t, { "text-anchor": i === 0 ? "start" : i === 4 ? "end" : "middle", "font-size": 10, fill: mu }));
  // scrub: the readout follows the finger; leaving it shows the usual-day comparison
  const cur = el("g", { opacity: 0 }, s);
  el("line", { x1: 0, x2: 0, y1: top, y2: bot, stroke: C("--blue"), "stroke-opacity": .5 }, cur);
  const c1 = el("circle", { r: 5, fill: usC, stroke: "#fff", "stroke-width": 2 }, cur), c2 = el("circle", { r: 4, fill: rvC, stroke: "#fff", "stroke-width": 2 }, cur);
  const ro = $("#readout"), ghostAt = m => { if (!G) return null; const h_ = Math.min(23, Math.floor(m / 60)), a = h_ ? G[h_ - 1] : 0; return a + (G[h_] - a) * (m - h_ * 60) / 60; };
  const read = m => {
    if (m == null || m >= now) {
      cur.setAttribute("opacity", 0);
      ro.innerHTML = G ? `${KIND[WR.as_of.kind]}ปกติ เวลานี้${rvName(WR.rival.rank)} เดินได้ราว <b>${full(ghostAt(now))}</b> วันนี้เขาเดิน <b>${full(T.rival)}</b>`
        : `แตะหรือลากบนกราฟเพื่อดูตัวเลข ณ เวลานั้น`;
      return;
    }
    let r = T.series[0]; for (const x of T.series) if (x[0] <= m) r = x;
    cur.setAttribute("opacity", 1); cur.setAttribute("transform", `translate(${X(m)},0)`);
    c1.setAttribute("cy", Y(r[1])); c2.setAttribute("cy", Y(r[2]));
    ro.innerHTML = `<b>${hm(r[0])}</b> ทีมเรา <b>${full(r[1])}</b> vs <b>${full(r[2])}</b> ${rvName(WR.rival.rank)}`;
  };
  const pick = e => { const b = s.getBoundingClientRect(), x = (e.clientX - b.left) * w / b.width; return Math.max(0, Math.min(1440, Math.round((x - L) / (R - L) * 1440))); };
  s.addEventListener("pointermove", e => read(pick(e)));
  s.addEventListener("pointerdown", e => read(pick(e)));
  s.addEventListener("pointerleave", () => read(null));
  read(null);
}

/* ================= SIMULATOR =================
   Inputs come from tools/build_lead.py (D.sim): the remaining days, what the other team walks on each (low / usual /
   high from its own past days), today's share still to come. The page only adds them up: gap_end = gap_now −
   Σ (ours × share of the day − theirs). The split ("ใครเดินเท่าไร") never moves the result: it only spreads the same
   team average over the team, k people walking x more than the rest (rest = avg − k·x/n), so the two always agree. */
const SIMK = "rwr-sim2";
const simState = (() => {
  const d = SM ? { wk: SM.default.weekday, off: SM.default.off, scn: 1, k: 0, x: 8000 } : {};
  try { return { ...d, ...JSON.parse(localStorage.getItem(SIMK) || "{}") }; } catch (e) { return d; }
})();
const saveSim = () => { try { localStorage.setItem(SIMK, JSON.stringify(simState)); } catch (e) { /* private mode */ } };
let simDockObs = null;   // scroll handler that shows the phone result bar, added once

function simRun() {
  let g = SM.g0, cross = null, cum = WR ? WR.us.avg : 0;
  const pts = [g], ours = [];
  SM.days.forEach((d, i) => {
    const o = (d.kind === "off" ? simState.off : simState.wk) * d.frac;
    g -= o - d.rival[simState.scn]; cum += o;
    pts.push(g); ours.push(Math.round(cum));
    if (cross === null && g <= 0) cross = i;
  });
  return { pts, cross, end: g, ours };
}

function drawSim() {
  const host = $("#sim");
  if (!SM) { host.innerHTML = `<div class="panel pad"><p class="empty">ยังไม่มีข้อมูลพอสำหรับ Simulator</p></div>`; return; }
  const chase = SM.mode === "chase", rv = rvName(SM.rival_rank), n = SM.members;
  const scn = SM.scenarios ? [["แผ่ว", 0], ["ปกติ", 1], ["แรง", 2]] : [];
  host.innerHTML = `
    <div class="col">
    <section class="hero" id="s-hero" aria-live="polite"><div class="verb" style="margin-top:0">ถ้าทีมเราเดินตามแผนนี้</div><div class="big" id="s-v"></div><div class="sub" id="s-end"></div><div class="rule" id="s-chart"></div></section>
    <section class="panel pad s-cps"><div class="h">เช็คระหว่างทาง<span>ถ้าเดินตามแผนนี้ ก้าวเฉลี่ยต่อคน</span></div><div class="kv" id="s-cps"></div></section>
    </div><div class="col">
    <section class="panel pad s-plan">
      <div class="h">ทีมเราจะเดินคนละเท่าไร<span>ต่อคนต่อวัน</span></div>
      <div class="pills stack" role="group" aria-label="แผนสำเร็จรูป">${SM.presets.map(p => `<button type="button" data-p="${p.id}" aria-pressed="false">${esc(p.label)} <small>${k(p.weekday)} / ${k(p.off)}</small></button>`).join("")}</div>
      <p class="note-s" style="margin:6px 0 16px">เลือกแผนแล้วลากปรับต่อได้ เส้นขาวในกราฟขยับตาม ตัวเลขคือวันทำงาน / วันหยุด</p>
      <div class="ctl"><div class="lab"><label for="s-wk">วันทำงาน</label><b id="o-wk"></b></div><input id="s-wk" type="range" min="10000" max="40000" step="500"><div class="hint"><span>${rv} เดินราว ${k(SM.rival_rates.weekday[1])}</span><span>เราช่วงหลัง ${k(SM.us_pace)}</span></div></div>
      <div class="ctl"><div class="lab"><label for="s-off">วันหยุด</label><b id="o-off"></b></div><input id="s-off" type="range" min="10000" max="40000" step="500"><div class="hint"><span>${rv} เดินราว ${k(SM.rival_rates.off[1])}</span><span id="s-hot"></span></div></div>
      <div class="split">
        <div class="h sm">ถ้าให้บางคนเดินเยอะ<span>ค่าเฉลี่ยทั้งทีมเท่าเดิม กราฟไม่ขยับ</span></div>
        <div class="pills" role="group" aria-label="จำนวนคนที่เดินเยอะ">${Array.from({ length: n }, (_, i) => i).map(i => `<button type="button" data-k="${i}" aria-pressed="${simState.k === i}">${i ? i + " คน" : "ทุกคนเท่ากัน"}</button>`).join("")}</div>
        <div class="ctl" id="s-xw" style="margin-top:14px"><div class="lab"><label for="s-x">คนที่เดินเยอะ เดินมากกว่าคนอื่นวันละ</label><b id="o-x"></b></div><input id="s-x" type="range" min="1000" max="20000" step="500"></div>
        <div class="squad-out" id="s-out"></div>
      </div>
    </section>
    ${scn.length ? `<section class="panel pad s-scn"><div class="h">${rv} จะเดินแค่ไหน<span>เดาจากวันที่ผ่านมาของเขา</span></div>
      <div class="pills row two" style="--n:3" role="group" aria-label="${rv} จะเดินแบบไหน">${scn.map(([l, j]) => `<button type="button" data-s="${j}" aria-pressed="${simState.scn === j}">${l} <small>${k(SM.rival_rates.weekday[j])} / ${k(SM.rival_rates.off[j])}</small></button>`).join("")}</div>
      <p class="note-s">ตัวเลขคือวันทำงาน / วันหยุด ต่อคน แผ่ว = เดินน้อยเท่าวันที่แย่สุดของเขา แรง = เดินเท่าวันที่ดีสุด</p></section>` : ""}
    </div>
    <div class="s-dock" id="s-dock" aria-hidden="true"><b id="d-v"></b><span id="d-e"></span></div>`;
  const wk = $("#s-wk"), off = $("#s-off"), sx = $("#s-x");
  wk.value = simState.wk; off.value = simState.off; sx.value = simState.x;
  // each slider writes only its own value, so a preset's exact numbers survive dragging the other slider
  [[wk, "wk"], [off, "off"], [sx, "x"]].forEach(([el_, key]) => el_.addEventListener("input", () => { simState[key] = +el_.value; saveSim(); simPaint(); }));
  // phones: the hero scrolls away while you drag, so a small result bar follows you
  if (!simDockObs) { simDockObs = () => { const hero = $("#s-hero"), dock = $("#s-dock"); if (hero && dock) dock.classList.toggle("on", hero.getBoundingClientRect().bottom < 60); };
    addEventListener("scroll", simDockObs, { passive: true }); }
  simDockObs();
  host.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
    const p = SM.presets.find(x => x.id === b.dataset.p); simState.wk = p.weekday; simState.off = p.off;
    wk.value = p.weekday; off.value = p.off; saveSim(); simPaint();
  }));
  host.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => { simState.scn = +b.dataset.s; host.querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", x === b)); saveSim(); simPaint(); }));

function simPaint() {

  const ourL = [WR ? WR.us.avg : 0, ...r.ours], rvL = ourL.map((v, i) => v + r.pts[i]);   // both lines are average steps per person: up = more steps
  // short of the line: the same extra on every remaining day (today counts only its share still to come)
  const need = win ? 0 : r.end / SM.days.reduce((a, d) => a + d.frac, 0);
  const endTxt = `จบ ${dd(last)}: เรา ${full(ourL[last + 1])} vs ${rv} ${full(rvL[last + 1])}<br>${win ? `เรานำราว ${k(Math.abs(r.end))} ก้าวต่อคน` : `ตามหลังราว ${k(r.end)} ก้าวต่อคน<br>ต้องเดินเพิ่มอีกคนละราว ${full(Math.ceil(need / 100) * 100)} ทุกวัน`}`;
  if (chase) $("#s-v").textContent = win ? (r.cross === 0 ? "แซงวันนี้" : `แซง ${dd(r.cross)}`) : "ยังไม่ทัน";
  else { const lost = r.pts.findIndex((g, i) => i && g > 0); $("#s-v").textContent = win ? "รักษาอันดับ 1" : `โดนแซง ${dd(lost - 1)}`; }
  $("#s-end").innerHTML = endTxt;
  $("#s-dock").className = "s-dock" + ($("#s-dock").classList.contains("on") ? " on" : "") + (win ? "" : " bad");
  $("#d-v").textContent = $("#s-v").textContent;

  // two lines of average steps per person: ours (white, solid) vs rival (dashed). Walk more = our line climbs toward / past theirs
  const c = $("#s-chart"), w = Math.max(260, Math.min(c.clientWidth || 320, 640)), h = 190, L = 4, R = w - 96, top = 14, bot = h - 22;
  const lo = Math.min(...ourL, ...rvL), hi = Math.max(...ourL, ...rvL), pad = (hi - lo) * .06 || 1000;
  const X = i => L + (R - L) * i / (ourL.length - 1), Y = v => top + (bot - top) * (hi + pad - v) / (hi - lo + 2 * pad);
  const s = svgIn(c, w, h, "ก้าวเฉลี่ยต่อคนของทีมเราเทียบกับ" + rv + "ถึงวันจบ ตามแผนนี้");
  const runs = []; SM.days.forEach((d, i) => { if (d.kind !== "off") return; const r_ = runs[runs.length - 1]; if (r_ && r_[1] === i) r_[1] = i + 1; else runs.push([i, i + 1]); });
  runs.forEach(([a_, b_]) => el("rect", { x: X(a_), y: top - 4, width: X(b_) - X(a_), height: bot - top + 8, rx: 4, fill: "#fff", "fill-opacity": .09 }, s));
  if (runs.length) txt(s, L + 2, top + 8, "แถบจาง = วันหยุด", { "font-size": 10, fill: "#fff", "fill-opacity": .7 });
  const path = a => a.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  el("path", { d: "M" + path(ourL).join(" L") + " L" + path(rvL).reverse().join(" L") + " Z", fill: win ? C("--sky") : "#fff", "fill-opacity": win ? .35 : .16 }, s);
  el("path", { d: "M" + path(rvL).join(" L"), fill: "none", stroke: "#fff", "stroke-opacity": .8, "stroke-width": 2, "stroke-dasharray": "5 4", "stroke-linecap": "round" }, s);
  el("path", { d: "M" + path(ourL).join(" L"), fill: "none", stroke: "#fff", "stroke-width": 3.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, s);
  [0, ourL.length - 1].forEach(i => { el("circle", { cx: X(i), cy: Y(rvL[i]), r: 3.5, fill: "none", stroke: "#fff", "stroke-width": 1.5 }, s); el("circle", { cx: X(i), cy: Y(ourL[i]), r: i ? 5.5 : 4, fill: i && win ? C("--sky") : "#fff", stroke: i ? "#fff" : "none", "stroke-width": 2 }, s); });
  let yo = Y(ourL[last + 1]), yr = Y(rvL[last + 1]); if (Math.abs(yo - yr) < 26) { const m = (yo + yr) / 2, sg = yo <= yr ? -1 : 1; yo = m + sg * 13; yr = m - sg * 13; }

  // split: same team average, k people walk x more than the other n − k

// projected cumulative, day by day: today's rest, then each remaining day at its type's rate
const todayIdx = days.findIndex(d => d.status === "partial");
const asofAbs = days.findIndex(d => d.d === D.as_of.date) * 1440 + (+D.as_of.time.slice(0, 2)) * 60 + (+D.as_of.time.slice(3));
function memberPath(m) {
  const p = P.members[m.alias], out = {};
  ["mid", "low", "high"].forEach((name, j) => {
    let v = m.latest; const pts = [[asofAbs, v]];
    if (todayIdx >= 0) { v += p.rest[j]; pts.push([(todayIdx + 1) * 1440, v]); }
    days.forEach((d, i) => { if (d.status === "future") { v += p.rates[isOff(d) ? "off" : "weekday"][j]; pts.push([(i + 1) * 1440, v]); } });
    out[name] = pts;
  });
  return out;
}
function teamPath() {
  const all = M.map(memberPath), out = {};
  for (const name of ["mid", "low", "high"]) out[name] = all[0][name].map((p, i) => [p[0], mean(all.map(a => a[name][i][1]))]);
  return out;
}

    `<div class="seg sm" id="tmode"><button type="button" data-m="cum" aria-pressed="${state.mode === "cum"}">สะสม</button><button type="button" data-m="day" aria-pressed="${state.mode === "day"}">รายวัน</button></div></div><div class="legend" id="tl"></div><div id="c"></div>`;

  $("#tmode", host).querySelectorAll("button").forEach(b => b.onclick = () => go({ mode: b.dataset.m }));
  const c = $("#c", host), w = W(c), h = w < 560 ? 260 : 340, L = 44, R = w < 560 ? 52 : 72, T = 14, B = 34;
  const nd = days.length, X = mnt => L + (w - L - R) * mnt / (nd * 1440);
  const asofMin = days.findIndex(d => d.d === D.as_of.date) * 1440 + (+D.as_of.time.slice(0, 2)) * 60 + (+D.as_of.time.slice(3));
  const s = svgIn(c, w, h, "Trend");
  const series = [];
  let max;
  if (state.mode === "cum") {
    if (scope === "team") {
      let cum = 0; const pts = [[0, 0]];
      seen.forEach(i => { const v = D.team_daily[i]; if (v == null) return; cum += v; pts.push([days[i].status === "partial" ? asofMin : (i + 1) * 1440, cum]); });
      const now = mean(M.map(m => m.latest));
      pts[pts.length - 1][1] = now;
      series.push({ alias: "ทั้งทีม", col: OFF, pts, p: P.team, last: now, w: 3, proj: teamPath() });
    } else {
      for (const m of M) series.push({ alias: m.alias, col: hue[m.alias], pts: m.trace, p: P.members[m.alias], last: m.latest, w: 2, proj: memberPath(m) });
    }
    max = niceMax(Math.max(...series.map(x => x.p.high)));
  } else {
    const pick = scope === "team" ? [{ alias: "ทั้งทีม", col: OFF, vals: D.team_daily, w: 3 }] : M.map(m => ({ alias: m.alias, col: hue[m.alias], vals: m.daily, w: 2 }));
    for (const x of pick) series.push({ ...x, pts: seen.filter(i => x.vals[i] != null).map(i => [i * 1440 + 720, x.vals[i], i]) });
    max = niceMax(Math.max(...series.flatMap(x => x.pts.map(p => p[1]))) * 1.1);
  }
  const Y = v => T + (h - T - B) * (1 - v / max);
  // off-day bands + day ticks
  days.forEach((d, i) => {
    if (isOff(d)) el("rect", { x: X(i * 1440), y: T, width: X(1440) - X(0), height: h - T - B, fill: C("--tint") }, s);
    const every = w < 560 ? 4 : 2;
    if (i % every === 0) txt(s, X(i * 1440 + 720), h - B + 16, d.label.split(" ")[0], { "text-anchor": "middle", "font-size": 11, fill: d.status === "future" ? "#7a869c" : INK2 });
  });
  txt(s, X(0), h - 4, "ต.ค.", { "font-size": 10, fill: MUTED });
  const nov = days.findIndex(d => d.d.slice(5, 7) === "11"); if (nov > 0) txt(s, X(nov * 1440), h - 4, "พ.ย.", { "font-size": 10, fill: MUTED });
  for (const v of ticks(max)) { el("line", { x1: L, x2: w - R, y1: Y(v), y2: Y(v), stroke: v ? RULE2 : RULE }, s); txt(s, L - 6, Y(v) + 4, v ? k(v).replace(".0k", "k") : "0", { "text-anchor": "end", "font-size": 11, fill: MUTED }); }
  el("line", { x1: X(asofMin), x2: X(asofMin), y1: T, y2: h - B, stroke: INK2, "stroke-dasharray": "2 3" }, s);
  txt(s, X(asofMin) + 4, T + 10, "ตอนนี้", { "font-size": 11, fill: INK2 });
  const ordered = [...series].sort((a, b) => (a.alias === f) - (b.alias === f));
  const ends = [];
  for (const x of ordered) {
    const dim = f && x.alias !== f, g = el("g", { opacity: dim ? .18 : 1 }, s);
    const line = ps => ps.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("L");
    if (state.mode === "cum" && (series.length === 1 || x.alias === f))
      el("path", { d: `M${line(x.proj.low)}L${line([...x.proj.high].reverse())}Z`, fill: x.col, opacity: .1 }, g);
    if (state.mode === "cum") fade(el("path", { d: "M" + line(x.proj.mid), fill: "none", stroke: x.col, "stroke-width": 1.5, "stroke-dasharray": "5 4" }, g), 800, 450);
    drawIn(el("path", { d: "M" + x.pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("L"), fill: "none", stroke: x.col, "stroke-width": x.alias === f ? 3 : x.w, "stroke-linejoin": "round", "stroke-linecap": "round" }, g), 0, 1000);
    if (state.mode === "day") x.pts.forEach(p => el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, fill: x.col, stroke: "#fff", "stroke-width": 2 }, g));
    const endV = state.mode === "cum" ? x.p.mid : x.pts[x.pts.length - 1][1];
    const endX = state.mode === "cum" ? X(nd * 1440) : X(x.pts[x.pts.length - 1][0]);
    if (!dim && (series.length <= 4 || f || state.mode === "cum")) ends.push({ x: endX + 4, y: Y(endV) + 4, s: state.mode === "cum" ? k(endV) : x.alias, col: x.col });
  }
  // end labels: keep 13px apart so neighbours never overprint
  ends.sort((a, b) => a.y - b.y).forEach((e, i, a) => { if (i && e.y - a[i - 1].y < 13) e.y = a[i - 1].y + 13; });
  for (const e of ends) { el("circle", { cx: e.x + 2, cy: e.y - 4, r: 3, fill: e.col }, s); txt(s, e.x + 8, e.y, e.s, { "font-size": 11, "font-weight": 600, fill: INK }); }
  $("#tl", host).innerHTML = series.map(x => `<span><i class="line" style="background:${x.col}"></i>${esc(x.alias)}</span>`).join("") +
    (state.mode === "cum" ? `<span><i class="dash" style="color:${INK2}"></i>คาดการณ์</span>` : "");
  // crosshair: nearest day
  const cross = el("line", { y1: T, y2: h - B, stroke: INK, "stroke-width": 1, opacity: 0 }, s);
  const hit = el("rect", { x: L, y: T, width: w - L - R, height: h - T - B, fill: "transparent" }, s);
  const move = e => {
    const r = s.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width);
    const i = Math.max(0, Math.min(nd - 1, Math.floor((px - L) / (X(1440) - X(0)))));
    const d = days[i]; cross.setAttribute("x1", X(i * 1440 + 720)); cross.setAttribute("x2", X(i * 1440 + 720)); cross.setAttribute("opacity", .25);
    const val = x => {
      if (state.mode === "day") { const p = x.pts.find(p => p[2] === i); return p ? p[1] : null; }
      if (d.status === "future") return null;
      if (x.alias === "ทั้งทีม") { const p = x.pts.filter(p => p[0] <= (i + 1) * 1440).pop(); return p ? p[1] : null; }
      const p = x.pts.filter(p => p[0] <= (i + 1) * 1440).pop(); return p ? p[1] : null;
    };
    const rows = series.map(x => [x, val(x)]).filter(r => r[1] != null).sort((a, b) => b[1] - a[1]);
    showTip(e, `<b>${d.dow} ${d.label}</b> · ${TYPE[d.type]}` + (rows.length ? rows.map(([x, v]) => `<div class="r"><span><i style="background:${x.col}"></i>${esc(x.alias)}</span><b>${k(v)}</b></div>`).join("") : `<div>ยังไม่ถึงวันนี้</div>`) + (d.status === "est" ? `<div>${STATUS.est}</div>` : ""));
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerenter", move);
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
}

function viewHours(host) {
  const f = state.focus, who = f ? [byAlias[f]] : M;
  const ds = done.filter(i => days[i].status === "done");
  const per = (type) => {
    const sel = ds.filter(i => type === "all" || (type === "off") === isOff(days[i]));
    const out = Array(24).fill(0); let n = 0;
    for (const i of sel) for (const m of who) { const hs = m.hours[days[i].d]; if (hs) { hs.forEach((v, h) => out[h] += v); } n++; }
    return { vals: out.map(v => n ? v / n : 0), n: sel.length };
  };
  const wk = per("weekday"), of = per("off");
  host.innerHTML = `<h2>${f ? `ช่วงเวลาที่ ${esc(f)} เดิน` : `ช่วงเวลาที่${ANL} เดิน`}</h2><p class="sub">ก้าวเฉลี่ยต่อคนในแต่ละชั่วโมง แยกวันทำงาน (${wk.n} วัน) กับวันหยุด (${of.n} วัน) ใช้เฉพาะวันที่จบแล้ว</p>` +
    `<div class="legend"><span><i class="line" style="background:${HOT}"></i>วันทำงาน</span><span><i class="line" style="background:${OFF}"></i>วันหยุด</span></div><div id="c"></div>` +
    `<h2 style="margin-top:22px;font-size:16px">รายวัน × ชั่วโมง</h2><p class="sub">ยิ่งเข้มยิ่งเดินมาก ช่องว่างคือไม่มีภาพหน้าจอช่วงนั้นพอจะบอกเวลาได้</p><div id="hm"></div>`;
  const c = $("#c", host), w = W(c), h = w < 560 ? 220 : 260, L = 40, R = 10, T = 14, B = 26;
  const max = niceMax(Math.max(...wk.vals, ...of.vals) * 1.1), X = hr => L + (w - L - R) * hr / 24, Y = v => T + (h - T - B) * (1 - v / max);
  const s = svgIn(c, w, h, "ก้าวรายชั่วโมง");
  for (const v of ticks(max)) { el("line", { x1: L, x2: w - R, y1: Y(v), y2: Y(v), stroke: v ? RULE2 : RULE }, s); txt(s, L - 6, Y(v) + 4, v ? (v >= 1000 ? k(v).replace(".0k", "k") : Math.round(v)) : "0", { "text-anchor": "end", "font-size": 11, fill: MUTED }); }
  for (let hr = 0; hr <= 24; hr += 3) txt(s, X(hr), h - 8, String(hr).padStart(2, "0"), { "text-anchor": "middle", "font-size": 11, fill: INK2 });
  for (const [ser, col] of [[of, OFF], [wk, HOT]]) {
    const pts = ser.vals.map((v, hr) => [X(hr + .5), Y(v)]);
    el("path", { d: `M${X(.5)},${Y(0)}L` + pts.map(p => p.join(",")).join("L") + `L${X(23.5)},${Y(0)}Z`, fill: col, opacity: .08 }, s);
    drawIn(el("path", { d: "M" + pts.map(p => p.join(",")).join("L"), fill: "none", stroke: col, "stroke-width": 2.5, "stroke-linejoin": "round" }, s), 0, 1000);
  }
  const cross = el("line", { y1: T, y2: h - B, stroke: INK, opacity: 0 }, s);
  const hit = el("rect", { x: L, y: T, width: w - L - R, height: h - T - B, fill: "transparent" }, s);
  const mv = e => { const r = s.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width), hr = Math.max(0, Math.min(23, Math.floor((px - L) / (X(1) - X(0)))));
    cross.setAttribute("x1", X(hr + .5)); cross.setAttribute("x2", X(hr + .5)); cross.setAttribute("opacity", .25);
    showTip(e, `<b>${String(hr).padStart(2, "0")}:00–${String(hr + 1).padStart(2, "0")}:00</b><div class="r"><span><i style="background:${HOT}"></i>วันทำงาน</span><b>${full(wk.vals[hr])}</b></div><div class="r"><span><i style="background:${OFF}"></i>วันหยุด</span><b>${full(of.vals[hr])}</b></div>`); };
  hit.addEventListener("pointermove", mv); hit.addEventListener("pointerenter", mv); hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });

  // day x hour heat
  const hm = $("#hm", host), hw = W(hm), rows = seen.filter(i => who.some(m => m.hours[days[i].d]));
  const lab = 64, cw = (hw - lab) / 24, rh = 22, hh = rows.length * (rh + 2) + 22;
  const grid = rows.map(i => Array.from({ length: 24 }, (_, hr) => who.reduce((a, m) => a + ((m.hours[days[i].d] || [])[hr] || 0), 0) / who.length));
  const gmax = Math.max(...grid.flat());
  const hs = svgIn(hm, hw, hh, "ก้าวรายวันรายชั่วโมง");
  rows.forEach((i, r) => {
    const d = days[i], y = r * (rh + 2);
    txt(hs, 0, y + 15, `${d.dow} ${d.label.split(" ")[0]}`, { "font-size": 12, fill: isOff(d) ? INK : INK2, "font-weight": isOff(d) ? 600 : 400 });
    grid[r].forEach((v, hr) => {
      const t = v / gmax;
      const cell = el("rect", { x: lab + hr * cw + 1, y, width: cw - 2, height: rh, rx: 3, fill: v < 1 ? C("--tint") : `color-mix(in oklab, ${isOff(d) ? OFF : HOT} ${Math.round(10 + t * 85)}%, #ffffff)` }, hs);
      fade(cell, hr * 22, 300);   // a clock sweep across the hours
      hover(cell, () => `<b>${d.dow} ${d.label}</b> ${String(hr).padStart(2, "0")}:00–${String(hr + 1).padStart(2, "0")}:00<div class="r"><span>${f ? esc(f) : "เฉลี่ยต่อคน"}</span><b>${full(v)}</b></div>${d.status === "partial" ? `<div>${STATUS.partial}</div>` : ""}`);
    });
  });
  for (let hr = 0; hr <= 24; hr += 3) txt(hs, lab + hr * cw, hh - 4, String(hr).padStart(2, "0"), { "text-anchor": "middle", "font-size": 11, fill: MUTED });
}

const DRAW = { daily: viewDaily, member: viewMember, trend: viewTrend, hours: viewHours };

/* ---------- state, routing: #war (start), #sim, #explore/<view>/... ---------- */
const TABS = ["war", "sim", "explore"];
function render() {
  TABS.forEach(t => { $(`#${t}`).hidden = state.tab !== t; $(`#tab-${t}`).setAttribute("aria-selected", state.tab === t); });
  drawFresh();
  if (state.tab === "war") drawWar();
  else if (state.tab === "sim") drawSim();
  else { drawKnow(); drawControls(); const v = $("#view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view"); DRAW[state.view](v); }
}
function hashOf() {
  if (state.tab !== "explore") return "#" + state.tab;
  const q = [state.view];
  if (state.view === "trend") q.push(state.scope, state.mode);
  if (state.focus) q.push("@" + state.focus);
  return "#explore/" + q.map(encodeURIComponent).join("/");
}
function go(patch) {
  const prevTab = state.tab;
  ANIM = !RM && !(Object.keys(patch).length === 1 && "focus" in patch);
  if (("view" in patch || "focus" in patch) && !("tab" in patch)) patch.tab = "explore";
  Object.assign(state, patch);
  history.replaceState(null, "", hashOf());
  render();
  if (prevTab !== state.tab) window.scrollTo({ top: 0 });
}
function fromHash() {
  const parts = location.hash.slice(1).split("/").map(decodeURIComponent);
  if (parts[0] === "sim" || parts[0] === "how" || parts[0] === "win") { state.tab = "sim"; return; }
  if (parts[0] !== "explore") return;
  state.tab = "explore";
  if (DRAW[parts[1]]) state.view = parts[1];
  for (const p of parts.slice(2)) {
    if (p.startsWith("@") && byAlias[p.slice(1)]) state.focus = p.slice(1);
    else if (p === "team" || p === "member") state.scope = p;
    else if (p === "cum" || p === "day") state.mode = p;
  }
}
TABS.forEach(t => $(`#tab-${t}`).onclick = () => go({ tab: t }));
$(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = TABS.indexOf(state.tab), t = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
  go({ tab: t }); $(`#tab-${t}`).focus();
});

$("#limits").innerHTML = [
  "War Room: ตัวเลขของสองทีมมาจากภาพ Team Ranking (ก้าวเฉลี่ยต่อคนของทั้งทีม) \"เมื่อคืน\" คือภาพสุดท้ายของเมื่อวาน ก้าวที่เดินหลังภาพนั้นนับเป็นของวันนี้",

  ...(M.some(m => m.nosync.length) ? [`ถ้ายอดของใครไม่ขยับเลยทั้งวัน (วันนี้นับหลัง 18:00) ถือว่ายังไม่ sync แสดงเป็น "ยังไม่ sync" ไม่นับเป็น 0 และไม่รวมในค่าเฉลี่ยกับอัตราเดินของคนนั้น ก้าวที่ sync มาทีหลังจะไปอยู่ในวันถัดไป (มี * ในคำอธิบาย): ${M.filter(m => m.nosync.length).map(m => `${m.alias} ${m.nosync.map(x => days.find(d => d.d === x).label).join(", ")}`).join(" · ")}`] : []),
  ...M.flatMap(m => m.moved.map(x => `${m.alias} ${days.find(d => d.d === x.d).label}: ยอด ${full(x.steps)} ก้าว sync เข้ามาตอน ${x.at} ถือเป็นก้าวของ ${days.find(d => d.d === x.d).label} (ตามที่ผู้ดูแลระบุ) แสดงด้วย *`)),
  ...(M.some(m => m.unsynced) ? [`วันนี้ ${M.filter(m => m.unsynced).map(m => m.alias).join(", ")} คาดการณ์นับวันนี้ให้เต็มวัน`] : []),
  "ตัวเลขทั้งหมดอ่านจากภาพหน้าจอ leaderboard ที่แคปไว้ (OCR) app แสดงก้าวปัดเป็นหลักร้อย (เช่น 24.4k)",
  `ยอดรายวัน = ยอดสะสมในภาพสุดท้ายของวัน ลบยอดสะสมในภาพสุดท้ายของวันก่อน ก้าวที่เดินหลังภาพสุดท้ายของวันจะไปนับรวมในวันถัดไป`,
  `${days.find(d => d.status === "est")?.label || "วันแรก"} ไม่มีภาพหน้าจอ เป็นค่าประมาณ: ยอดสะสมในภาพแรกของวันถัดไป หักก้าวช่วงเช้ามืดที่คนนั้นเดินตามปกติ`,
  `ช่วงเวลาในวัน: ก้าวระหว่างสองภาพจะเฉลี่ยแบ่งตามนาที (ถ้าสองภาพห่างกันไม่เกิน ${D.hour_gap / 60} ชั่วโมง) app อาจ sync ช้ากว่ากิจกรรมจริง (ประมาณ 10–15 นาที) เวลาจึงคลาดได้เล็กน้อย`,
  "คาดการณ์: แต่ละคนเดินเท่าค่าเฉลี่ยของตัวเองในวันทำงานและวันหยุดที่ผ่านมา ช่วงต่ำ–สูง ใช้วันที่น้อยที่สุดและมากที่สุดของแต่ละประเภท วันหยุดนักขัตฤกษ์นับเป็นวันหยุด",
  `วันนี้ (${D.as_of.label}) ยังไม่จบ ตัวเลขถึง ${D.as_of.time} บางคนอาจยังไม่ sync`,
].map(s => `<li>${esc(s)}</li>`).join("");

fromHash();
render();
window.scrollTo(0, 0); addEventListener("load", () => window.scrollTo(0, 0));   // a hash like #war names a section id: never let the browser jump under the sticky header
setInterval(drawFresh, 60000);
let rt, lastW = $(".wrap").clientWidth;
new ResizeObserver(() => { const w = $(".wrap").clientWidth; if (w === lastW) return; lastW = w; clearTimeout(rt); rt = setTimeout(() => { ANIM = false; render(); }, 120); }).observe($(".wrap"));
})();
</script>
