<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead Pack</title>
<meta name="description" content="วิเคราะห์ก้าวของทีมอันดับ 1: จะจบที่เท่าไร แผ่วช่วงไหน ใครถือยอด">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230f1d33%22/%3E%3Cpath d=%22M12 44h40%22 stroke=%22%23ffffff%22 stroke-width=%224%22 stroke-linecap=%22round%22 opacity=%22.35%22/%3E%3Cpath d=%22M12 44L30 30l8 6 14-16%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%225%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Ccircle cx=%2252%22 cy=%2220%22 r=%226%22 fill=%22%23ff5a1f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500;1,600;1,700&display=swap">
<style>
/* Lead Pack: the leading team read like live marathon graphics. Navy straps on a cool light ground,
   one hot orange = their weak window (weekdays, where to push). Two tabs: Insight (claims, each with
   its proof chart) and Explore (four views). Charts are SVG drawn from the inlined data. */
:root {
  color-scheme: light;
  --navy: #0f1d33; --navy-2: #1c2d4a; --navy-ink: #c9d3e3;
  --ground: #eef1f5; --panel: #ffffff; --tint: #f5f7fa;
  --ink: #0f1d33; --ink-2: #44526b; --muted: #5d6a82; --rule: #d6dce6; --rule-2: #e7ebf1;
  --hot: #ff5a1f; --hot-ink: #b83a0c; --hot-bg: #fff0e9;
  --off: #4a5f82; --off-ink: #2c3e5c;
  /* light straps (user, 2026-10-30: lighter, easier to read, never a dark theme) */
  --strap: #e9eef6; --strap-2: #dfe6f1; --gantry: #dbe3ef; --strap-ink: #44526b;
  /* ทีมเรา: deep teal, used only in the ทางชนะ section (navy = them, orange = their weak window) */
  --us: #0c5c60; --us-2: #137077; --us-ink: #c3e4e2; --us-tint: #f2f8f7; --us-band: #ddefec; --us-strap: #dcefec; --us-strap-2: #cfe7e3; --us-deep: #0a4a4e;
  /* Race Plan colour jobs: us-mark = ทีมเรา marks (brighter than --us so it parts from the leader's slate); warn = behind plan / the cut-off; win = a stretch we gained */
  --us-mark: #0b8178; --us-soft: #bfe3dd; --warn: #b4235a; --warn-bg: #fdedf2; --win-bg: #e1f3ef;
  /* member series: fixed per alias (validated: dataviz validate_palette, light, adjacent pairs; relief = direct labels) */
  --m1: #2a78d6; --m2: #e87ba4; --m3: #1baf7a; --m4: #eda100; --m5: #6250d6; --m6: #008300;
  --font: "Kanit", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
  --step: 120ms;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scrollbar-color: #b8c2d2 var(--ground); }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.6 var(--font); font-variant-numeric: tabular-nums; }
::selection { background: var(--navy); color: #fff; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 4px; }

button { font: inherit; color: inherit; }
a { color: inherit; text-underline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header strap: the one navy band of the page (the page itself stays light); minimal text tabs ---------- */
.top { position: sticky; top: 0; z-index: 20; color: #fff;
  background: linear-gradient(90deg, var(--navy) 40%, rgba(15, 29, 51, .86) 100%), repeating-linear-gradient(115deg, var(--navy) 0 26px, var(--navy-2) 26px 30px);
  box-shadow: 0 6px 20px rgba(15, 29, 51, .14); }
.top :focus-visible { outline-color: #fff; }
.top-in { max-width: 1120px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left)) 0; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand b { font-weight: 700; font-style: italic; font-size: 23px; line-height: 1; letter-spacing: .005em; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.brand b::before { content: ""; width: 8px; height: 22px; background: #fff; transform: skewX(-18deg); box-shadow: 6px 0 0 rgba(255, 255, 255, .45), 12px 0 0 rgba(255, 255, 255, .2); margin-right: 12px; }
.brand span { color: var(--navy-ink); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 12px; border-left: 1px solid rgba(255, 255, 255, .2); }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--navy-ink); white-space: nowrap;
  border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; padding: 5px 12px 5px 10px; background: rgba(255, 255, 255, .06); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .18); }
.live b { color: #fff; font-weight: 600; }
.tabs { grid-column: 1 / -1; display: flex; gap: 24px; margin-top: 10px; }
.tabs button { appearance: none; border: 0; background: none; color: rgba(201, 211, 227, .8); padding: 8px 0 12px; font-size: 15px; font-weight: 500; cursor: pointer; position: relative; }
.tabs button:hover { color: #fff; }
.tabs button[aria-selected="true"] { color: #fff; font-weight: 600; }
.tabs button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #fff; transform: scaleX(0); transform-origin: 0 50%; transition: transform 260ms cubic-bezier(.16, 1, .3, 1); }
.tabs button[aria-selected="true"]::after { transform: scaleX(1); }

.wrap { max-width: 1120px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left)) 72px; }
.panel { background: var(--panel); border-radius: var(--r); box-shadow: 0 1px 2px rgba(15, 29, 51, .06), 0 4px 14px rgba(15, 29, 51, .05); }
[role="tabpanel"], .view { animation: wipe var(--step) steps(2, end); }
@keyframes wipe { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0); } }
@media (prefers-reduced-motion: reduce) { [role="tabpanel"], .view { animation: none; } .tabs button::after, .proof svg { transition: none; } }

/* ---------- race (signature) ---------- */
/* broadcast strap: speed lines fading in from the right edge */
.race-head { color: var(--ink); border-radius: var(--r) var(--r) 0 0; padding: 18px 20px 16px;
  background: linear-gradient(90deg, var(--strap) 35%, rgba(233, 238, 246, .55) 100%), repeating-linear-gradient(115deg, var(--strap) 0 26px, var(--strap-2) 26px 30px); }
.race-head h1 { margin: 0; font-weight: 500; font-size: 17px; line-height: 1.35; color: var(--strap-ink); }
.race-head h1 strong { display: block; color: var(--ink); font-style: italic; font-weight: 700; font-size: clamp(40px, 7vw, 64px); line-height: 1.05; letter-spacing: -.01em; margin-top: 4px; }
.race-head h1 strong small { font-size: 17px; font-style: normal; font-weight: 400; color: var(--strap-ink); letter-spacing: 0; margin-left: 10px; white-space: nowrap; color: var(--strap-ink); }
.race-body { padding: 8px 12px 14px 12px; }
.race-note { padding: 0 20px 16px; color: var(--muted); font-size: 13px; }
svg { display: block; overflow: visible; }
svg text { font-family: var(--font); }

/* ---------- insight rows ---------- */
.ins { margin-top: 18px; display: grid; gap: 1px; background: var(--rule-2); border-radius: var(--r); overflow: hidden; }
.ins-row { background: var(--panel); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 40px; padding: 20px; align-items: center; }
.ins-row h2 { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.35; }
.ins-row h2 strong { font-style: italic; font-weight: 700; font-size: 30px; line-height: 1.1; margin-left: 6px; white-space: nowrap; }
.ins-row h2 strong.hot { color: var(--hot-ink); }
.ins-row p { margin: 6px 0 10px; color: var(--ink-2); font-size: 14px; }
.proof { appearance: none; border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 4px 12px 4px 14px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.proof:hover { border-color: var(--navy); background: var(--tint); }
.proof svg { width: 14px; height: 14px; transition: transform 200ms cubic-bezier(.16, 1, .3, 1); }
.proof:hover svg { transform: translateX(3px); }
.proof:active, .chip:active, .seg button:active { transform: scale(.97); }
.mini .mk { transition: opacity 150ms; }
.mini svg:hover .mk { opacity: .4; }
.mini svg .mk:hover { opacity: 1; }
#race .lane { transition: opacity 150ms; }
#race svg.focusing .lane:not(.on) { opacity: .3; }
.mini { min-height: 72px; }

/* ---------- explore ---------- */
.bar { display: grid; gap: 10px; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.seg button:hover { background: var(--tint); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.seg.sm button { padding: 4px 12px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 4px 12px 4px 8px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: #fff; }
.chip .bib { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; font-style: italic; }
.view { padding: 18px 20px 20px; }
.view h2 { margin: 0; font-size: 18px; font-weight: 500; }
.view .sub { margin: 2px 0 12px; color: var(--muted); font-size: 13px; }
.view-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin: 4px 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 3px; border-radius: 2px; }
.legend i.dash { height: 0; border-top: 2px dashed currentColor; width: 16px; border-radius: 0; }
.legend i.hatch { background: repeating-linear-gradient(135deg, var(--off) 0 2px, #fff 2px 5px); border: 1px solid var(--off); }

/* two hard halves: weekday | off-day */
.halves { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; border-top: 1px solid var(--rule); }
.halves > div { padding: 14px 4px 0; }
.halves > div + div { border-left: 1px solid var(--rule); padding-left: 20px; }
.halves h3 { margin: 0 0 2px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.halves h3 i { width: 12px; height: 12px; border-radius: 3px; }
.halves .big { font-style: italic; font-weight: 700; font-size: 34px; line-height: 1.1; }
.halves .big small { font-size: 14px; font-style: normal; font-weight: 400; color: var(--muted); margin-left: 4px; }
.halves dl { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.halves dd { margin: 0; text-align: right; font-weight: 500; color: var(--ink); }

/* member x day table */
.scroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table.heat { border-collapse: separate; border-spacing: 2px; font-size: 13px; min-width: 100%; }
.heat th { font-weight: 500; color: var(--ink-2); padding: 4px 6px; white-space: nowrap; }
.heat thead th { font-size: 12px; text-align: center; line-height: 1.25; vertical-align: bottom; }
.heat thead th b { display: block; font-weight: 600; color: var(--ink); font-size: 13px; }
.heat thead th.off b { color: var(--off-ink); }
.heat thead th.wk b { color: var(--hot-ink); }
.heat thead th .tag { display: block; height: 3px; border-radius: 2px; margin: 4px 2px 0; }
.heat tbody th { text-align: left; }
.heat td { text-align: center; padding: 7px 6px; border-radius: 4px; white-space: nowrap; font-weight: 500; min-width: 52px; }
.heat td.sum { background: none; color: var(--ink); text-align: right; font-weight: 600; min-width: 46px; }
.heat td.wait { color: var(--muted); font-weight: 400; font-size: 11px; white-space: normal; line-height: 1.2; }
.scroll .heat tbody th, .scroll .heat thead th:first-child { position: sticky; left: 0; z-index: 1; background: var(--panel); box-shadow: -20px 0 0 var(--panel); }
.sumtable { display: none; margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 8px; }
.heat td.est { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 2px, transparent 2px 6px); }
.heat td.part { outline: 1px dashed var(--muted); outline-offset: -2px; }
.heat tr.dim { opacity: .28; }
.heat .who { display: inline-flex; align-items: center; gap: 8px; }
.heat .gap { width: 10px; padding: 0; }

.limits { margin-top: 18px; }
.limits summary { cursor: pointer; padding: 14px 20px; font-weight: 500; list-style: none; display: flex; justify-content: space-between; }
.limits summary::-webkit-details-marker { display: none; }
.limits summary svg { width: 18px; height: 18px; color: var(--muted); transition: transform var(--step) steps(2, end); }
.limits[open] summary svg { transform: rotate(180deg); }
.limits ul { margin: 0; padding: 0 20px 18px 36px; color: var(--ink-2); font-size: 14px; display: grid; gap: 6px; }

.tip { position: fixed; z-index: 50; pointer-events: none; background: #fff; color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.45; box-shadow: 0 6px 20px rgba(15, 29, 51, .25); max-width: 240px; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }

/* ---------- ทางชนะ: our race against the leader (Team Ranking screenshots; roles only, never a team name) ---------- */
.teaser { appearance: none; width: 100%; margin-top: 18px; border: 0; border-radius: var(--r); cursor: pointer; text-align: left;
  display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 14px 20px; font-size: 15px;
  color: var(--us-deep); background: linear-gradient(90deg, var(--us-strap) 35%, rgba(220, 239, 236, .55) 100%), repeating-linear-gradient(115deg, var(--us-strap) 0 26px, var(--us-strap-2) 26px 30px); }
.teaser b { color: var(--us-deep); font-weight: 700; font-style: italic; font-size: 17px; }
.teaser .go { display: inline-flex; align-items: center; gap: 6px; color: var(--us-deep); font-weight: 600; white-space: nowrap; }
.teaser .go svg { width: 14px; height: 14px; transition: transform 200ms cubic-bezier(.16, 1, .3, 1); }
.teaser:hover .go svg { transform: translateX(3px); }
.teaser:focus-visible { outline-color: var(--us); }
.win { background: var(--panel); box-shadow: 0 1px 2px rgba(12, 92, 96, .08), 0 4px 14px rgba(12, 92, 96, .07); }
.win .race-head.win-head { background: linear-gradient(90deg, var(--us-strap) 35%, rgba(220, 239, 236, .55) 100%), repeating-linear-gradient(115deg, var(--us-strap) 0 26px, var(--us-strap-2) 26px 30px); }
.win-head h2, .win-head p { color: #2f5d5f !important; }
.win-head h2 b, .win-head p b, .win-head h2 strong { color: var(--us-deep) !important; }
.win-head h2 strong small { color: #2f5d5f !important; }
.win .wb + .wb, .win .wpair + .wb, .win .wb + .wpair, .win .play + .play, .win .wnote, .win .wpair > .w-chart { border-color: rgba(12, 92, 96, .14); }
.win .board tr.us td:not(.g), .win .cp.next { background: var(--us-band); }
.win .proof:hover { border-color: var(--us-mark); background: var(--us-tint); }
.win .board tr.us .tm { color: var(--us); }
.win .st.on { background: var(--us-mark); }
.win-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 20px; }
.win-head h2 { margin: 0; font-weight: 500; font-size: 17px; line-height: 1.35; color: var(--navy-ink); }
.win-head h2 b { color: #fff; font-weight: 600; }
.win-head h2 strong { display: block; color: #fff; font-style: italic; font-weight: 700; font-size: clamp(40px, 7vw, 64px); line-height: 1.05; letter-spacing: -.01em; margin-top: 4px; }
.win-head h2 strong small { font-size: 17px; font-style: normal; font-weight: 400; color: var(--navy-ink); letter-spacing: 0; margin-left: 10px; white-space: nowrap; }
.win-head p { margin: 6px 0 0; color: var(--navy-ink); font-size: 15px; max-width: 70ch; grid-column: 1; text-wrap: pretty; }
.win-head p b { color: #fff; font-weight: 600; }
.win-head p.rng { font-size: 13px; margin-top: 2px; }
.win-head .w-asof { grid-column: 2; grid-row: 1; align-self: start; margin: 2px 0 0; font-size: 13px; white-space: nowrap; }
.win-head .w-asof b { font-weight: 500; }
.win-head.only { border-radius: var(--r); }
.wb { padding: 18px 20px 20px; }
.wb + .wb, .wpair + .wb, .wb + .wpair { border-top: 1px solid var(--rule-2); }
.wb h3 { margin: 0 0 10px; font-size: 16px; font-weight: 500; line-height: 1.35; }
.wb h3 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.wb .sub { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
.wb .sub.ink2 { color: var(--ink-2); font-size: 14px; }

/* standings: a timing board, the last column on the navy finish gantry */
table.board { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.board th { font-size: 11px; font-weight: 400; color: var(--muted); text-align: right; padding: 8px 12px 6px; white-space: nowrap; vertical-align: bottom; line-height: 1.25; }
.board td { padding: 9px 12px; text-align: right; white-space: nowrap; font-weight: 500; }
.board .rk { width: 1%; text-align: center; font-style: italic; font-weight: 700; font-size: 15px; }
.board th.rk { font-style: normal; font-weight: 400; font-size: 11px; }
.board .tm { text-align: left; }
.board tr.us td { background: var(--tint); font-weight: 700; }
.board .rk.c-lead { color: var(--off-ink); }
.board .rk.c-us { color: var(--us-deep); }
.board .rk.c-3 { color: var(--muted); }
.board .tm .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.board tr.us td:first-child { border-radius: 6px 0 0 6px; }
.board .g { width: 1%; background: var(--gantry); color: var(--ink); font-style: italic; font-weight: 700; font-size: 15px; padding-left: 18px; }
.board tr.us td.g { background: var(--gantry); }
.board th.g { font-style: normal; font-weight: 600; font-size: 11px; color: var(--ink); border-radius: 4px 4px 0 0; padding-top: 12px;
  background: repeating-conic-gradient(#fff 0 25%, var(--navy) 0 50%) 0 0 / 8px 8px repeat-x var(--gantry); }
.board tbody tr:last-child td.g { border-radius: 0 0 4px 4px; }
.board .ln { width: 46%; padding-left: 4px; padding-right: 20px; }
.lt { position: relative; height: 16px; }
.lt::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); }
.lt i { position: absolute; top: 50%; display: block; }
.lt .w { height: 10px; margin-top: -5px; border-radius: 3px; opacity: .16; }
.lt .run { left: 0; height: 3px; margin-top: -1.5px; border-radius: 2px; transform-origin: 0 50%; }
.us .lt .run { height: 5px; margin-top: -2.5px; }
.lt .proj { height: 0; border-top: 2px dashed; margin-top: -1px; }
.lt .dot { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; box-shadow: 0 0 0 2px #fff; }
.us .lt .dot { width: 14px; height: 14px; margin: -7px 0 0 -7px; }
.lt .end { width: 2px; height: 16px; margin: -8px 0 0 -1px; }
.wchip { display: inline-flex; margin-top: 10px; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 500; color: var(--ink); }

/* plays beside their proof chart */
.sq-ctl { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
.sq-ctl select { font: inherit; font-weight: 600; color: var(--us-deep); background: #fff; border: 1px solid rgba(12, 92, 96, .3); border-radius: 6px; padding: 4px 8px; margin: 0 4px; }
.sq-out { background: var(--us-tint); border: 1px solid rgba(12, 92, 96, .1); border-radius: 8px; padding: 14px; }
.sq-big { font-size: 16px; color: var(--ink); margin-bottom: 6px; }
.sq-big b { font-style: italic; font-weight: 700; font-size: 30px; color: var(--us-deep); margin: 0 4px; }
.pace { display: grid; gap: 6px; margin: 0 0 12px; padding: 12px 14px; background: var(--us-tint); border: 1px solid rgba(12, 92, 96, .1); border-radius: 8px; }
.pace label { font-size: 15px; color: var(--ink-2); }
.pace label b { font-style: italic; font-weight: 700; font-size: 22px; color: var(--us-deep); }
.pace input[type=range] { width: 100%; accent-color: var(--us-mark); height: 28px; }
.pace-out { margin: 0; font-size: 15px; color: var(--ink); }
.pace-out b { color: var(--us-deep); font-weight: 700; }
.pace-out span { display: block; font-size: 13px; color: var(--muted); }
.wpair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "plays chart"; }
.wpair > .w-chart { grid-area: chart; border-left: 1px solid var(--rule-2); }
.wpair > .w-plays { grid-area: plays; }
.play + .play { border-top: 1px solid var(--rule-2); margin-top: 16px; padding-top: 16px; }
.play h3 { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.35; }
.play h3 strong { font-style: italic; font-weight: 700; font-size: 30px; line-height: 1.1; margin-left: 6px; white-space: nowrap; }
.play h3 strong { color: var(--us-deep); }
.play h3 strong.hot { color: var(--hot-ink); }
.play h3 strong.off { color: var(--off-ink); }
.play p { margin: 6px 0 10px; color: var(--ink-2); font-size: 14px; }
.play p b, .cp b, .w-r2 p b { font-weight: 600; color: var(--ink); }
.wnote { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule-2); color: var(--muted); font-size: 13px; }
.wnote p { margin: 0 0 8px; }
.w-plays details summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
.w-plays details summary::-webkit-details-marker { display: none; }
.w-plays details summary svg { width: 18px; height: 18px; color: var(--muted); transition: transform var(--step) steps(2, end); }
.w-plays details[open] summary svg { transform: rotate(180deg); }
.w-plays details[open] summary { margin-bottom: 14px; }

/* checkpoints: timing splits */
.cps { list-style: none; margin: 0; padding: 0; }
.cp, .cps-h { display: grid; grid-template-columns: 150px 96px 96px 110px minmax(0, 1fr); gap: 4px 16px; align-items: baseline; padding: 12px 10px; }
.cps-h { padding-top: 0; padding-bottom: 6px; font-size: 11px; color: var(--muted); }
.cps-h span:nth-child(2), .cps-h span:nth-child(3), .cp .v { text-align: right; }
.cp + .cp { border-top: 1px solid var(--rule-2); }
.cp.next { background: var(--tint); border-radius: 6px; }
.cp.next + .cp, .cp + .cp.next { border-top-color: transparent; }
.cp .d { font-weight: 600; white-space: nowrap; }
.cp .d small { font-weight: 400; color: var(--ink-2); font-size: 13px; margin-right: 4px; }
.cp .v { font-style: italic; font-weight: 700; font-size: 17px; color: var(--us-deep); }
.cp .v.keep { font-style: normal; font-weight: 400; font-size: 14px; color: var(--muted); }
.cp .t { color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.cp .t span { display: block; }
.cp .t .dec { color: var(--ink); font-weight: 500; }
.st { display: inline-flex; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.st.on { background: var(--navy); color: #fff; }
.st.behind { background: var(--warn-bg); color: var(--warn); }
.st.late { border-color: var(--muted); color: var(--muted); }
.st.wait { padding: 1px 0; color: var(--muted); font-weight: 400; font-size: 13px; }
.cp.cut { border-top: 1px solid var(--warn) !important; border-bottom: 1px solid var(--warn); margin-bottom: -1px; position: relative; z-index: 1; }
.cp.cut + .cp { border-top-color: transparent; }
.cp.cut .d { font-weight: 700; color: var(--warn); }
.cp.cut .d small { color: var(--warn); }
.cp.cut .t { grid-column: 2 / -1; }
.cp.cut .t .lead { color: var(--ink); font-size: 15px; }
.cp.cut.flash { animation: flash 1200ms steps(2, end); }
@keyframes flash { 0%, 66% { background: var(--warn-bg); } 100% { background: transparent; } }
.cp.cut:focus { outline: none; }

.w-r2 h3 { font-size: 17px; margin-bottom: 4px; }
.w-r2 p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* daily duel */
table.duel { width: 100%; border-collapse: collapse; font-size: 14px; }
.duel th { font-size: 11px; font-weight: 400; color: var(--muted); text-align: right; padding: 0 10px 6px; }

.duel td:first-child { white-space: normal; }

.duel td.res.lost span { background: var(--warn-bg); }
.duel details summary { cursor: pointer; font-size: 13px; font-weight: 500; margin-top: 8px; color: var(--ink-2); }

.w-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding: 14px 20px 16px; border-top: 1px solid var(--rule-2); }
.w-foot p { margin: 0; color: var(--muted); font-size: 12px; max-width: 72ch; }

/* ---------- svg helpers ---------- */

}

// bar with 4px rounded data end, square at the baseline
function vbar(parent, x, y, w, h, attrs) {
  const r = Math.min(4, w / 2, h);
  const d = h <= 0 ? "" : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;

}
function hbar(parent, x, y, w, h, attrs) {

  return el("path", { d, ...attrs }, parent);
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p * 2) / 2 * p; }
function ticks(max, n = 4) { const st = niceMax(max / n); const out = []; for (let v = 0; v <= max + 1e-9; v += st) out.push(v); return out; }
const W = host => Math.max(280, Math.min(host.clientWidth || 600, 1080));

/* ---------- motion: marks run out from their start (expo ease-out), never on resize ---------- */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.16, 1, .3, 1)";
let ANIM = !RM;
function run(node, frames, delay = 0, dur = 650) {
  if (ANIM && node.animate) node.animate(frames, { duration: dur, delay, easing: EASE, fill: "backwards" });
  return node;
}
function drawIn(node, delay, dur = 900) { node.setAttribute("pathLength", 1); return run(node, [{ strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 0 }], delay, dur); }
function rise(node, delay, dur = 550) { node.style.transformBox = "fill-box"; node.style.transformOrigin = "50% 100%"; return run(node, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], delay, dur); }
function fade(node, delay, dur = 350) { return run(node, [{ opacity: 0 }, { opacity: 1 }], delay, dur); }
// bib numerals: navy on the light member hues, white on the dark ones
function bibInk(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] > .25 ? INK : "#fff";
}

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.hidden = false;
  const x = ev.clientX, y = ev.clientY, r = tip.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x + 14)) + "px";
  tip.style.top = (y - r.height - 14 < 8 ? y + 18 : y - r.height - 14) + "px";
}
function hideTip() { tip.hidden = true; }
function hover(node, html) {
  node.style.cursor = "default";
  node.addEventListener("pointerenter", e => showTip(e, html()));
  node.addEventListener("pointermove", e => showTip(e, html()));
  node.addEventListener("pointerleave", hideTip);
}

function drawRace() {
  const t = P.team, now = mean(M.map(m => m.latest));
  const left = P.left.weekday + P.left.off;
  $("#race-title").innerHTML = `ถ้าเดินแบบที่ผ่านมา ทีมนี้จะจบที่<strong><span id="fin">~${k0(t.mid)}</span><small>ก้าว/คน · ช่วง ${k0(t.low)}–${k0(t.high)}</small></strong>`;
  if (ANIM) {   // the headline ticks up like a broadcast counter; the final text is already in place
    const fin = $("#fin"), t0 = performance.now(), dur = 1100;
    const tick = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(2, -10 * p);
      fin.textContent = "~" + k0(p < 1 ? t.mid * e : t.mid); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    setTimeout(() => { fin.textContent = "~" + k0(t.mid); }, dur + 200);   // lands even if frames are throttled
  }
  $("#race-note").textContent = `เหลือ ${left} วัน (วันทำงาน ${P.left.weekday} วันหยุด ${P.left.off}) เส้นประคือถ้าแต่ละคนเดินเท่าค่าเฉลี่ยของตัวเอง แยกวันทำงานกับวันหยุด แถบจางคือช่วงวันที่แย่ที่สุดถึงดีที่สุดที่ผ่านมา`;

  const host = $("#race"), w = W(host), narrow = w < 560;
  // timing-screen columns on the right; the last one is the finish gantry
  // the gantry is rounded like the headline (a projection, not a reading)
  const cols = narrow ? [["จบ 13 พ.ย.", l => "~" + k0(l.p.mid)]]
    : [["ตอนนี้", l => k(l.latest)], ["ก้าวเฉลี่ยวันทำงาน", l => k(l.p.weekday)], ["ก้าวเฉลี่ยวันหยุด", l => k(l.p.off)], ["จบ 13 พ.ย.", l => "~" + k0(l.p.mid)]];
  const cw = narrow ? 64 : 92, colsW = cols.length * cw;
  const lab = narrow ? 100 : 150, x0 = lab, x1 = w - colsW - (narrow ? 12 : 28);
  const teamRates = { weekday: mean(M.map(m => P.members[m.alias].weekday)), off: mean(M.map(m => P.members[m.alias].off)) };
  const lanes = [{ alias: "ทั้งทีม", team: true, latest: now, p: { ...t, ...teamRates } }, ...M.map(m => ({ alias: m.alias, m, latest: m.latest, p: P.members[m.alias] }))];
  const lh = narrow ? 34 : 38, top = 34, h = top + lanes.length * lh + 8;
  const max = niceMax(Math.max(...lanes.map(l => l.p.high)));
  const X = v => x0 + (x1 - x0) * v / max;
  const s = svgIn(host, w, h, `ตำแหน่งตอนนี้และที่คาดว่าจะจบของแต่ละคน`);
  for (const v of ticks(max, narrow ? 3 : 4)) {
    el("line", { x1: X(v), x2: X(v), y1: top - 6, y2: h - 6, stroke: RULE2 }, s);
    txt(s, X(v), 20, v ? k0(v) : "0", { "text-anchor": "middle", "font-size": 11, fill: MUTED });
  }
  const cx = j => w - colsW + j * cw + cw - 6;
  // finish gantry: navy column with a chequered strip along its top
  const defs = el("defs", {}, s), chk = el("pattern", { id: "chk", width: 8, height: 8, patternUnits: "userSpaceOnUse", x: w - cw }, defs);
  el("rect", { width: 8, height: 8, fill: C("--navy") }, chk); el("rect", { width: 4, height: 4, fill: "#fff" }, chk); el("rect", { x: 4, y: 4, width: 4, height: 4, fill: "#fff" }, chk);
  const clip = el("clipPath", { id: "gclip" }, defs); el("rect", { x: w - cw, y: 0, width: cw, height: h, rx: 4 }, clip);
  el("rect", { x: w - cw, y: 0, width: cw, height: h, rx: 4, fill: C("--gantry") }, s);
  el("rect", { x: w - cw, y: 0, width: cw, height: 8, fill: "url(#chk)", "clip-path": "url(#gclip)" }, s);
  cols.forEach(([name], j) => txt(s, cx(j), 22, name, { "text-anchor": "end", "font-size": 11, "font-weight": j === cols.length - 1 ? 600 : 400, fill: j === cols.length - 1 ? INK : MUTED }));
  lanes.forEach((l, i) => {
    const y = top + i * lh + lh / 2, col = l.team ? OFF : hue[l.alias];
    const g = el("g", { class: "lane" }, s);
    if (l.team) el("rect", { x: 0, y: y - lh / 2 + 2, width: w - cw - 2, height: lh - 4, rx: 6, fill: C("--tint") }, g);
    if (!l.team) {
      el("circle", { cx: 12, cy: y, r: 10, fill: col }, g);
      txt(g, 12, y + 4, String(l.m.pos), { "text-anchor": "middle", "font-size": 11, "font-weight": 600, "font-style": "italic", fill: bibInk(col) });
    }
    txt(g, l.team ? 6 : 28, y + 5, l.alias, { "font-size": narrow ? 12 : 14, "font-weight": l.team ? 600 : 500, fill: INK });
    el("line", { x1: x0, x2: x1, y1: y, y2: y, stroke: RULE, "stroke-width": 1 }, g);
    // the run so far draws out from the start, the runner's dot travels with it, then the projection lands
    const d0 = i * 70, d1 = 650 + i * 70;
    fade(el("rect", { x: X(l.p.low), y: y - 5, width: Math.max(2, X(l.p.high) - X(l.p.low)), height: 10, rx: 3, fill: col, opacity: .16 }, g), d1, 450);

    fade(el("line", { x1: X(l.p.mid), x2: X(l.p.mid), y1: y - 8, y2: y + 8, stroke: col, "stroke-width": 2 }, g), d1, 450);
    cols.forEach(([, f], j) => {
      const last = j === cols.length - 1;
      const tx = txt(g, cx(j), y + 5, f(l), { "text-anchor": "end", "font-size": last ? 15 : 13, "font-weight": last || l.team ? 700 : 500, "font-style": last ? "italic" : "normal", fill: INK });
      if (last) run(tx, [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], d1 + 150, 450);
    });
    const hit = el("rect", { x: 0, y: y - lh / 2, width: w, height: lh, fill: "transparent" }, g);
    hit.addEventListener("pointerenter", () => { s.classList.add("focusing"); g.classList.add("on"); });
    hit.addEventListener("pointerleave", () => { s.classList.remove("focusing"); g.classList.remove("on"); });
    hover(hit, () => `<b>${esc(l.alias)}</b><div class="r"><span>ตอนนี้</span><b>${full(l.latest)}</b></div>` +
      `<div class="r"><span>คาดจบ 13 พ.ย.</span><b>${full(l.p.mid)}</b></div><div class="r"><span>ช่วง</span><b>${k(l.p.low)}–${k(l.p.high)}</b></div>` +
      `<div class="r"><span>ก้าวเฉลี่ยวันทำงาน</span><b>${k(l.p.weekday)}</b></div><div class="r"><span>ก้าวเฉลี่ยวันหยุด</span><b>${k(l.p.off)}</b></div>` +
      (l.m && l.m.unsynced ? `<div>วันนี้ยังไม่ sync คาดการณ์นับวันนี้เต็มวัน</div>` : ""));
  });
}

function drawInsights() {

    row.querySelector(".proof").addEventListener("click", () => go({ tab: "explore", ...c.proof, focus: c.focus || null }));

const movedAt = (m, date) => m.moved.find(x => x.d === date);
const MW = host => Math.max(260, Math.min(520, host.clientWidth || 300));
const MINI = {
  pair(host, m) {
    const w = MW(host), h = 70, max = Math.max(...m.items.map(x => x[1]));
    const s = svgIn(host, w, h, m.items.map(x => `${x[0]} ${k(x[1])}`).join(", "));
    m.items.forEach(([lab, v, t], i) => {
      const y = 6 + i * 32;
      txt(s, 0, y + 15, lab, { "font-size": 12, fill: INK2 });
      hover(hbar(s, 66, y, (w - 66 - 50) * v / max, 22, { fill: t === "weekday" ? HOT : OFF, class: "mk" }), () => `<b>${lab}</b><div class="r"><span>เฉลี่ยต่อคนต่อวัน</span><b>${full(v)}</b></div>`);
      txt(s, 66 + (w - 66 - 50) * v / max + 6, y + 16, k(v), { "font-size": 13, "font-weight": 600, "font-style": "italic", fill: INK });
    });
  },
  days(host, m) {
    const w = MW(host), h = 96, max = Math.max(...m.items.map(x => x[1])), n = m.items.length, bw = Math.min(56, (w - 8) / n - 6);
    const s = svgIn(host, w, h, "ก้าวเฉลี่ยต่อคนรายวัน"); hatch(s, "mh", OFF);
    m.items.forEach(([lab, v, t, st], i) => {
      const x = 4 + i * (bw + 6), bh = (h - 32) * v / max, y = h - 16 - bh;
      hover(vbar(s, x, y, bw, bh, { fill: st === "est" ? "url(#mh)" : t === "weekday" ? HOT : OFF, stroke: st === "est" ? OFF : null, class: "mk" }), () => `<b>${lab}</b> · ${t === "weekday" ? "วันทำงาน" : "วันหยุด"}<div class="r"><span>เฉลี่ยต่อคน</span><b>${full(v)}</b></div>${st === "est" ? `<div>ประมาณ</div>` : ""}`);
      txt(s, x + bw / 2, h - 3, lab.split(" ")[0], { "text-anchor": "middle", "font-size": 11, fill: MUTED });
      if (i === 0 || i === n - 1 || v === max) txt(s, x + bw / 2, y - 4, k(v), { "text-anchor": "middle", "font-size": 11, "font-weight": 600, fill: INK });
    });
  },
  hours(host, m) {
    const w = MW(host), h = 96, max = Math.max(...m.items), bw = (w - 4) / 24 - 2;
    const s = svgIn(host, w, h, `ก้าวรายชั่วโมง ช่วง ${m.hi[0]}–${m.hi[1]} น. สูงสุด`);
    m.items.forEach((v, i) => {
      const x = 2 + i * (bw + 2), bh = (h - 30) * v / max;
      hover(vbar(s, x, h - 16 - bh, bw, bh, { fill: i >= m.hi[0] && i < m.hi[1] ? OFF : "#c3cbd8", class: "mk" }), () => `<b>${String(i).padStart(2, "0")}:00–${String(i + 1).padStart(2, "0")}:00</b><div class="r"><span>เฉลี่ยต่อคนต่อวัน</span><b>${full(v)}</b></div>`);
    });
    [0, 6, 12, 18, 24].forEach(hr => txt(s, Math.min(w - 8, 2 + hr * (bw + 2)), h - 3, hr === 24 ? "24" : String(hr).padStart(2, "0"), { "text-anchor": hr ? "middle" : "start", "font-size": 11, fill: MUTED }));
  },
  share(host, m) {
    const w = MW(host), h = 72, tot = m.items.reduce((s, x) => s + x[1], 0);
    const s = svgIn(host, w, h, "สัดส่วนยอดของแต่ละคน");

    txt(s, w, 64, `อีก ${m.items.length - 2} คน`, { "text-anchor": "end", "font-size": 12, fill: MUTED });
  },
  slope(host, m) {

    for (const [a, o, wk] of order) {

    }
  },
};

function drawWin() {
  const host = $("#win");
  if (!S) { host.innerHTML = winSlab({ lead: "<b>Race Plan</b>", lines: [["", "ยังไม่มีแคปภาพ Team Ranking ใส่ภาพแรกแล้วส่วนนี้จะคำนวณเป้าให้"]], only: true }); return; }
  const lastH = S.history[S.history.length - 1];
  if (!S.ready) { host.innerHTML = winSlab({ lead: "<b>Race Plan</b>", lines: [["", "อ่านแคปภาพ Team Ranking ไม่ครบ หาแถวทีมเราหรือทีมผู้นำไม่เจอ"]], asof: lastH && `${lastH.label} ${lastH.time}`, only: true }); return; }

  const pbv = S.pace_basis_value, B = S.behind, bp = B ? (B.pace_recent ?? B.pace) : null;
  const ahead = S.gap <= 0, late = !ahead && S.late, over = S.days_left <= 0, cut = ahead ? null : S.cutoff;
  const asof = `${S.as_of.label} ${S.as_of.time}`;
  const today = lastH.date;

  /* block 1: win head */
  const name = "<b>Race Plan</b> · ";
  const rng = ["rng", `ช่วง ${k(S.need.low)}–${k(S.need.high)} ตามว่าทีมผู้นำจะจบที่ ${k0(S.leader.end.low)}–${k0(S.leader.end.high)}`];
  const slab = ahead
    ? winSlab({ lead: `${name}ทีมเรานำทีมผู้นำ ${k(S.lead)} ก้าว/คน`, fig: S.need.high > 0 ? k(S.need.high) : null, unit: "ก้าวต่อคนต่อวัน",
        lines: [["", S.need.high > 0 ? "เดินวันละเท่านี้ ต่อให้ทีมผู้นำเดินแบบ best case ก็ตามไม่ทัน" : "รักษา pace นี้ไว้ก็พอ"], rng], asof })
    : late
    ? winSlab({ lead: `${name}ไล่อันดับ 1 ยากแล้ว`, fig: k(S.need.mid), unit: "ก้าวต่อคนต่อวัน",
        lines: [["", `เกินวันที่ดีที่สุดที่ทีมผู้นำเคยทำ (<b>${k(S.ceiling)}</b>) ยังลุ้นได้ถ้าเขาแผ่วจนจบแถว ${k0(S.leader.end.low)}`], rng], asof })
    : winSlab({ lead: `${name}เหลือ ${S.days_left.toFixed(1)} วัน ตามหลังทีมผู้นำ ${k(S.gap)} ก้าว/คน`, fig: k(S.need.mid), unit: "ก้าวต่อคนต่อวัน",
        lines: [["", `ตอนนี้เดินวันละ <b>${k(pbv)}</b> ต้องเพิ่มอีก <b>${kd(S.need.mid, pbv)}</b>`], rng], asof });

  /* block 2: standings */
  const rows = [
    { cls: "", rk: S.leader.rank, tm: "ทีมผู้นำ", now: S.leader.avg, pace: S.leader.pace, end: S.leader.end.mid, w: [S.leader.end.low, S.leader.end.high], col: OFF, rc: "c-lead" },
    { cls: "us", rk: S.us.rank, tm: "ทีมเรา", now: S.us.avg, pace: pbv, end: S.us_end_keep, col: US, rc: "c-us" },
    ...(B ? [{ cls: "", rk: B.rank, tm: `ทีมอันดับ ${B.rank}`, now: B.avg, pace: bp, end: B.end_keep, col: "#c3cbd8", rc: "c-3" }] : []),
  ];
  const lmax = niceMax(Math.max(...rows.map(r => r.w ? r.w[1] : r.end)));
  const pc = v => (100 * v / lmax).toFixed(2) + "%";
  const lane = r => `<td class="ln" aria-hidden="true"><div class="lt">` +
    (r.w ? `<i class="w" style="left:${pc(r.w[0])};width:${pc(r.w[1] - r.w[0])};background:${r.col}"></i>` : "") +
    `<i class="run" style="width:${pc(r.now)};background:${r.col}"></i><i class="proj" style="left:${pc(r.now)};width:${pc(Math.max(0, r.end - r.now))};border-color:${r.col}"></i>` +
    `<i class="end" style="left:${pc(r.end)};background:${r.col}"></i><i class="dot" style="left:${pc(r.now)};background:${r.col}"></i></div></td>`;
  const stand = `<div class="wb w-stand"><h3${over ? ' id="win-title"' : ""}>${over ? "ผลจบ" : "อันดับตอนนี้"}</h3><table class="board"><thead><tr><th class="rk">อันดับ</th><th class="tm">ทีม</th><th class="ln" aria-hidden="true"></th><th>ตอนนี้</th><th>ก้าวเฉลี่ย<br>ต่อวัน</th><th class="g">คาดจบ</th></tr></thead><tbody>` +
    rows.map(r => `<tr class="${r.cls}"><td class="rk ${r.rc}">${r.rk}</td><td class="tm"><i class="sw" style="background:${r.col}" aria-hidden="true"></i>${r.tm}</td>${lane(r)}<td>${k(r.now)}</td><td>${k(r.pace)}</td><td class="g">${fin(r.end)}</td></tr>`).join("") +
    `</tbody></table>` +
    (B && B.changed ? `<span class="wchip">ทีมอันดับ ${B.rank} เป็นทีมใหม่ ไม่ใช่ทีมเดิมจากแคปภาพก่อน</span>` : "") + `</div>`;

  if (over) { host.innerHTML = stand; animLanes(host); return; }

  /* block 3: gap chart (drawn after insertion) */
  const R0 = S.race, p0 = (R0.paces.find(p => p.pace >= S.need.mid) || R0.paces[R0.paces.length - 1]).pace;
  const chart = `<div class="wb w-chart"><h3>ทีมเราเทียบทีมผู้นำ<small>ก้าวเฉลี่ยสะสมต่อคน</small></h3>` +
    `<div class="pace"><label for="pace">ถ้าทีมเราเดินวันละ <b id="pace-v"></b> ก้าวต่อคน</label>` +
    `<input type="range" id="pace" min="${R0.paces[0].pace}" max="${R0.paces[R0.paces.length - 1].pace}" step="500" value="${p0}">` +
    `<p class="pace-out" id="pace-out" role="status" aria-live="polite"></p></div>` +
    `<div class="legend"><span><i class="line" style="background:${OFF}"></i>ทีมผู้นำ</span><span><i class="line" style="background:${US}"></i>ทีมเรา</span><span><i class="dash" style="color:${INK2}"></i>คาดการณ์</span><span><i style="background:${OFF};opacity:.18"></i>ช่วงที่ทีมผู้นำอาจจบ</span></div>` +
    `<div id="gapc"></div></div>`;

  /* block 4: plays */
  const wkIns = D.insights.find(c => c.id === "weekday"), hrIns = D.insights.find(c => c.id === "hours");
  const pl = S.plan || {};
  const play = (id, head, val, hot, line, btn) => `<article class="play"><h3>${head}<strong class="${hot === true ? "hot" : hot || ""}">${val}</strong></h3><p>${line}</p>${btn}</article>`;
  const proofBtn = (act, label = "ดูหลักฐาน", icon = ARROW) => `<button class="proof" type="button" data-act="${act}">${label} ${icon}</button>`;
  const plays = [
    !ahead && cut ? play("p1", "เริ่มเร่งตั้งแต่วันนี้", "+" + kd(S.need.mid, S.pace_basis_value), false,
      `ช้าไปวันไหน เป้าวันที่เหลือก็สูงขึ้น หลัง ${cut.dow} ${cut.label} จะเกินวันที่ดีที่สุดของทีมผู้นำ (${k(S.ceiling)})`, proofBtn("cut", "ดูจุดตัด", DOWN)) : "",
    pl.target_weekday != null ? play("p2", "ทำระยะในวันทำงาน", k(pl.target_weekday), true,
      `เหลือ ${P.left.weekday} วัน วันทำงานทีมผู้นำแผ่ว ${wkIns ? esc(wkIns.value) : "–"} ช่วงหลังเหลือ ${k(pl.leader_weekday_recent)}`, proofBtn("daily")) : "",
    pl.target_off != null ? play("p3", "วันหยุดอย่าให้เขาหนีเพิ่ม", k(pl.target_off), "off",
      `เหลือ ${P.left.off} วัน ได้น้อยกว่านี้ ส่วนที่ขาดต้องไปเติมในวันทำงาน`, proofBtn("daily")) : "",
  ].join("");
  const note = hrIns && hrIns.mini.hi ? `<div class="wnote"><p>ทีมผู้นำเดินหนักช่วง ${hrIns.mini.hi[0]}–${hrIns.mini.hi[1]} น. ตัดสินผลของวันหลังช่วงนี้</p>${proofBtn("hours")}</div>` : "";
  const playsBlock = `<div class="wb w-plays">${late ? `<details><summary>ถ้ายังอยากไล่อันดับ 1${CHEV}</summary>${plays}${note}</details>` : plays + note}</div>`;

  /* blocks 5 + 6: checkpoints with the cut-off in date order */
  const nextCp = S.checkpoints.find(c => c.d >= today);
  const items = S.checkpoints.map((c, i) => ({ ...c, kind: i === S.checkpoints.length - 1 ? "last" : i === 0 ? "first" : "mid" }));
  if (cut && !ahead) items.push({ ...cut, kind: "cut" });
  items.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.kind === "cut" ? 1 : -1);
  const TEST = { first: () => "จบวันหยุด เช็คว่าไม่เสียระยะเกินแผน", mid: () => "จบวันหยุดสุดท้าย ที่เหลือคือวันทำงาน", last: c => `เส้นชัย (ทีมผู้นำ ~${k0(c.lead_mid)})` };
  const DEC = { on: "คงแรงเท่านี้ถึงจุดเช็คถัดไป", behind: `เป้าต่อวันขึ้นเป็น ${k(S.need.mid)} เร่งวันทำงานก่อนจุดตัด`, late: `เปลี่ยนเป้าเป็นรักษาอันดับ ${S.us.rank}` };
  const PILL = { on: "ตามแผน", behind: "ช้ากว่าแผน", late: "เลยจุดตัด" };
  const cpRow = c => c.kind === "cut"
    ? `<li class="cp cut" id="win-cut" tabindex="-1"><span class="d">จุดตัด <small>${c.dow}</small>${c.label}</span><span class="t">` +
      `<span class="lead">เดินวันละ ${k(pbv)} ถึงวันนี้ หลังจากนั้นต้อง <b>${k(c.need_after)}</b> ทุกวัน เกือบเท่าวันที่ดีที่สุดของทีมผู้นำ (${k(S.ceiling)})</span>` +
      `<span>เลยวันนี้ไป เป้าหลักคือรักษาอันดับ ${S.us.rank}</span></span></li>`
    : `<li class="cp${nextCp && c.d === nextCp.d ? " next" : ""}"><span class="d"><small>${c.dow}</small>${c.label}</span><span class="v">${k(c.us_plan)}</span><span class="v keep">${k(c.us_keep)}</span>` +
      `<span>${c.status ? `<span class="st ${c.status}">${PILL[c.status]}</span>` : `<span class="st wait">รอแคปภาพ</span>`}</span>` +
      `<span class="t"><span>${TEST[c.kind](c)}</span>${c.status ? `<span class="dec">${DEC[c.status]}</span>` : ""}</span></li>`;
  const cps = `<div class="wb w-cps"><h3>จุดเช็ค</h3><p class="sub" style="margin:-6px 0 12px">เทียบกับหน้า Team Ranking ได้เลย</p>` +
    `<div class="cps-h" aria-hidden="true"><span></span><span>${ahead ? "ควรมีอย่างน้อย" : "ควรมี"}</span><span>ถ้าเท่าเดิม</span><span>สถานะ</span><span></span></div>` +
    `<ol class="cps">${items.map(cpRow).join("")}</ol></div>`;

  /* block 7: keep our rank */
  const r2 = B ? `<div class="wb w-r2"><h3>รักษาอันดับ ${S.us.rank}</h3><p>${!B.closing
      ? `ทีมอันดับ ${B.rank} ตามเรา ${k(B.gap)} เดินวันละ ${k(bp)} ช้ากว่าเรา`
      : B.catch ? `ทีมอันดับ ${B.rank} เดินวันละ ${k(bp)} เร็วกว่าเรา ถ้าเป็นแบบนี้ต่อจะแซงเราราว <b>${B.catch.dow} ${B.catch.label}</b>`
      : `ทีมอันดับ ${B.rank} เดินเร็วกว่าเรา แต่ถ้าเป็นแบบนี้ต่อจะยังไม่ทันก่อนจบ`}</p></div>` : "";

  /* block 8: duel, or how to get it */
  const duelRow = x => `<tr><td>${esc(x.from_label)} ถึง ${esc(x.to_label)}</td><td>+${k(x.us_gain)}</td><td>+${k(x.leader_gain)}</td><td class="res${x.diff > 0 ? "" : " lost"}"><span>${x.diff > 0 ? `ไล่ได้ ${k(x.diff)}` : `เสีย ${k(x.diff_abs)}`}</span></td></tr>`;
  const dHead = `<thead><tr><th>ช่วง</th><th>เรา</th><th>ผู้นำ</th><th>ผล</th></tr></thead>`;
  const dl = [...S.duel].reverse();
  const duel = dl.length
    ? `<div class="wb w-duel"><h3>ดวลรายช่วง<small>ก้าว/คน</small></h3><table class="duel">${dHead}<tbody>${dl.slice(0, 5).map(duelRow).join("")}</tbody></table>` +
      (dl.length > 5 ? `<details><summary>ดูทั้งหมด (${dl.length} ช่วง)</summary><table class="duel">${dHead}<tbody>${dl.slice(5).map(duelRow).join("")}</tbody></table></details>` : "") + `</div>`
    : `<div class="wb w-duel"><p class="sub" style="margin:0">แคป Team Ranking ทุกเช้าเวลาเดิม ตรงนี้จะบอกว่าแต่ละวันเราไล่ได้หรือเสียระยะ</p></div>`;

  /* block 9: footer + share */
  const share = `เป้าทีมเรา เดินคนละ ${k(S.need.mid)} ก้าวทุกวัน` + (nextCp ? ` เช็คอีกที ${nextCp.dow} ${nextCp.label} ต้องมีเฉลี่ย ${k(nextCp.us_plan)}` : "");
  const foot = `<div class="w-foot"><p>ค่าประมาณ จาก Team Ranking ${S.history.length} ภาพ · ` +
    (S.pace_basis === "recent" ? `แรงเดินทีมเราช่วง ${esc(S.us.pace_recent_from)} ถึง ${S.as_of.label}` : "แรงเดินทีมเราเฉลี่ยตั้งแต่วันแรก") +
    `</p><span><button class="proof" type="button" data-act="share">คัดลอกข้อความส่งทีม ${ARROW}</button> <span class="copied" role="status" aria-live="polite"></span></span></div>`;

  // order by state: rank 3 closing in puts block 7 under the head; cut-off passed puts it under the standings
  /* block 3b: squad split (user scenario: k strong walkers at s a day, how much the rest need to pass by day d) */
  const SP = S.split, dDef = SP && (SP.days.find(d => d.d === "2026-11-10") || SP.days[Math.max(0, SP.days.length - 4)]);
  const squad = SP && SP.days.length ? `<div class="wb w-squad"><h3>แบ่งแรงในทีม<small>${SP.members} คน</small></h3>` +
    `<div class="sq-ctl"><label>ตัวแรง <select id="sq-k">${Array.from({ length: SP.members - 1 }, (_, i) => `<option value="${i + 1}"${i + 1 === 2 ? " selected" : ""}>${i + 1} คน</option>`).join("")}</select></label>` +
    `<label>เดินคนละ <select id="sq-s">${SP.strong.map(v => `<option value="${v}"${v === 30000 ? " selected" : ""}>${k(v)}</option>`).join("")}</select> ต่อวัน</label>` +
    `<label>แซงภายใน <select id="sq-d">${SP.days.map(d => `<option value="${d.d}"${d.d === dDef.d ? " selected" : ""}>${d.dow} ${d.label}</option>`).join("")}</select></label></div>` +
    `<div class="sq-out" role="status" aria-live="polite"><div class="sq-big" id="sq-big"></div><div id="sq-bars"></div><p class="sub" id="sq-sub"></p></div></div>` : "";
  const pair = chart + squad + playsBlock;   // the race chart needs the full width   // collapsed plays would leave half the row empty
  const order = B && B.closing ? [r2, stand, pair, cps, duel] : late ? [stand, r2, pair, cps, duel] : [stand, pair, cps, r2, duel];
  host.innerHTML = slab + order.join("") + foot;

  animLanes(host);
  if ($("#sq-k", host)) {
    const sq = () => {
      const kk = +$("#sq-k", host).value, sv = +$("#sq-s", host).value, di = SP.days.findIndex(d => d.d === $("#sq-d", host).value);
      const [rest, restLo, restHi] = SP.rest[kk - 1][SP.strong.indexOf(sv)][di], d = SP.days[di], others = SP.members - kk;
      $("#sq-big", host).innerHTML = rest <= 0 ? `อีก ${others} คน <b>ไม่ต้องเดินเพิ่ม</b> ก็แซงทัน`
        : `อีก ${others} คน ต้องเดินคนละ <b>${k(rest)}</b> ก้าวต่อวัน`;
      $("#sq-sub", host).innerHTML = `ทั้งทีมเฉลี่ย ${k(d.need)} ต่อคนต่อวัน ถึงจะแซงภายใน ${d.dow} ${d.label} · ถ้าทีมผู้นำแผ่ว ที่เหลือเดินคนละ ${k(Math.max(0, restLo))} ถ้าเขาแรง ต้อง ${k(restHi)}`;
      // six runners as bars: strong ones, the rest, and the team average needed
      const host2 = $("#sq-bars", host), w = Math.min(W(host2), 640), hh = 150, n = SP.members, gap = 10, bw = (w - 40 - gap * (n - 1)) / n;
      const vals = Array.from({ length: n }, (_, i) => i < kk ? sv : Math.max(0, rest)), top = niceMax(Math.max(...vals, d.need) * 1.1);
      const Y = v => 18 + (hh - 40) * (1 - v / top);
      const s = svgIn(host2, w, hh, `ตัวแรง ${kk} คน คนละ ${k(sv)} ที่เหลือคนละ ${k(rest)}`);
      // the team average needed, behind the bars
      el("line", { x1: 36, x2: w, y1: Y(d.need), y2: Y(d.need), stroke: C("--us-deep"), "stroke-width": 1.5, "stroke-dasharray": "5 4" }, s);
      txt(s, 34, Y(d.need) + 4, k(d.need), { "text-anchor": "end", "font-size": 11, "font-weight": 600, fill: C("--us-deep") });
      vals.forEach((v, i) => {
        const x = 40 + i * (bw + gap);
        rise(vbar(s, x, Y(v), bw, Y(0) - Y(v), { fill: i < kk ? US : C("--us-soft") }), i * 40, 450);
        txt(s, x + bw / 2, Y(v) + 18, k(v), { "text-anchor": "middle", "font-size": 13, "font-weight": 700, "font-style": "italic", fill: i < kk ? "#fff" : C("--us-deep") });   // inside the bar: never under the target line
        txt(s, x + bw / 2, hh - 6, i < kk ? "ตัวแรง" : "คนอื่น", { "text-anchor": "middle", "font-size": 11, fill: MUTED });
      });
      el("line", { x1: 36, x2: w, y1: Y(0), y2: Y(0), stroke: RULE }, s);
    };
    ["#sq-k", "#sq-s", "#sq-d"].forEach(id => $(id, host).addEventListener("change", () => { ANIM = !RM; sq(); }));
    sq();
  }
  const paceIn = $("#pace", host);
  if (paceIn) {
    const show = first => {
      const pace = +paceIn.value, o = S.race.paces.find(p => p.pace === pace);
      $("#pace-v", host).textContent = k(pace);
      const vs = pace - S.pace_basis_value;
      $("#pace-out", host).innerHTML = (o.cross ? `แซงได้ <b>${o.cross.dow} ${o.cross.label}</b> จบนำ ~${k0(o.end_gap)}` : `ยังไม่ทัน จบตาม ~${k0(-o.end_gap)}`) +
        ` <span>${vs > 0 ? `(มากกว่าตอนนี้ +${kd(pace, S.pace_basis_value)})` : "(เท่ากับตอนนี้หรือน้อยกว่า)"} · ถ้าทีมผู้นำแผ่ว จบ${o.end_gap_low >= 0 ? "นำ" : "ตาม"} ${k0(Math.abs(o.end_gap_low))} ถ้าเขาแรง จบ${o.end_gap_high >= 0 ? "นำ" : "ตาม"} ${k0(Math.abs(o.end_gap_high))}</span>`;
      if (!first) ANIM = false;
      drawRaceChart($("#gapc", host), pace);
    };
    paceIn.addEventListener("input", () => show(false));
    show(true);
  }
  host.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const a = b.dataset.act;
    if (a === "daily" || a === "hours") return go({ tab: "explore", view: a, focus: null });
    if (a === "cut") {
      const row = $("#win-cut", host); if (!row) return;
      row.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "center" });
      row.focus({ preventScroll: true });
      row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
      return;
    }
    if (a === "share") copyShare(share, $(".copied", host));
  }));
}

function animLanes(host) {
  host.querySelectorAll(".lt").forEach((lt, i) => {
    const d0 = i * 90, d1 = 650 + i * 90;
    run(lt.querySelector(".run"), [{ transform: "scaleX(0)" }, { transform: "none" }], d0, 800);
    const dot = lt.querySelector(".dot");
    run(dot, [{ left: "0%" }, { left: dot.style.left }], d0, 800);
    lt.querySelectorAll(".proj, .end, .w").forEach(n => fade(n, d1, 450));
  });
}

async function copyShare(text, out) {
  let ok = false;
  try {   // a clipboard promise can hang on a pending permission: give it 1.2 s, then fall back
    await Promise.race([navigator.clipboard.writeText(text), new Promise((_, no) => setTimeout(no, 1200))]); ok = true;
  } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
  }
  out.textContent = ok ? "คัดลอกแล้ว วางในแชททีมได้เลย" : `คัดลอกไม่ได้ กดค้างที่ข้อความนี้แล้วคัดลอกเอง: ${text}`;
  if (ok) { clearTimeout(copyShare.t); copyShare.t = setTimeout(() => { out.textContent = ""; }, 4000); }
}

function drawRaceChart(host, pace) {
  // both teams on one axis (avg steps per person, cumulative). Every number comes from S.race (tools/build_lead.py):
  // the page only picks the row of S.race.paces for the chosen daily pace.
  const R = S.race, opt = R.paces.find(p => p.pace === pace) || R.paces[0];
  const w = W(host), narrow = w < 560;
  const h = narrow ? 260 : 360, L = 48, Rm = narrow ? 52 : 70, T = 26, Bm = 40;
  const nd = R.total_days, X = t => L + (w - L - Rm) * t / nd, slot = X(1) - X(0);
  const usEnd = t => S.us.avg + pace * (t - S.now_t);
  const top = niceMax(Math.max(R.lead_path[R.lead_path.length - 1].high, usEnd(nd)) * 1.04);
  const Y = v => T + (h - T - Bm) * (1 - v / top);
  const s = svgIn(host, w, h, `ทีมเราเทียบทีมผู้นำ ถ้าเดินวันละ ${k(pace)} ${opt.cross ? `แซงวันที่ ${opt.cross.label}` : "ยังไม่ทันตอนจบ"}`);
  days.forEach((d, i) => {
    if (isOff(d)) el("rect", { x: X(i), y: T, width: slot, height: h - T - Bm, fill: C("--tint") }, s);
    el("rect", { x: X(i) + 1, y: h - Bm + 4, width: Math.max(1, slot - 2), height: 3, rx: 1.5, fill: isOff(d) ? OFF : HOT }, s);
    if (!narrow || i % 2 === 0) txt(s, X(i) + slot / 2, h - Bm + 19, d.label.split(" ")[0], { "text-anchor": "middle", "font-size": 11, fill: d.status === "future" ? "#7a869c" : INK2 });
  });
  txt(s, X(0), h - 4, "ต.ค.", { "font-size": 10, fill: MUTED });
  const nov = days.findIndex(d => d.d.slice(5, 7) === "11"); if (nov > 0) txt(s, X(nov), h - 4, "พ.ย.", { "font-size": 10, fill: MUTED });
  for (const v of ticks(top, narrow ? 3 : 5)) { el("line", { x1: L, x2: X(nd), y1: Y(v), y2: Y(v), stroke: v ? RULE2 : RULE }, s); txt(s, L - 6, Y(v) + 4, v ? k0(v) : "0", { "text-anchor": "end", "font-size": 11, fill: MUTED }); }
  // finish gantry + now
  const defs = el("defs", {}, s), chk = el("pattern", { id: "rchk", width: 8, height: 8, patternUnits: "userSpaceOnUse", x: X(nd) }, defs);
  el("rect", { width: 8, height: 8, fill: C("--navy") }, chk); el("rect", { width: 4, height: 4, fill: "#fff" }, chk); el("rect", { x: 4, y: 4, width: 4, height: 4, fill: "#fff" }, chk);
  el("rect", { x: X(nd), y: T - 8, width: 8, height: h - T - Bm + 8, fill: "url(#rchk)" }, s);
  el("line", { x1: X(S.now_t), x2: X(S.now_t), y1: T, y2: h - Bm, stroke: INK2, "stroke-dasharray": "2 3" }, s);
  txt(s, X(S.now_t) + 4, T - 8, "ตอนนี้", { "font-size": 11, fill: INK2 });
  const line = (pts, key = "avg") => "M" + pts.map(p => `${X(p.t).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("L");
  // leader: band low..high, projection mid (dashed), actual (solid)
  const lp = R.lead_path;
  el("path", { d: line(lp, "low") + "L" + [...lp].reverse().map(p => `${X(p.t).toFixed(1)},${Y(p.high).toFixed(1)}`).join("L") + "Z", fill: OFF, opacity: .1 }, s);
  fade(el("path", { d: line(lp, "mid"), fill: "none", stroke: OFF, "stroke-width": 2, "stroke-dasharray": "6 4" }, s), 500, 450);
  drawIn(el("path", { d: line(R.lead_actual), fill: "none", stroke: OFF, "stroke-width": 3, "stroke-linejoin": "round", "stroke-linecap": "round" }, s), 0, 900);
  // ours: actual (from Team Ranking) + the chosen pace from now
  const ua = R.us_actual;
  drawIn(el("path", { d: line(ua), fill: "none", stroke: US, "stroke-width": 3, "stroke-linejoin": "round", "stroke-linecap": "round" }, s), 0, 900);
  el("path", { d: `M${X(S.now_t)},${Y(S.us.avg)}L${X(nd)},${Y(usEnd(nd))}`, fill: "none", stroke: US, "stroke-width": 2.5, "stroke-dasharray": "6 4" }, s);
  el("circle", { cx: X(S.now_t), cy: Y(S.us.avg), r: 5, fill: US, stroke: "#fff", "stroke-width": 2 }, s);

  if (ends[1].y - ends[0].y < 14) ends[1].y = ends[0].y + 14;

  // the overtake
  if (opt.cross) {

    el("line", { x1: cx, x2: cx, y1: T, y2: h - Bm, stroke: US, "stroke-width": 1.5 }, s);

  }
  // hover: one column per day
  const lpAt = t => { const a = lp.filter(p => p.t <= t).pop(), b = lp.find(p => p.t >= t); if (!a || !b || a === b) return (a || b); const f = (t - a.t) / (b.t - a.t); return { mid: a.mid + (b.mid - a.mid) * f }; };
  days.forEach((d, i) => {
    const te = i + 1;
    hover(el("rect", { x: X(i), y: T, width: slot, height: h - T - Bm, fill: "transparent" }, s), () => {
      const la = R.lead_actual.find(p => p.t === te), fut = te > S.now_t;

      return `<b>${d.dow} ${d.label}</b> · สิ้นวัน` +
        `<div class="r"><span><i style="background:${OFF}"></i>ทีมผู้นำ${fut ? " (คาด)" : ""}</span><b>${k(fut ? lead && lead.mid : la && la.avg)}</b></div>` +
        (fut ? `<div class="r"><span><i style="background:${US}"></i>ทีมเรา (${k(pace)}/วัน)</span><b>${k(usEnd(te))}</b></div>` : "");
    });
  });
}

// projected cumulative, day by day: today's rest, then each remaining day at its type's rate
const todayIdx = days.findIndex(d => d.status === "partial");
const asofAbs = days.findIndex(d => d.d === D.as_of.date) * 1440 + (+D.as_of.time.slice(0, 2)) * 60 + (+D.as_of.time.slice(3));
function memberPath(m) {
  const p = P.members[m.alias], out = {};
  ["mid", "low", "high"].forEach((name, j) => {
    let v = m.latest; const pts = [[asofAbs, v]];
    if (todayIdx >= 0) { v += p.rest[j]; pts.push([(todayIdx + 1) * 1440, v]); }
    days.forEach((d, i) => { if (d.status === "future") { v += p.rates[isOff(d) ? "off" : "weekday"][j]; pts.push([(i + 1) * 1440, v]); } });
    out[name] = pts;
  });
  return out;
}
function teamPath() {
  const all = M.map(memberPath), out = {};
  for (const name of ["mid", "low", "high"]) out[name] = all[0][name].map((p, i) => [p[0], mean(all.map(a => a[name][i][1]))]);
  return out;
}

    max = niceMax(Math.max(...series.map(x => x.p.high)));
  } else {
    const pick = scope === "team" ? [{ alias: "ทั้งทีม", col: OFF, vals: D.team_daily, w: 3 }] : M.map(m => ({ alias: m.alias, col: hue[m.alias], vals: m.daily, w: 2 }));
    for (const x of pick) series.push({ ...x, pts: seen.filter(i => x.vals[i] != null).map(i => [i * 1440 + 720, x.vals[i], i]) });
    max = niceMax(Math.max(...series.flatMap(x => x.pts.map(p => p[1]))) * 1.1);
  }
  const Y = v => T + (h - T - B) * (1 - v / max);
  // off-day bands + day ticks
  days.forEach((d, i) => {
    if (isOff(d)) el("rect", { x: X(i * 1440), y: T, width: X(1440) - X(0), height: h - T - B, fill: C("--tint") }, s);
    const every = w < 560 ? 4 : 2;
    if (i % every === 0) txt(s, X(i * 1440 + 720), h - B + 16, d.label.split(" ")[0], { "text-anchor": "middle", "font-size": 11, fill: d.status === "future" ? "#7a869c" : INK2 });
  });
  txt(s, X(0), h - 4, "ต.ค.", { "font-size": 10, fill: MUTED });
  const nov = days.findIndex(d => d.d.slice(5, 7) === "11"); if (nov > 0) txt(s, X(nov * 1440), h - 4, "พ.ย.", { "font-size": 10, fill: MUTED });
  for (const v of ticks(max)) { el("line", { x1: L, x2: w - R, y1: Y(v), y2: Y(v), stroke: v ? RULE2 : RULE }, s); txt(s, L - 6, Y(v) + 4, v ? k(v).replace(".0k", "k") : "0", { "text-anchor": "end", "font-size": 11, fill: MUTED }); }
  el("line", { x1: X(asofMin), x2: X(asofMin), y1: T, y2: h - B, stroke: INK2, "stroke-dasharray": "2 3" }, s);
  txt(s, X(asofMin) + 4, T + 10, "ตอนนี้", { "font-size": 11, fill: INK2 });
  const ordered = [...series].sort((a, b) => (a.alias === f) - (b.alias === f));
  const ends = [];
  for (const x of ordered) {
    const dim = f && x.alias !== f, g = el("g", { opacity: dim ? .18 : 1 }, s);
    const line = ps => ps.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("L");
    if (state.mode === "cum" && (series.length === 1 || x.alias === f))
      el("path", { d: `M${line(x.proj.low)}L${line([...x.proj.high].reverse())}Z`, fill: x.col, opacity: .1 }, g);
    if (state.mode === "cum") fade(el("path", { d: "M" + line(x.proj.mid), fill: "none", stroke: x.col, "stroke-width": 1.5, "stroke-dasharray": "5 4" }, g), 800, 450);
    drawIn(el("path", { d: "M" + x.pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("L"), fill: "none", stroke: x.col, "stroke-width": x.alias === f ? 3 : x.w, "stroke-linejoin": "round", "stroke-linecap": "round" }, g), 0, 1000);
    if (state.mode === "day") x.pts.forEach(p => el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, fill: x.col, stroke: "#fff", "stroke-width": 2 }, g));
    const endV = state.mode === "cum" ? x.p.mid : x.pts[x.pts.length - 1][1];
    const endX = state.mode === "cum" ? X(nd * 1440) : X(x.pts[x.pts.length - 1][0]);
    if (!dim && (series.length <= 4 || f || state.mode === "cum")) ends.push({ x: endX + 4, y: Y(endV) + 4, s: state.mode === "cum" ? k(endV) : x.alias, col: x.col });
  }
  // end labels: keep 13px apart so neighbours never overprint
  ends.sort((a, b) => a.y - b.y).forEach((e, i, a) => { if (i && e.y - a[i - 1].y < 13) e.y = a[i - 1].y + 13; });
  for (const e of ends) { el("circle", { cx: e.x + 2, cy: e.y - 4, r: 3, fill: e.col }, s); txt(s, e.x + 8, e.y, e.s, { "font-size": 11, "font-weight": 600, fill: INK }); }
  $("#tl", host).innerHTML = series.map(x => `<span><i class="line" style="background:${x.col}"></i>${esc(x.alias)}</span>`).join("") +
    (state.mode === "cum" ? `<span><i class="dash" style="color:${INK2}"></i>คาดการณ์</span>` : "");
  // crosshair: nearest day
  const cross = el("line", { y1: T, y2: h - B, stroke: INK, "stroke-width": 1, opacity: 0 }, s);
  const hit = el("rect", { x: L, y: T, width: w - L - R, height: h - T - B, fill: "transparent" }, s);
  const move = e => {
    const r = s.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width);
    const i = Math.max(0, Math.min(nd - 1, Math.floor((px - L) / (X(1440) - X(0)))));
    const d = days[i]; cross.setAttribute("x1", X(i * 1440 + 720)); cross.setAttribute("x2", X(i * 1440 + 720)); cross.setAttribute("opacity", .25);
    const val = x => {
      if (state.mode === "day") { const p = x.pts.find(p => p[2] === i); return p ? p[1] : null; }
      if (d.status === "future") return null;
      if (x.alias === "ทั้งทีม") { const p = x.pts.filter(p => p[0] <= (i + 1) * 1440).pop(); return p ? p[1] : null; }
      const p = x.pts.filter(p => p[0] <= (i + 1) * 1440).pop(); return p ? p[1] : null;
    };
    const rows = series.map(x => [x, val(x)]).filter(r => r[1] != null).sort((a, b) => b[1] - a[1]);
    showTip(e, `<b>${d.dow} ${d.label}</b> · ${TYPE[d.type]}` + (rows.length ? rows.map(([x, v]) => `<div class="r"><span><i style="background:${x.col}"></i>${esc(x.alias)}</span><b>${k(v)}</b></div>`).join("") : `<div>ยังไม่ถึงวันนี้</div>`) + (d.status === "est" ? `<div>${STATUS.est}</div>` : ""));
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerenter", move);
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
}

function viewHours(host) {
  const f = state.focus, who = f ? [byAlias[f]] : M;
  const ds = done.filter(i => days[i].status === "done");
  const per = (type) => {
    const sel = ds.filter(i => type === "all" || (type === "off") === isOff(days[i]));
    const out = Array(24).fill(0); let n = 0;
    for (const i of sel) for (const m of who) { const hs = m.hours[days[i].d]; if (hs) { hs.forEach((v, h) => out[h] += v); } n++; }
    return { vals: out.map(v => n ? v / n : 0), n: sel.length };
  };
  const wk = per("weekday"), of = per("off");
  host.innerHTML = `<h2>${f ? `ช่วงเวลาที่ ${esc(f)} เดิน` : "ช่วงเวลาที่ทีมนี้เดิน"}</h2><p class="sub">ก้าวเฉลี่ยต่อคนในแต่ละชั่วโมง แยกวันทำงาน (${wk.n} วัน) กับวันหยุด (${of.n} วัน) ใช้เฉพาะวันที่จบแล้ว</p>` +
    `<div class="legend"><span><i class="line" style="background:${HOT}"></i>วันทำงาน</span><span><i class="line" style="background:${OFF}"></i>วันหยุด</span></div><div id="c"></div>` +
    `<h2 style="margin-top:22px;font-size:16px">รายวัน × ชั่วโมง</h2><p class="sub">ยิ่งเข้มยิ่งเดินมาก ช่องว่างคือไม่มีภาพหน้าจอช่วงนั้นพอจะบอกเวลาได้</p><div id="hm"></div>`;
  const c = $("#c", host), w = W(c), h = w < 560 ? 220 : 260, L = 40, R = 10, T = 14, B = 26;
  const max = niceMax(Math.max(...wk.vals, ...of.vals) * 1.1), X = hr => L + (w - L - R) * hr / 24, Y = v => T + (h - T - B) * (1 - v / max);
  const s = svgIn(c, w, h, "ก้าวรายชั่วโมง");
  for (const v of ticks(max)) { el("line", { x1: L, x2: w - R, y1: Y(v), y2: Y(v), stroke: v ? RULE2 : RULE }, s); txt(s, L - 6, Y(v) + 4, v ? (v >= 1000 ? k(v).replace(".0k", "k") : Math.round(v)) : "0", { "text-anchor": "end", "font-size": 11, fill: MUTED }); }
  for (let hr = 0; hr <= 24; hr += 3) txt(s, X(hr), h - 8, String(hr).padStart(2, "0"), { "text-anchor": "middle", "font-size": 11, fill: INK2 });
  for (const [ser, col] of [[of, OFF], [wk, HOT]]) {
    const pts = ser.vals.map((v, hr) => [X(hr + .5), Y(v)]);
    el("path", { d: `M${X(.5)},${Y(0)}L` + pts.map(p => p.join(",")).join("L") + `L${X(23.5)},${Y(0)}Z`, fill: col, opacity: .08 }, s);
    drawIn(el("path", { d: "M" + pts.map(p => p.join(",")).join("L"), fill: "none", stroke: col, "stroke-width": 2.5, "stroke-linejoin": "round" }, s), 0, 1000);
  }
  const cross = el("line", { y1: T, y2: h - B, stroke: INK, opacity: 0 }, s);
  const hit = el("rect", { x: L, y: T, width: w - L - R, height: h - T - B, fill: "transparent" }, s);
  const mv = e => { const r = s.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width), hr = Math.max(0, Math.min(23, Math.floor((px - L) / (X(1) - X(0)))));
    cross.setAttribute("x1", X(hr + .5)); cross.setAttribute("x2", X(hr + .5)); cross.setAttribute("opacity", .25);
    showTip(e, `<b>${String(hr).padStart(2, "0")}:00–${String(hr + 1).padStart(2, "0")}:00</b><div class="r"><span><i style="background:${HOT}"></i>วันทำงาน</span><b>${full(wk.vals[hr])}</b></div><div class="r"><span><i style="background:${OFF}"></i>วันหยุด</span><b>${full(of.vals[hr])}</b></div>`); };
  hit.addEventListener("pointermove", mv); hit.addEventListener("pointerenter", mv); hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });

  // day x hour heat
  const hm = $("#hm", host), hw = W(hm), rows = seen.filter(i => who.some(m => m.hours[days[i].d]));
  const lab = 64, cw = (hw - lab) / 24, rh = 22, hh = rows.length * (rh + 2) + 22;
  const grid = rows.map(i => Array.from({ length: 24 }, (_, hr) => who.reduce((a, m) => a + ((m.hours[days[i].d] || [])[hr] || 0), 0) / who.length));
  const gmax = Math.max(...grid.flat());
  const hs = svgIn(hm, hw, hh, "ก้าวรายวันรายชั่วโมง");
  rows.forEach((i, r) => {
    const d = days[i], y = r * (rh + 2);
    txt(hs, 0, y + 15, `${d.dow} ${d.label.split(" ")[0]}`, { "font-size": 12, fill: isOff(d) ? INK : INK2, "font-weight": isOff(d) ? 600 : 400 });
    grid[r].forEach((v, hr) => {
      const t = v / gmax;
      const cell = el("rect", { x: lab + hr * cw + 1, y, width: cw - 2, height: rh, rx: 3, fill: v < 1 ? C("--tint") : `color-mix(in oklab, ${isOff(d) ? OFF : HOT} ${Math.round(10 + t * 85)}%, #ffffff)` }, hs);
      fade(cell, hr * 22, 300);   // a clock sweep across the hours
      hover(cell, () => `<b>${d.dow} ${d.label}</b> ${String(hr).padStart(2, "0")}:00–${String(hr + 1).padStart(2, "0")}:00<div class="r"><span>${f ? esc(f) : "เฉลี่ยต่อคน"}</span><b>${full(v)}</b></div>${d.status === "partial" ? `<div>${STATUS.partial}</div>` : ""}`);
    });
  });
  for (let hr = 0; hr <= 24; hr += 3) txt(hs, lab + hr * cw, hh - 4, String(hr).padStart(2, "0"), { "text-anchor": "middle", "font-size": 11, fill: MUTED });
}

const DRAW = { daily: viewDaily, member: viewMember, trend: viewTrend, hours: viewHours };

/* ---------- state, routing ---------- */
const TABS = ["insight", "win", "explore"];
function render() {
  const ins = state.tab === "insight";
  $("#insight").hidden = !ins; $("#wintab").hidden = state.tab !== "win"; $("#explore").hidden = state.tab !== "explore";
  TABS.forEach(t => $(`#tab-${t}`).setAttribute("aria-selected", state.tab === t));
  if (ins) { drawRace(); drawTeaser(); drawInsights(); }
  else if (state.tab === "win") drawWin();
  else { drawControls(); const v = $("#view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view"); DRAW[state.view](v); }
}
function hashOf() {
  if (state.tab === "insight") return "#insight";
  if (state.tab === "win") return "#how";
  const q = [state.view];
  if (state.view === "trend") q.push(state.scope, state.mode);
  if (state.focus) q.push("@" + state.focus);
  return "#explore/" + q.map(encodeURIComponent).join("/");
}
function go(patch) {
  const prevTab = state.tab;
  ANIM = !RM && !(Object.keys(patch).length === 1 && "focus" in patch);
  Object.assign(state, patch);
  history.replaceState(null, "", hashOf());
  render();
  if (prevTab !== state.tab) window.scrollTo({ top: 0 });
}
function fromHash() {
  const parts = location.hash.slice(1).split("/").map(decodeURIComponent);
  if (parts[0] === "how" || parts[0] === "win") { state.tab = "win"; return; }
  if (parts[0] !== "explore") return;
  state.tab = "explore";
  if (DRAW[parts[1]]) state.view = parts[1];
  for (const p of parts.slice(2)) {
    if (p.startsWith("@") && byAlias[p.slice(1)]) state.focus = p.slice(1);
    else if (p === "team" || p === "member") state.scope = p;
    else if (p === "cum" || p === "day") state.mode = p;
  }
}
TABS.forEach(t => $(`#tab-${t}`).onclick = () => go({ tab: t }));
$(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = TABS.indexOf(state.tab), t = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
  go({ tab: t }); $(`#tab-${t}`).focus();
});

$("#limits").innerHTML = [
  ...(M.some(m => m.nosync.length) ? [`ถ้ายอดของใครไม่ขยับเลยทั้งวัน (วันนี้นับหลัง 18:00) ถือว่ายังไม่ sync แสดงเป็น "ยังไม่ sync" ไม่นับเป็น 0 และไม่รวมในค่าเฉลี่ยกับอัตราเดินของคนนั้น ก้าวที่ sync มาทีหลังจะไปอยู่ในวันถัดไป (มี * ในคำอธิบาย): ${M.filter(m => m.nosync.length).map(m => `${m.alias} ${m.nosync.map(x => days.find(d => d.d === x).label).join(", ")}`).join(" · ")}`] : []),
  ...M.flatMap(m => m.moved.map(x => `${m.alias} ${days.find(d => d.d === x.d).label}: ยอด ${full(x.steps)} ก้าว sync เข้ามาตอน ${x.at} ถือเป็นก้าวของ ${days.find(d => d.d === x.d).label} (ตามที่ผู้ดูแลระบุ) แสดงด้วย *`)),
  ...(M.some(m => m.unsynced) ? [`วันนี้ ${M.filter(m => m.unsynced).map(m => m.alias).join(", ")} คาดการณ์นับวันนี้ให้เต็มวัน`] : []),
  "ตัวเลขทั้งหมดอ่านจากภาพหน้าจอ leaderboard ที่แคปไว้ (OCR) app แสดงก้าวปัดเป็นหลักร้อย (เช่น 24.4k)",
  `ยอดรายวัน = ยอดสะสมในภาพสุดท้ายของวัน ลบยอดสะสมในภาพสุดท้ายของวันก่อน ก้าวที่เดินหลังภาพสุดท้ายของวันจะไปนับรวมในวันถัดไป`,
  `${days.find(d => d.status === "est")?.label || "วันแรก"} ไม่มีภาพหน้าจอ เป็นค่าประมาณ: ยอดสะสมในภาพแรกของวันถัดไป หักก้าวช่วงเช้ามืดที่คนนั้นเดินตามปกติ`,
  `ช่วงเวลาในวัน: ก้าวระหว่างสองภาพจะเฉลี่ยแบ่งตามนาที (ถ้าสองภาพห่างกันไม่เกิน ${D.hour_gap / 60} ชั่วโมง) app อาจ sync ช้ากว่ากิจกรรมจริง (ประมาณ 10–15 นาที) เวลาจึงคลาดได้เล็กน้อย`,
  "คาดการณ์: แต่ละคนเดินเท่าค่าเฉลี่ยของตัวเองในวันทำงานและวันหยุดที่ผ่านมา ช่วงต่ำ–สูง ใช้วันที่น้อยที่สุดและมากที่สุดของแต่ละประเภท วันหยุดนักขัตฤกษ์นับเป็นวันหยุด",
  `วันนี้ (${D.as_of.label}) ยังไม่จบ ตัวเลขถึง ${D.as_of.time} บางคนอาจยังไม่ sync`,
].map(s => `<li>${esc(s)}</li>`).join("");

fromHash();
render();
window.scrollTo(0, 0); addEventListener("load", () => window.scrollTo(0, 0));   // a hash like #insight names a section id: never let the browser jump under the sticky header
let rt, lastW = $(".wrap").clientWidth;
new ResizeObserver(() => { const w = $(".wrap").clientWidth; if (w === lastW) return; lastW = w; clearTimeout(rt); rt = setTimeout(() => { ANIM = false; render(); }, 120); }).observe($(".wrap"));
})();
</script>
</body>
