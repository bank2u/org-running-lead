<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอบคุณทุกคน</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120a26">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23075a55%22/%3E%3Cpath d=%22M18 14h28l-4 36H22z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M20 30h24l-2.3 20H22.3z%22 fill=%22%238edfe9%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400..700&family=Archivo:wdth,wght@62..125,400..900&family=Press+Start+2P&display=swap">
<style>
/* Victory page: its own world, not the War Room. Beer amber (yellow leaning orange) = our team, red = the other team
   (after its logo; user 2026-11-12). Deep purple fields open and close the story (hero, thanks) as the nod to the
   company's purple + gold CI; the race in between runs on a pale lilac ground. Amber never carries text on light:
   --us-ink does, and amber fills get a --us-deep edge. Archivo wide carries numbers and names, Anuphan carries Thai. */
:root{
  --ink:#221636; --muted:#5a4f6e; --ground:#f6f3fb; --paper:#fff; --line:#e0d8ee;
  --stage:#4a2585; --stage-night:#32165f; --stage-soft:#e4d9f7;
  --us:#f8a91f; --us-deep:#c47600; --us-ink:#7a4a00; --us-soft:#ffe7a8; --us-pale:#fff6dc;
  --water:#f8a91f; --on-deep:#dccdf5;
  --rv:#e5383b; --rv-ink:#a3161a; --rv-soft:#ffd9d6; --coin:#f6c443;
  --pop:#ff7eb6; --lime:#ffd76a;
  --screen:#1a1033; --px-us:#ffb629; --px-rv:#ff6b6e; --px-dim:#b9a9dc;
  --th:"Anuphan",system-ui,sans-serif; --num:"Archivo","Anuphan",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--stage) var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.6 var(--th);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--us-soft);color:var(--ink)}
a{color:inherit}
:focus-visible{outline:3px solid var(--us-deep);outline-offset:3px;border-radius:12px}
h1,h2,h3,p{margin:0}
h1,h2{overflow-wrap:anywhere}
.ck{display:inline-block;max-width:100%}
.num{font-family:var(--num);font-stretch:125%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.px{font-family:"Press Start 2P",var(--num);font-weight:400;font-stretch:normal;letter-spacing:0;font-variant-numeric:normal}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* fixed chrome */
.skip{position:fixed;z-index:50;top:calc(var(--safe-t) + 12px);right:calc(var(--safe-r) + 12px);min-height:44px;min-width:44px;
  display:inline-flex;align-items:center;gap:6px;padding:0 14px 0 18px;border-radius:999px;background:rgba(255,255,255,.94);
  color:var(--ink);text-decoration:none;font:600 15px/1 var(--th);box-shadow:0 4px 14px -4px rgba(50,22,95,.35)}
.skip svg{width:18px;height:18px}
.skip:hover{background:#fff}
.skip:active{transform:scale(.97)}
.preview{position:fixed;z-index:50;top:calc(var(--safe-t) + 20px);right:calc(var(--safe-r) + 102px);padding:6px 12px;border-radius:999px;
  background:var(--us-soft);color:#4a3200;font:600 13px/1.2 var(--th);box-shadow:0 3px 10px -4px rgba(74,50,0,.4)}

/* reveal: visible by default, hidden only when motion is allowed and JS runs */
html.anim .rv{opacity:0;transform:translate3d(0,28px,0);transition:opacity .9s var(--ease),transform .9s var(--ease)}
html.anim .rv.in{opacity:1;transform:none}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;padding:calc(var(--safe-t) + 74px) calc(var(--safe-r) + 22px) calc(var(--safe-b) + 104px) calc(var(--safe-l) + 22px);
  background:var(--stage);color:#fff;overflow:hidden;display:flex;flex-direction:column}
.hero::before{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.5;
  background:repeating-radial-gradient(circle at 78% 30%,transparent 0 46px,rgba(248,169,31,.16) 46px 48px)}
.hero>*{position:relative}
.hero .mast{font:500 15px/1.4 var(--th);color:var(--on-deep);max-width:16em}
.hero .mast{order:0}.hero .buddy{order:1}.hero .stage{order:2}.hero .tail{order:3;margin-bottom:auto}
.hero .stage{display:flex;flex-direction:column;gap:4px;padding:10px 0 4px}
.hero .buddy{width:min(44vw,190px);align-self:flex-end;margin:auto 4px 0 0}
.hero h1{font:600 clamp(1.3rem,5.8vw,2.1rem)/1.35 var(--th);letter-spacing:0;max-width:14em;text-wrap:balance}
.hero .big{font-size:clamp(3.3rem,16.5vw,7rem);line-height:1.05;margin-top:10px;color:#fff}
.hero .unit{font:600 1.15rem/1.4 var(--th);color:var(--on-deep);margin-top:2px}
.hero .say{font:700 clamp(1.35rem,6vw,2rem)/1.4 var(--th);margin-top:14px;max-width:22em;color:var(--px-us)}
.hero.calm .say{color:#fff}
.stamp{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 14px 8px 10px;border-radius:999px;
  background:#ffe7a8;color:#4a3200;font:600 14px/1.35 var(--th);align-self:flex-start;max-width:100%}
.stamp svg{width:18px;height:18px;flex:none}
.cue{position:absolute;left:50%;bottom:calc(var(--safe-b) + 34px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
  font:500 13px/1.2 var(--th);color:var(--on-deep);text-decoration:none;min-height:44px;min-width:88px;justify-content:center}
.cue svg{width:22px;height:22px}
html.anim .cue svg{animation:cue 1.8s var(--ease) infinite}
@keyframes cue{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;display:block}
.hero .wave path{fill:var(--ground)}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
/* the quieter ending */
.hero.calm{background:var(--us-pale);color:var(--ink)}
.hero.calm::before{opacity:.8;background:repeating-radial-gradient(circle at 78% 30%,transparent 0 46px,rgba(196,118,0,.1) 46px 48px)}
.hero.calm .mast,.hero.calm .unit,.hero.calm .cue{color:var(--muted)}
.hero.calm h1{color:var(--us-ink)}
.hero.calm .big{color:var(--us-ink)}
.hero.calm .buddy{width:min(52vw,230px);display:flex;gap:6px;align-items:flex-end}
.hero.calm .buddy svg{flex:1}

/* ---------- shared scene type ---------- */
.ki{display:block;font:600 .62em/1.45 var(--th);color:var(--us-ink);margin-bottom:.3em;letter-spacing:0}
h2.t{font:700 clamp(1.6rem,6.6vw,2.5rem)/1.3 var(--th);letter-spacing:-.005em;text-wrap:balance}
.txt{color:var(--muted);margin-top:12px;max-width:34em;text-wrap:pretty}

/* ---------- plan ---------- */
.plan{min-height:100svh;display:flex;align-items:center;padding:12vh calc(var(--safe-r) + 22px) 12vh calc(var(--safe-l) + 22px)}
.plan .in-w{width:100%;max-width:680px;margin:0 auto}
.bars{margin-top:30px;display:grid;gap:20px}
.bar .lab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;margin-bottom:7px}
.bar .lab b{font:600 16px/1.35 var(--th)}
.bar .lab .num{font-size:17px;font-weight:700}
.bar .trk{height:30px;border-radius:15px;background:rgba(34,22,54,.05);overflow:hidden}
.bar .fill{height:100%;border-radius:15px;transform-origin:0 50%}
.bar.k-plan .fill{background:repeating-linear-gradient(-45deg,#d2cade 0 6px,#ebe6f3 6px 12px);box-shadow:inset 0 0 0 2px #aaa0bd}
.bar.k-plan .lab b,.bar.k-plan .lab .num{color:var(--muted)}
.bar.k-us .fill{background:var(--us);box-shadow:inset 0 0 0 2px var(--us-deep)}
.bar.k-us .lab b,.bar.k-us .lab .num{color:var(--us-ink)}
.bar.k-rival .fill{background:var(--rv)}
.bar.k-rival .lab b,.bar.k-rival .lab .num{color:var(--rv-ink)}
html.anim .bars .fill{transform:scaleX(0);transition:transform 1.4s var(--ease)}
html.anim .bars.in .fill{transform:scaleX(1)}
html.anim .bars.in .bar:nth-child(2) .fill{transition-delay:.25s}
html.anim .bars.in .bar:nth-child(3) .fill{transition-delay:.4s}
.plan .txt{margin-top:28px;font-size:18px;color:var(--ink)}

/* ---------- race: an 8-bit game screen (user idea, 2026-11-12) ----------
   The story page stays as it is; the race plays on a dark game screen set into it. The other team walks the level
   line, our glass rides the head of the gap line: below it while we trail, above once we lead. Pixel sprites are the
   same two mascots redrawn on a coarse grid; numbers on the screen use the pixel face, Thai stays in Anuphan. */
.race{position:relative}
.fig{position:sticky;top:0;height:100svh;z-index:1;padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 12px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 12px);pointer-events:none;overflow:hidden}
.fig-in{max-width:980px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.legend{display:flex;flex-direction:column;justify-content:center;min-height:44px;padding-right:96px;font:600 13px/1.5 var(--th)}
.legend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend i{width:10px;height:10px;flex:none}
.legend .us{color:var(--us-ink)} .legend .us i{background:var(--us);box-shadow:inset 0 0 0 2px var(--us-deep)}
.legend .rival{color:var(--rv-ink)} .legend .rival i{background:var(--rv)}
/* phones: the screen takes everything between the top row and the message window docked under it */
.chart{position:relative;margin-top:8px;border-radius:12px;background:var(--screen);border:4px solid var(--ink);
  box-shadow:0 14px 30px -18px rgba(50,22,95,.7);
  flex:1 1 auto;min-height:200px;max-height:580px}
.chart::after{content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.chart svg.plot{position:absolute;inset:0;width:100%;height:100%;overflow:visible;shape-rendering:crispEdges}
.chart text{font:500 12px var(--th);fill:var(--px-dim)}
.chart .side-up{fill:var(--px-us);font-weight:700;font-size:13px}
.chart .side-dn{fill:var(--px-rv);font-weight:700;font-size:13px}
.hud{position:absolute;z-index:5;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff}
.hud .d{font:600 13px/1.4 var(--th);color:var(--px-dim);white-space:nowrap}
.hud .v{font:700 16px/1.4 var(--th);display:flex;gap:8px;align-items:center;white-space:nowrap}
.hud .v .px{font-size:15px;line-height:1}
.hud.up .v{color:var(--px-us)} .hud.down .v{color:var(--px-rv)}
.runner{position:absolute;left:0;top:0;width:64px;height:72px;margin:-67px 0 0 -32px;will-change:transform;z-index:2}
.runner.us{z-index:3}
.runner svg,.runner canvas{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 60%}
.runner canvas{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.runner .hop{animation:flip .9s steps(9,end)}
@keyframes flip{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-51px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
html.anim .runner .party{animation:jump .48s steps(2,jump-none) infinite alternate}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-12px)}}
html.anim .chart:not(.moving) .runner canvas:not(.party):not(.hop){animation:stand 1s steps(2,jump-none) infinite alternate}
html.anim .chart:not(.moving) .runner.rival canvas{animation-delay:-.5s}
@keyframes stand{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.dust{position:absolute;left:4px;bottom:6px;width:1px;height:1px}
.dust i{position:absolute;width:6px;height:6px;background:#fff;opacity:0}
.moving .dust i{animation:puff .48s steps(4,end) infinite}
.moving .dust i:nth-child(2){animation-delay:.16s}
.moving .dust i:nth-child(3){animation-delay:.32s}
@keyframes puff{0%{transform:translate(6px,0);opacity:.8}100%{transform:translate(-24px,-12px);opacity:0}}
html.anim .chart:not(.moving) .run .bob{animation:idle 2.6s ease-in-out infinite}
html.anim .chart:not(.moving) .run.bag .bob{animation-delay:-1.3s}
.pulse{transform-box:fill-box;transform-origin:center}
html.anim .peak .pulse{animation:pulse 1.2s steps(5,end) infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(2.8);opacity:0}}

/* phones: the story is a message window docked under the screen. It never moves and never covers the race; swiping
   only changes which scene it shows (the steps below are empty scroll distance). Desktop keeps cards in the left column. */
.talk{position:relative;flex:none;margin-top:10px;display:grid;background:var(--paper);border:4px solid var(--ink);border-radius:12px;
  box-shadow:0 14px 30px -18px rgba(50,22,95,.7)}
.talk .card{grid-area:1/1;align-self:start;max-width:none;background:none;box-shadow:none;border-radius:0;padding:14px 16px 30px;
  opacity:0;transform:translateY(8px);transition:opacity .18s linear,transform .4s var(--ease)}
.talk .card.on{opacity:1;transform:none;transition-delay:.14s}
.talk .card h2.t{font-size:clamp(1.3rem,5.4vw,1.7rem)}
.talk .card .txt{margin-top:6px}
.talk .card .big{font-size:clamp(2.2rem,11vw,3.2rem)}
.talk .nights{height:44px;margin-top:18px}
.dots{position:absolute;left:16px;bottom:11px;display:flex;gap:5px}
.dots i{width:7px;height:7px;background:var(--ink);opacity:.18}
.dots i.on{opacity:1;background:var(--us-deep)}
.hint{position:absolute;right:34px;bottom:7px;font:700 12px/1.4 var(--th);color:var(--ink)}
.hint.off{display:none}
.more{position:absolute;right:12px;bottom:10px;width:16px;height:10px;background:var(--ink);clip-path:polygon(0 0,100% 0,100% 33%,72% 33%,72% 66%,57% 66%,57% 100%,43% 100%,43% 66%,28% 66%,28% 33%,0 33%)}
html.anim .more{animation:more .9s steps(2,jump-none) infinite alternate}
.more.end{visibility:hidden}
@keyframes more{from{transform:translateY(-3px)}to{transform:translateY(1px)}}
.steps{position:relative;z-index:2;margin-top:-100svh;padding-bottom:60svh;pointer-events:none}
.step{min-height:96svh}
.card{width:100%;max-width:560px;margin:0 auto;background:var(--paper);border-radius:22px;padding:20px 20px 22px;
  box-shadow:0 18px 40px -22px rgba(50,22,95,.45),0 2px 6px -2px rgba(50,22,95,.12);will-change:opacity}
.card h2.t{font-size:clamp(1.45rem,6vw,2.1rem)}
.card .txt{margin-top:8px;font-size:16px;line-height:1.6}
.card .big{font-size:clamp(2.6rem,13vw,4.2rem);line-height:1.05;color:var(--us-ink);margin:2px 0 4px}
.card.lose-end .big{color:var(--ink)}
/* one comparison per card */
.stat{margin-top:12px;padding-top:10px;border-top:1.5px dashed rgba(50,22,95,.22)}
.stat .sl{font:600 13px/1.4 var(--th);color:var(--muted)}
.stat .srow{margin-top:4px;display:flex;align-items:flex-end;gap:4px 8px}
.stat b{display:block;font-weight:700;line-height:1.1}
.stat i{display:block;font:500 12px/1.4 var(--th);color:var(--muted);font-style:normal}
.stat .a b{font-size:17px;color:var(--muted)}
.stat .z b{font-size:clamp(1.45rem,7vw,2.1rem);color:var(--us-ink)}
.stat .ar{font:700 20px/1 var(--th);color:var(--us-deep);padding-bottom:16px}
.stat .dl{align-self:center;padding:2px 7px;background:var(--us);color:var(--ink);border-radius:999px;font-weight:800;font-size:13px;margin:0 0 14px auto;white-space:nowrap}
/* nights mini chart */
.nights{position:relative;height:60px;margin-top:22px;display:flex;gap:4px}
.nights .c{position:relative;flex:1;height:100%}
.nights .b{position:absolute;left:0;right:0;border-radius:4px;transform-origin:50% 100%}
.nights .b.neg{transform-origin:50% 0;background:var(--rv)}
.nights .b.pos{background:var(--us);box-shadow:inset 0 0 0 1.5px var(--us-deep)}
.nights .b.top{background:var(--us-deep)}
.nights .val{position:absolute;left:50%;transform:translateX(-50%);font:700 12px/1 var(--num);font-stretch:110%;color:var(--us-ink);white-space:nowrap;margin-bottom:4px}
.nights .zero{position:absolute;left:0;right:0;height:1.5px;background:var(--ink);opacity:.5}
.nlab{position:relative;height:18px;margin-top:5px}
.nlab span{position:absolute;top:0;transform:translateX(-50%);font:500 11px/1.4 var(--th);color:var(--muted);white-space:nowrap}
html.anim .nights .b{transform:scaleY(0);transition:transform .9s var(--ease)}
html.anim .card.in .nights .b{transform:scaleY(1)}

/* ---------- thanks ---------- */
.thanks{position:relative;background:var(--stage-night);color:#fff;text-align:center;
  padding:clamp(90px,16vh,160px) calc(var(--safe-r) + 22px) calc(var(--safe-b) + 64px) calc(var(--safe-l) + 22px);min-height:100svh}
.thanks .wave{top:-1px;bottom:auto;transform:scaleY(-1)}
.thanks .wave path{fill:var(--ground)}
.thanks h2{font:700 clamp(2rem,8.6vw,4.4rem)/1.28 var(--th);max-width:12em;margin:0 auto}
.names{list-style:none;margin:clamp(40px,7vh,72px) auto 0;padding:0;display:grid;gap:clamp(18px,3.4vh,30px);max-width:980px}
.names li{display:flex;flex-direction:column;align-items:center}
.names .num{font-size:clamp(2.3rem,11.5vw,4.2rem);line-height:1.1;letter-spacing:.01em;color:#fff}
.names .note{margin-top:4px;font:400 16px/1.5 var(--th);color:var(--on-deep);max-width:22em}
html.anim .names li{opacity:0;transform:translate3d(0,14px,0);transition:opacity .3s steps(3,end),transform .3s steps(3,end)}
html.anim .names li.on{opacity:1;transform:none}
.lv{max-width:728px;margin:0 auto}
.lv-scr{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.lv-again{display:none;position:absolute;right:8px;top:8px;border:0;padding:8px 12px;background:var(--px-us);color:var(--night);
  font:700 14px/1.2 var(--th);clip-path:var(--notch);cursor:pointer}
html.anim .lv.end .lv-again{display:block}
.lv-scr canvas{display:block;margin:0 auto;image-rendering:pixelated}
.lv-cap{min-height:1.6em;margin-top:12px;font:600 1rem/1.6 var(--th);color:var(--px-us)}
.lv+.names{margin-top:18px}
.names+h2{margin-top:clamp(36px,6vh,60px)}
@media (max-width:959px){
  .names.duo{grid-template-columns:1fr 1fr;row-gap:10px}
}
.sign{margin-top:clamp(36px,6vh,60px);font:600 1.1rem/1.45 var(--th);color:var(--on-deep)}
.back{display:inline-flex;align-items:center;gap:10px;margin-top:40px;min-height:52px;padding:0 24px 0 28px;border-radius:999px;
  background:#fff;color:var(--stage-night);text-decoration:none;font:700 17px/1.2 var(--th);box-shadow:0 10px 26px -12px rgba(0,0,0,.5);transition:transform .2s var(--ease)}
.back svg{width:20px;height:20px}
.back:hover{transform:translateY(-2px)}
.back:active{transform:scale(.98)}
.thanks .back{margin-top:44px}

/* standalone story card (unknown scene id, or a race scene when the race cannot be drawn) */
.solo{min-height:70svh;display:flex;align-items:center;padding:8vh calc(var(--safe-r) + 14px) 8vh calc(var(--safe-l) + 14px)}

/* ---------- mascots ---------- */
.m-ink{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.leg,.arm,.bob,.water,.coin{transform-box:view-box}
.running .run .bob{animation:bob .25s ease-in-out infinite alternate}
.running .run.glass .la{animation:legA .5s ease-in-out infinite alternate}
.running .run.glass .lb{animation:legA .5s ease-in-out infinite alternate-reverse}
.running .run.glass .aa{animation:armA .5s ease-in-out infinite alternate}
.running .run.glass .ab{animation:armA .5s ease-in-out infinite alternate-reverse}
.running .run.glass .water{animation:slosh .5s ease-in-out infinite alternate}
.running .run.bag .bob{animation:bob2 .13s ease-in-out infinite alternate}
.running .run.bag .la{animation:legB .26s linear infinite alternate}
.running .run.bag .lb{animation:legB .26s linear infinite alternate-reverse}
.running .run.bag .coin{animation:coin 1.3s ease-in infinite}
.running .run.bag .coin.c2{animation-delay:.65s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes bob2{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes legA{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes legB{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
@keyframes armA{from{transform:rotate(-26deg)}to{transform:rotate(22deg)}}
@keyframes slosh{from{transform:translateX(-6px) rotate(-5deg)}to{transform:translateX(0) rotate(5deg)}}
@keyframes coin{0%{transform:translate(0,0);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translate(-14px,15px);opacity:0}}
.coin{opacity:0}
html.anim .cheer .bob{animation:cheer 1.1s var(--ease) infinite}
.cheer .ab{transform:rotate(95deg)} .cheer .aa{transform:rotate(-12deg)}
html.anim .cheer .aa{animation:waveR .55s ease-in-out infinite alternate}
html.anim .cheer .ab{animation:waveL .55s ease-in-out infinite alternate}
html.anim .cheer .water{animation:slosh .55s ease-in-out infinite alternate}
@keyframes cheer{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}55%{transform:translateY(0)}}
@keyframes waveR{from{transform:rotate(-24deg)}to{transform:rotate(4deg)}}
@keyframes waveL{from{transform:rotate(84deg)}to{transform:rotate(112deg)}}
html.anim .idle .bob{animation:idle 2.6s ease-in-out infinite}
html.anim .idle.bag .bob{animation-delay:-1.3s}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* ---------- one game world (user, 2026-11-12): the whole page is the 8-bit game, not only the race ----------
   Dark night ground, purple title/ending screens (company CI), white-framed message windows with notched pixel corners,
   numbers in the pixel face, Thai in Anuphan, pixel mascots, square confetti, stair-stepped edges. */
:root{--night:#120a26;--frame:#f2ecff;
  --notch:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
html{scrollbar-color:var(--stage) var(--night)}
body{background:var(--night);color:#fff}
::selection{background:var(--px-us);color:var(--night)}
:focus-visible{outline-color:var(--px-us);border-radius:0}
.big.num,.names .num,.bar .lab .num{font-family:"Press Start 2P",var(--num);font-weight:400;font-stretch:normal;letter-spacing:0}
.skip,.back,.stamp{border-radius:0;clip-path:var(--notch);box-shadow:none}
.skip{background:var(--frame);color:var(--night)}
.preview{border-radius:0;clip-path:var(--notch);box-shadow:none}
/* title screen */
.hero::before{inset:0;opacity:1;background:
  radial-gradient(circle,#fff 0 1.5px,transparent 2px) 0 0/97px 89px,
  radial-gradient(circle,rgba(255,214,106,.8) 0 1.5px,transparent 2px) 41px 33px/131px 113px}
.hero .big{font-size:clamp(2.2rem,10.4vw,4.6rem);line-height:1.2;margin-top:14px;color:var(--px-us)}
.hero.calm{background:var(--stage);color:#fff}
.hero.calm::before{opacity:.6;background:
  radial-gradient(circle,#fff 0 1.5px,transparent 2px) 0 0/97px 89px,
  radial-gradient(circle,rgba(255,214,106,.8) 0 1.5px,transparent 2px) 41px 33px/131px 113px}
.hero.calm .mast,.hero.calm .unit,.hero.calm .cue{color:var(--on-deep)}
.hero.calm h1{color:#fff}
.hero.calm .big{color:#fff}
.buddy img{width:100%;height:auto;display:block;image-rendering:pixelated}
.hero.calm .buddy img{flex:1;min-width:0}
html.anim .buddy img.j{animation:jump .48s steps(2,jump-none) infinite alternate}
html.anim .buddy img.j+img.j{animation-delay:-.24s}
.stamp{background:var(--px-us);color:var(--night)}
.wave{height:24px}
.hero .wave path{fill:var(--night)}
/* plan */
.ki{color:var(--px-us)}
.txt{color:var(--px-dim)}
.plan .txt{color:#fff}
.bar .trk{border-radius:0;background:rgba(255,255,255,.07)}
.bar .fill{border-radius:0;-webkit-mask:repeating-linear-gradient(90deg,#000 0 12px,transparent 12px 15px);mask:repeating-linear-gradient(90deg,#000 0 12px,transparent 12px 15px)}
html.anim .bars .fill{transition-timing-function:steps(14,end)}
.bar .lab .num{font-size:13px}
.bar.k-plan .fill{background:#6f6390;box-shadow:none}
.bar.k-plan .lab b,.bar.k-plan .lab .num{color:var(--px-dim)}
.bar.k-us .fill{background:var(--px-us);box-shadow:none}
.bar.k-us .lab b,.bar.k-us .lab .num{color:var(--px-us)}
.bar.k-rival .fill{background:var(--px-rv)}
.bar.k-rival .lab b,.bar.k-rival .lab .num{color:var(--px-rv)}
/* race: the screen and the message windows share one frame */
.legend .us{color:var(--px-us)} .legend .us i{background:var(--px-us);box-shadow:none}
.legend .rival{color:var(--px-rv)} .legend .rival i{background:var(--px-rv)}
.chart,.talk,.card,.lv-scr{border:4px solid transparent;border-radius:0;box-shadow:none;   /* notched frame painted as four bars: no clip-path over moving sprites */
  background:linear-gradient(var(--frame),var(--frame)) 4px 0/calc(100% - 8px) 4px no-repeat border-box,
    linear-gradient(var(--frame),var(--frame)) 4px 100%/calc(100% - 8px) 4px no-repeat border-box,
    linear-gradient(var(--frame),var(--frame)) 0 4px/4px calc(100% - 8px) no-repeat border-box,
    linear-gradient(var(--frame),var(--frame)) 100% 4px/4px calc(100% - 8px) no-repeat border-box,
    linear-gradient(var(--screen),var(--screen)) padding-box}
.chart{overflow:hidden}
.talk{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.chart::after{border-radius:0}
.talk,.card{color:#fff}
.talk .card{border:0;background:none}
.card .big{color:var(--px-us);font-size:clamp(1.9rem,9.4vw,3rem);line-height:1.25}
.talk .card .big{font-size:clamp(1.7rem,8.4vw,2.4rem)}
.card.lose-end .big{color:#fff}
.dots i{background:#fff;opacity:.22}
.dots i.on{opacity:1;background:var(--px-us)}
.hint{color:#fff}
.more{background:#fff}
.stat{border-top-color:rgba(255,255,255,.22)}
.stat .sl,.stat i{color:var(--px-dim)}
.stat .a b{color:var(--px-dim)}
.stat .z b{color:var(--px-us)}
.stat .ar{color:var(--px-us)}
.stat .dl{background:var(--px-us);color:var(--night);border-radius:0;clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
.nights .b{border-radius:0}
.nights .b.pos{background:var(--px-us);box-shadow:none}
.nights .b.top{background:#fff}
.nights .b.neg{background:var(--px-rv)}
.nights .val{color:#fff}
.nights .zero{background:#fff}
.nlab span{color:var(--px-dim)}
/* ending: the credits roll */
.thanks .wave path{fill:var(--night)}
.names .num{font-size:clamp(1.4rem,7.4vw,2.6rem);line-height:1.5;color:#fff}
@media (max-width:959px){.names.duo .num{font-size:clamp(1rem,5.4vw,2.2rem)}
  .names.duo li:nth-child(odd) .num{color:#fff}
  .names.duo li:nth-child(4n+1) .num,.names.duo li:nth-child(4n) .num{color:var(--px-us)}}
.names li:nth-child(odd) .num{color:var(--px-us)}
.back{background:var(--px-us);color:var(--night)}

/* ---------- desktop ---------- */
@media (min-width:960px){
  body{font-size:18px}
  .hero{padding-left:max(48px,calc((100vw - 1180px)/2));padding-right:max(48px,calc((100vw - 1180px)/2));
    display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr auto auto 1.2fr;column-gap:40px}
  .hero .mast{grid-column:1/-1;grid-row:1}
  .hero .stage{grid-column:1;grid-row:3}
  .hero .buddy{grid-column:2;grid-row:2/6;width:260px;align-self:center;justify-self:center;margin:0}
  .hero.calm .buddy{width:340px}

    padding:0 max(32px,var(--safe-r)) 0 max(32px,var(--safe-l))}
  .fig{grid-column:2;grid-row:1;padding:0;display:flex;align-items:center}
  .fig-in{width:100%;height:auto;display:block}
  .talk{display:none}
  .steps{grid-column:1;grid-row:1;margin-top:0;padding-bottom:0;pointer-events:auto}
  .step{min-height:100svh;display:flex;align-items:center}
  .legend{padding-right:0;min-height:0;flex-direction:row;justify-content:flex-start;gap:18px;font-size:14px}
  .runner{width:96px;height:108px;margin:-100px 0 0 -48px}
  .hud{left:14px;right:14px;top:12px}

  .hud .v{font-size:19px}
  .hud .v .px{font-size:18px}
  .chart{height:min(580px,64vh);max-height:none}
  .card{padding:26px 28px 28px}
  .names{grid-template-columns:repeat(3,1fr);row-gap:44px}
}
@media (max-height:700px) and (max-width:959px){
  .runner{width:48px;height:54px;margin:-50px 0 0 -24px}
  .talk .card{padding:12px 14px 28px}
  .card .txt{font-size:15px;line-height:1.5}
  .talk .card h2.t{font-size:1.25rem}
  .talk .nights{height:34px;margin-top:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
