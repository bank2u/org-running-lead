<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอบคุณทุกคน</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4a2585">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23075a55%22/%3E%3Cpath d=%22M18 14h28l-4 36H22z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M20 30h24l-2.3 20H22.3z%22 fill=%22%238edfe9%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400..700&family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Victory page: its own world, not the War Room. Beer amber (yellow leaning orange) = our team, red = the other team
   (after its logo; user 2026-11-12). Deep purple fields open and close the story (hero, thanks) as the nod to the
   company's purple + gold CI; the race in between runs on a pale lilac ground. Amber never carries text on light:
   --us-ink does, and amber fills get a --us-deep edge. Archivo wide carries numbers and names, Anuphan carries Thai. */
:root{
  --ink:#221636; --muted:#5a4f6e; --ground:#f6f3fb; --paper:#fff; --line:#e0d8ee;
  --stage:#4a2585; --stage-night:#32165f; --stage-soft:#e4d9f7;
  --us:#f8a91f; --us-deep:#c47600; --us-ink:#7a4a00; --us-soft:#ffe7a8; --us-pale:#fff6dc;
  --water:#f8a91f; --on-deep:#dccdf5;
  --rv:#e5383b; --rv-ink:#a3161a; --rv-soft:#ffd9d6; --coin:#f6c443;
  --pop:#ff7eb6; --lime:#ffd76a;
  --th:"Anuphan",system-ui,sans-serif; --num:"Archivo","Anuphan",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--stage) var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.6 var(--th);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--us-soft);color:var(--ink)}
a{color:inherit}
:focus-visible{outline:3px solid var(--us-deep);outline-offset:3px;border-radius:12px}
h1,h2,h3,p{margin:0}
h1,h2{overflow-wrap:anywhere}
.ck{display:inline-block;max-width:100%}
.num{font-family:var(--num);font-stretch:125%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* fixed chrome */
.skip{position:fixed;z-index:50;top:calc(var(--safe-t) + 12px);right:calc(var(--safe-r) + 12px);min-height:44px;min-width:44px;
  display:inline-flex;align-items:center;gap:6px;padding:0 14px 0 18px;border-radius:999px;background:rgba(255,255,255,.94);
  color:var(--ink);text-decoration:none;font:600 15px/1 var(--th);box-shadow:0 4px 14px -4px rgba(50,22,95,.35)}
.skip svg{width:18px;height:18px}
.skip:hover{background:#fff}
.skip:active{transform:scale(.97)}
.preview{position:fixed;z-index:50;top:calc(var(--safe-t) + 20px);right:calc(var(--safe-r) + 102px);padding:6px 12px;border-radius:999px;
  background:var(--us-soft);color:#4a3200;font:600 13px/1.2 var(--th);box-shadow:0 3px 10px -4px rgba(74,50,0,.4)}

/* reveal: visible by default, hidden only when motion is allowed and JS runs */
html.anim .rv{opacity:0;transform:translate3d(0,28px,0);transition:opacity .9s var(--ease),transform .9s var(--ease)}
html.anim .rv.in{opacity:1;transform:none}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;padding:calc(var(--safe-t) + 74px) calc(var(--safe-r) + 22px) calc(var(--safe-b) + 104px) calc(var(--safe-l) + 22px);
  background:var(--stage);color:#fff;overflow:hidden;display:flex;flex-direction:column}
.hero::before{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.5;
  background:repeating-radial-gradient(circle at 78% 30%,transparent 0 46px,rgba(248,169,31,.16) 46px 48px)}
.hero>*{position:relative}
.hero .mast{font:500 15px/1.4 var(--th);color:var(--on-deep);max-width:16em}
.hero .mast{order:0}.hero .buddy{order:1}.hero .stage{order:2}.hero .tail{order:3;margin-bottom:auto}
.hero .stage{display:flex;flex-direction:column;gap:4px;padding:10px 0 4px}
.hero .buddy{width:min(44vw,190px);align-self:flex-end;margin:auto 4px 0 0}
.hero h1{font:700 clamp(2.05rem,9vw,3.6rem)/1.25 var(--th);letter-spacing:-.01em;max-width:11em;text-wrap:balance}
.hero .big{font-size:clamp(3.3rem,16.5vw,7rem);line-height:1.05;margin-top:10px;color:#fff}
.hero .unit{font:600 1.15rem/1.4 var(--th);color:var(--on-deep);margin-top:2px}
.hero .say{font:500 1.15rem/1.5 var(--th);margin-top:18px;max-width:22em}
.stamp{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 14px 8px 10px;border-radius:999px;
  background:#ffe7a8;color:#4a3200;font:600 14px/1.35 var(--th);align-self:flex-start;max-width:100%}
.stamp svg{width:18px;height:18px;flex:none}
.cue{position:absolute;left:50%;bottom:calc(var(--safe-b) + 34px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
  font:500 13px/1.2 var(--th);color:var(--on-deep);text-decoration:none;min-height:44px;min-width:88px;justify-content:center}
.cue svg{width:22px;height:22px}
html.anim .cue svg{animation:cue 1.8s var(--ease) infinite}
@keyframes cue{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;display:block}
.hero .wave path{fill:var(--ground)}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
/* the quieter ending */
.hero.calm{background:var(--us-pale);color:var(--ink)}
.hero.calm::before{opacity:.8;background:repeating-radial-gradient(circle at 78% 30%,transparent 0 46px,rgba(196,118,0,.1) 46px 48px)}
.hero.calm .mast,.hero.calm .unit,.hero.calm .cue{color:var(--muted)}
.hero.calm h1{color:var(--us-ink)}
.hero.calm .big{color:var(--us-ink)}
.hero.calm .buddy{width:min(52vw,230px);display:flex;gap:6px;align-items:flex-end}
.hero.calm .buddy svg{flex:1}

/* ---------- shared scene type ---------- */
.ki{display:block;font:600 .62em/1.45 var(--th);color:var(--us-ink);margin-bottom:.3em;letter-spacing:0}
h2.t{font:700 clamp(1.6rem,6.6vw,2.5rem)/1.3 var(--th);letter-spacing:-.005em;text-wrap:balance}
.txt{color:var(--muted);margin-top:12px;max-width:34em;text-wrap:pretty}

/* ---------- plan ---------- */
.plan{min-height:100svh;display:flex;align-items:center;padding:12vh calc(var(--safe-r) + 22px) 12vh calc(var(--safe-l) + 22px)}
.plan .in-w{width:100%;max-width:680px;margin:0 auto}
.bars{margin-top:30px;display:grid;gap:20px}
.bar .lab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;margin-bottom:7px}
.bar .lab b{font:600 16px/1.35 var(--th)}
.bar .lab .num{font-size:17px;font-weight:700}
.bar .trk{height:30px;border-radius:15px;background:rgba(34,22,54,.05);overflow:hidden}
.bar .fill{height:100%;border-radius:15px;transform-origin:0 50%}
.bar.k-plan .fill{background:repeating-linear-gradient(-45deg,#d2cade 0 6px,#ebe6f3 6px 12px);box-shadow:inset 0 0 0 2px #aaa0bd}
.bar.k-plan .lab b,.bar.k-plan .lab .num{color:var(--muted)}
.bar.k-us .fill{background:var(--us);box-shadow:inset 0 0 0 2px var(--us-deep)}
.bar.k-us .lab b,.bar.k-us .lab .num{color:var(--us-ink)}
.bar.k-rival .fill{background:var(--rv)}
.bar.k-rival .lab b,.bar.k-rival .lab .num{color:var(--rv-ink)}
html.anim .bars .fill{transform:scaleX(0);transition:transform 1.4s var(--ease)}
html.anim .bars.in .fill{transform:scaleX(1)}
html.anim .bars.in .bar:nth-child(2) .fill{transition-delay:.25s}
html.anim .bars.in .bar:nth-child(3) .fill{transition-delay:.4s}
.plan .txt{margin-top:28px;font-size:18px;color:var(--ink)}

/* ---------- race ---------- */
.race{position:relative}
.fig{position:sticky;top:0;height:100svh;z-index:1;padding:calc(var(--safe-t) + 14px) calc(var(--safe-r) + 16px) 0 calc(var(--safe-l) + 16px);pointer-events:none}
.fig-in{max-width:980px;margin:0 auto}
.readout{min-height:44px;display:flex;flex-direction:column;justify-content:center;padding-right:96px}
.readout .d{font:500 13px/1.3 var(--th);color:var(--muted)}
.readout .v{font:700 22px/1.25 var(--th);display:flex;gap:8px;align-items:baseline}
.readout .v .num{font-size:22px}
.readout.up .v{color:var(--us-ink)} .readout.down .v{color:var(--rv-ink)}
.track{position:relative;margin-top:8px;border-radius:16px;background:#e6e0f0;overflow:hidden}
.lane{position:relative;height:82px}
.lane+.lane{border-top:2px dashed rgba(255,255,255,.95)}
.finish{position:absolute;top:0;bottom:0;right:14px;width:10px;
  background:conic-gradient(var(--ink) 25%,#fff 0 50%,var(--ink) 0 75%,#fff 0) 0 0/10px 10px;opacity:.75}
.runner{position:absolute;left:0;bottom:5px;display:flex;flex-direction:column;align-items:center;will-change:transform}
.runner svg{width:54px;height:60px;display:block;overflow:visible}
.tag{margin-top:-3px;padding:1px 8px;border-radius:999px;background:#fff;font:600 12px/1.45 var(--th);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.runner.us .tag{color:var(--us-ink)} .runner.rival .tag{color:var(--rv-ink)}
.chart{position:relative;margin-top:10px;height:clamp(150px,calc(100svh - 590px),300px)}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart text{font:500 11px var(--th);fill:var(--muted)}
.chart .side-up{fill:var(--us-ink);font-weight:700;font-size:12px}
.chart .side-dn{fill:var(--rv-ink);font-weight:700;font-size:12px}
.callout{position:absolute;left:0;top:0;padding:5px 10px;border-radius:10px;background:var(--paper);box-shadow:0 6px 18px -8px rgba(50,22,95,.45);
  white-space:nowrap;opacity:0;transition:opacity .3s;will-change:transform}
.callout.on{opacity:1}
.callout .d{display:block;font:500 11px/1.3 var(--th);color:var(--muted)}
.callout .v{display:block;font:700 15px/1.3 var(--th)}
.callout .v .num{font-size:15px}
.callout.up .v{color:var(--us-ink)} .callout.down .v{color:var(--rv-ink)}
.pulse{transform-box:fill-box;transform-origin:center}
html.anim .peak .pulse{animation:pulse 1.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}

.steps{position:relative;z-index:2;margin-top:-100svh}
.step{min-height:100svh;display:flex;align-items:flex-end;padding:0 calc(var(--safe-r) + 14px) calc(var(--safe-b) + 22px) calc(var(--safe-l) + 14px)}
.card{width:100%;max-width:560px;margin:0 auto;background:var(--paper);border-radius:22px;padding:20px 20px 22px;
  box-shadow:0 18px 40px -22px rgba(50,22,95,.45),0 2px 6px -2px rgba(50,22,95,.12);will-change:opacity}
.card h2.t{font-size:clamp(1.45rem,6vw,2.1rem)}
.card .txt{margin-top:8px;font-size:16px;line-height:1.6}
.card .big{font-size:clamp(2.6rem,13vw,4.2rem);line-height:1.05;color:var(--us-ink);margin:2px 0 4px}
.card.lose-end .big{color:var(--ink)}
/* nights mini chart */
.nights{position:relative;height:96px;margin-top:30px;display:flex;gap:4px}
.nights .c{position:relative;flex:1;height:100%}
.nights .b{position:absolute;left:0;right:0;border-radius:4px;transform-origin:50% 100%}
.nights .b.neg{transform-origin:50% 0;background:var(--rv)}
.nights .b.pos{background:var(--us);box-shadow:inset 0 0 0 1.5px var(--us-deep)}
.nights .b.top{background:var(--us-deep)}
.nights .val{position:absolute;left:50%;transform:translateX(-50%);font:700 12px/1 var(--num);font-stretch:110%;color:var(--us-ink);white-space:nowrap;margin-bottom:4px}
.nights .zero{position:absolute;left:0;right:0;height:1.5px;background:var(--ink);opacity:.5}
.nlab{position:relative;height:18px;margin-top:5px}
.nlab span{position:absolute;top:0;transform:translateX(-50%);font:500 11px/1.4 var(--th);color:var(--muted);white-space:nowrap}
html.anim .nights .b{transform:scaleY(0);transition:transform .9s var(--ease)}
html.anim .card.in .nights .b{transform:scaleY(1)}

/* ---------- thanks ---------- */
.thanks{position:relative;background:var(--stage-night);color:#fff;text-align:center;
  padding:clamp(90px,16vh,160px) calc(var(--safe-r) + 22px) calc(var(--safe-b) + 64px) calc(var(--safe-l) + 22px);min-height:100svh}
.thanks .wave{top:-1px;bottom:auto;transform:scaleY(-1)}
.thanks .wave path{fill:var(--ground)}
.cheers{width:150px;height:96px;margin:0 auto 18px;display:block;overflow:visible}
.thanks h2{font:700 clamp(2rem,8.6vw,4.4rem)/1.28 var(--th);max-width:12em;margin:0 auto}
.names{list-style:none;margin:clamp(40px,7vh,72px) auto 0;padding:0;display:grid;gap:clamp(18px,3.4vh,30px);max-width:980px}
.names li{display:flex;flex-direction:column;align-items:center}
.names .num{font-size:clamp(2.3rem,11.5vw,4.2rem);line-height:1.1;letter-spacing:.01em;color:#fff}
.names .note{margin-top:4px;font:400 16px/1.5 var(--th);color:var(--on-deep);max-width:22em}
html.anim .names li{opacity:0;transform:translate3d(0,34px,0);transition:opacity 1s var(--ease),transform 1s var(--ease)}
html.anim .names.in li{opacity:1;transform:none}
.sign{margin-top:clamp(36px,6vh,60px);font:600 1.1rem/1.45 var(--th);color:var(--on-deep)}
.back{display:inline-flex;align-items:center;gap:10px;margin-top:40px;min-height:52px;padding:0 24px 0 28px;border-radius:999px;
  background:#fff;color:var(--stage-night);text-decoration:none;font:700 17px/1.2 var(--th);box-shadow:0 10px 26px -12px rgba(0,0,0,.5);transition:transform .2s var(--ease)}
.back svg{width:20px;height:20px}
.back:hover{transform:translateY(-2px)}
.back:active{transform:scale(.98)}
.thanks .back{margin-top:44px}

/* standalone story card (unknown scene id, or a race scene when the race cannot be drawn) */
.solo{min-height:70svh;display:flex;align-items:center;padding:8vh calc(var(--safe-r) + 14px) 8vh calc(var(--safe-l) + 14px)}

/* ---------- mascots ---------- */
.m-ink{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.leg,.arm,.bob,.water,.coin{transform-box:view-box}
.running .run .bob{animation:bob .25s ease-in-out infinite alternate}
.running .run.glass .la{animation:legA .5s ease-in-out infinite alternate}
.running .run.glass .lb{animation:legA .5s ease-in-out infinite alternate-reverse}
.running .run.glass .aa{animation:armA .5s ease-in-out infinite alternate}
.running .run.glass .ab{animation:armA .5s ease-in-out infinite alternate-reverse}
.running .run.glass .water{animation:slosh .5s ease-in-out infinite alternate}
.running .run.bag .bob{animation:bob2 .13s ease-in-out infinite alternate}
.running .run.bag .la{animation:legB .26s linear infinite alternate}
.running .run.bag .lb{animation:legB .26s linear infinite alternate-reverse}
.running .run.bag .coin{animation:coin 1.3s ease-in infinite}
.running .run.bag .coin.c2{animation-delay:.65s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes bob2{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes legA{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes legB{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
@keyframes armA{from{transform:rotate(-26deg)}to{transform:rotate(22deg)}}
@keyframes slosh{from{transform:translateX(-6px) rotate(-5deg)}to{transform:translateX(0) rotate(5deg)}}
@keyframes coin{0%{transform:translate(0,0);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translate(-14px,15px);opacity:0}}
.coin{opacity:0}
.hop{animation:hop .6s var(--ease)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px)}100%{transform:translateY(0)}}
html.anim .cheer .bob{animation:cheer 1.1s var(--ease) infinite}
.cheer .ab{transform:rotate(95deg)} .cheer .aa{transform:rotate(-12deg)}
html.anim .cheer .aa{animation:waveR .55s ease-in-out infinite alternate}
html.anim .cheer .ab{animation:waveL .55s ease-in-out infinite alternate}
html.anim .cheer .water{animation:slosh .55s ease-in-out infinite alternate}
@keyframes cheer{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}55%{transform:translateY(0)}}
@keyframes waveR{from{transform:rotate(-24deg)}to{transform:rotate(4deg)}}
@keyframes waveL{from{transform:rotate(84deg)}to{transform:rotate(112deg)}}
html.anim .idle .bob{animation:idle 2.6s ease-in-out infinite}
html.anim .idle.bag .bob{animation-delay:-1.3s}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
html.anim .cheers .gl{transition:transform 1s var(--ease)}
html.anim .cheers .gl.l{transform:translate(-14px,6px) rotate(-4deg)}
html.anim .cheers .gl.r{transform:translate(14px,6px) rotate(4deg)}
html.anim .cheers.in .gl.l{transform:rotate(12deg)}
html.anim .cheers.in .gl.r{transform:rotate(-12deg)}
html.anim .cheers .spark{opacity:0;transition:opacity .4s .7s}
html.anim .cheers.in .spark{opacity:1}

/* ---------- desktop ---------- */
@media (min-width:960px){
  body{font-size:18px}
  .hero{padding-left:max(48px,calc((100vw - 1180px)/2));padding-right:max(48px,calc((100vw - 1180px)/2));
    display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr auto auto 1.2fr;column-gap:40px}
  .hero .mast{grid-column:1/-1;grid-row:1}
  .hero .stage{grid-column:1;grid-row:3}
  .hero .buddy{grid-column:2;grid-row:2/6;width:260px;align-self:center;justify-self:center;margin:0}
  .hero.calm .buddy{width:340px}
  .hero .tail{grid-column:1;grid-row:4;margin:0}
  .hero .big{font-size:clamp(5rem,9vw,7.5rem)}
  .race{display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr);column-gap:48px;max-width:1320px;margin:0 auto;
    padding:0 max(32px,var(--safe-r)) 0 max(32px,var(--safe-l))}
  .fig{grid-column:2;grid-row:1;padding:0;display:flex;align-items:center}
  .fig-in{width:100%}
  .steps{grid-column:1;grid-row:1;margin-top:0}
  .step{align-items:center;padding:0}
  .readout{padding-right:0}
  .readout .v,.readout .v .num{font-size:28px}
  .lane{height:104px}
  .runner svg{width:66px;height:74px}
  .tag{font-size:13px}
  .chart{height:min(360px,42vh)}
  .card{padding:26px 28px 28px}
  .names{grid-template-columns:repeat(3,1fr);row-gap:44px}
  .cheers{width:190px;height:122px}
}
@media (max-height:700px) and (max-width:959px){
  .lane{height:70px}
  .runner svg{width:42px;height:47px}
  .chart{height:140px}
  .card{padding:16px 16px 18px}
  .card .txt{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" id="skip" href="index.html?war=1">ข้าม<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></a>
<main id="app"></main>
<script>
(function () {

      G.cMin = G.maxSep / 2 + G.rw / 2 + 6;
      G.cMax = Math.max(G.cMin, G.TW - 28 - G.maxSep / 2 - G.rw / 2);
      measure();
      last = {};
      update(true);
    }

    // --- scroll anchors ---
    var desk = false, A = [];
    function measure() {
      desk = window.innerWidth >= 960;
      var vh = window.innerHeight, sy = window.scrollY;
      A = steps.map(function (st) {
        var r = st.card.getBoundingClientRect();
        // anchor: the scroll position where this card sits at its resting place in the viewport
        var restTop = desk ? vh / 2 - r.height / 2 : vh - r.height - (st.node.getBoundingClientRect().bottom - r.bottom);
        return r.top + sy - restTop;
      });
    }

    function idxAt(t) {   // last point with time <= t
      var a = 0, b = pts.length - 1;
      if (t < pts[0][0]) return 0;
      while (a < b) { var m = (a + b + 1) >> 1; if (pts[m][0] <= t + 1e-9) a = m; else b = m - 1; }
      return a;
    }

    var last = {}, sign0 = null;
    function update(force) {
      if (!G.X) return;
      var y = window.scrollY, vh = window.innerHeight, n = steps.length;
      // active scene: the last one whose card has reached the focus band
      var act = 0;
      for (var i = 0; i < n; i++) if (y >= A[i] - vh * .3) act = i;
      // chart time: hold on each scene's mark, travel to the next one between scenes
      var t;
      if (RM || n === 1) t = steps[act].target;
      else if (y <= A[0]) t = steps[0].target;
      else if (y >= A[n - 1]) t = steps[n - 1].target;
      else {
        var j = 0; while (j < n - 2 && y >= A[j + 1]) j++;
        var u = (y - A[j]) / ((A[j + 1] - A[j]) || 1);
        t = steps[j].target + (steps[j + 1].target - steps[j].target) * smooth((u - .2) / .6);
      }
      var k = idxAt(t), p = pts[k];
      if (force || k !== last.k) {
        last.k = k;
        var hx = G.X(p[0]), hy = G.Y(p[1]), up = p[1] > 0, dn = p[1] < 0;
        G.reveal.setAttribute("width", Math.max(0, hx + 10));
        G.head.setAttribute("cx", hx); G.head.setAttribute("cy", hy);
        G.head.setAttribute("fill", up ? "#c47600" : dn ? "#e5383b" : "#221636");
        G.ticks.forEach(function (tk) { tk.n.setAttribute("opacity", tk.t <= p[0] + 1e-9 ? 1 : 0); });
        // readout: day of the drawn point + the lead at that point
        var dl = null; days.forEach(function (d) { if (d.t <= p[0]) dl = d.label; });
        rd.textContent = dl || "";
        rv.textContent = "";
        rv.appendChild(document.createTextNode(up ? "นำ" : dn ? "ตาม" : "เสมอ"));
        if (p[1] !== 0) rv.appendChild(el("span", "num", fmt(p[1])));
        readout.className = "readout" + (up ? " up" : dn ? " down" : "");
        // runners: centre travels toward the finish, the gap follows the lead (sqrt-ish so small leads stay visible)
        var prog = clamp((p[0] - xmin) / ((t1 - xmin) || 1), 0, 1);
        var c = G.cMin + (G.cMax - G.cMin) * prog;
        var sep = (p[1] < 0 ? -1 : 1) * G.maxSep * Math.pow(Math.min(1, Math.abs(p[1]) / maxAbs), .6);
        runU.style.transform = "translate3d(" + (c + sep / 2 - runU.offsetWidth / 2).toFixed(1) + "px,0,0)";
        runR.style.transform = "translate3d(" + (c - sep / 2 - runR.offsetWidth / 2).toFixed(1) + "px,0,0)";
        var sg = up ? 1 : dn ? -1 : 0;
        if (!RM && sign0 === -1 && sg === 1) {
          var gsvg = runU.querySelector("svg");
          gsvg.classList.remove("hop"); void gsvg.getBoundingClientRect(); gsvg.classList.add("hop");
        }
        if (sg) sign0 = sg;
      }
      // highlighted mark: only once the line has arrived at it
      var st = steps[act], m = st.mark;
      var on = m && m.t <= p[0] + 1e-6;
      if (force || on !== last.on || act !== last.act) {
        last.on = on; last.act = act;
        [G.ring, G.pulse].forEach(function (c) { c.setAttribute("opacity", on ? 1 : 0); });
        fig.classList.toggle("peak", !!(on && st.s.id === "overtake"));
        call.className = "callout";
        if (on) {
          var mx = G.X(m.t), my = G.Y(m.lead);
          G.ring.setAttribute("cx", mx); G.ring.setAttribute("cy", my);
          G.pulse.setAttribute("cx", mx); G.pulse.setAttribute("cy", my);
          G.pulse.setAttribute("stroke", m.lead >= 0 ? "#c47600" : "#c62828");
          call.textContent = "";
          call.appendChild(el("span", "d", [m.label, m.time].filter(has).join(" ")));
          var vv = el("span", "v", m.lead > 0 ? "นำ " : m.lead < 0 ? "ตาม " : "เสมอ");
          if (m.lead !== 0) vv.appendChild(el("span", "num", fmt(m.lead)));
          call.appendChild(vv);
          var cw = call.offsetWidth, ch = call.offsetHeight;
          var cx = clamp(mx - cw / 2, 0, Math.max(0, G.x1 + 4 - cw));
          var cy = m.lead < 0 ? my - ch - 14 : my + 14;
          if (cy < -6) cy = my + 14;
          if (cy + ch > G.H) cy = my - ch - 14;
          call.style.transform = "translate(" + cx.toFixed(0) + "px," + cy.toFixed(0) + "px)";
          call.classList.add("on", m.lead >= 0 ? "up" : "down");
        }
      }
      // phones: a card fades as it scrolls up over the pinned race
      if (!desk) steps.forEach(function (s2, i) {
        var o = 1 - clamp((y - A[i] - vh * .12) / (vh * .28), 0, 1);
        if (s2._o !== o) { s2._o = o; s2.card.style.opacity = o; }
      });
      else steps.forEach(function (s2) { if (s2._o !== 1) { s2._o = 1; s2.card.style.opacity = ""; } });
      // count-ups fire when their scene becomes active
      if (!st.counted && st.card._count && y >= A[act] - vh * .3) { st.counted = true; st.card._count(); }
    }

    // night card bars + other per-card reveals
    steps.forEach(function (st) { watch(st.card, null, .3); });

    var ticking = false;
    function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; update(false); }); } }
    var rt = null;
    function onResize() { clearTimeout(rt); rt = setTimeout(layout, 120); }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onResize);
    live.push(function () { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onResize); });
    // run cycle only while the race is on screen
    if ("IntersectionObserver" in window && !RM) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { track.classList.toggle("running", e.isIntersecting); }); });
      io.observe(sec);
      live.push(function () { io.disconnect(); });
    }
    layout();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
    window.addEventListener("load", layout, { once: true });
  }

  function thanksScene(s) {
    var sec = el("section", "thanks");
    sec.insertAdjacentHTML("beforeend", waveSVG());
    var ch = document.createElementNS(NS, "svg");
    ch.setAttribute("class", "cheers"); ch.setAttribute("viewBox", "0 0 150 96"); ch.setAttribute("aria-hidden", "true");
    ch.innerHTML = '<g class="gl l" style="transform-origin:46px 92px;transform-box:view-box"><svg x="6" y="12" width="76" height="84" viewBox="0 0 64 72">' + glassSVG("idle").replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "") + '</svg></g>' +
      '<g class="gl r" style="transform-origin:104px 92px;transform-box:view-box"><g transform="translate(144 12) scale(-1 1)"><svg width="76" height="84" viewBox="0 0 64 72">' + glassSVG("idle").replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "") + '</svg></g></g>' +
      '<g class="spark" stroke="#f6c443" stroke-width="3" stroke-linecap="round"><path d="M75 4v9M62 9l5 7M88 9l-5 7"/></g>';
    sec.appendChild(ch);
    if (has(s.title)) {
      var h = chunks(el("h2", "rv"), s.title); sec.appendChild(h); watch(h);
      // a thank-you that misses one line by a little is set slightly smaller rather than leave one word alone
      var fit = function () {
        h.style.fontSize = ""; h.style.whiteSpace = "nowrap";
        var r = h.clientWidth / h.scrollWidth, fs = parseFloat(getComputedStyle(h).fontSize);
        h.style.whiteSpace = "";
        if (r < 1 && r > .8) h.style.fontSize = Math.floor(fs * r * .98) + "px";
      };
      fit();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      window.addEventListener("resize", fit);
      live.push(function () { window.removeEventListener("resize", fit); });
    }
    var names = (s.members || []).filter(has);
    if (names.length) {
      var ul = el("ul", "names");
      names.forEach(function (nm, i) {
        var li = el("li");
        li.style.transitionDelay = (RM ? 0 : 200 + i * 170) + "ms";
        li.appendChild(el("span", "num", nm));
        var note = s.lines && s.lines[nm];
        if (has(note)) li.appendChild(el("span", "note", note));
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      watch(ul, null, .15);
    }
    if (has(s.kicker)) { var sg = el("p", "sign rv", s.kicker); sec.appendChild(sg); watch(sg); }
    app.appendChild(sec);
    watch(ch, null, .5);
    return sec;
  }

  function backButton(parent) {
    var a = el("a", "back");
    a.href = (V && V.war) || "index.html?war=1";
    a.appendChild(document.createTextNode("ดู War Room ย้อนหลัง"));
    a.insertAdjacentHTML("beforeend", ARROW);
    if (parent) parent.appendChild(a);
    else { var f = el("section", "thanks"); f.style.minHeight = "auto"; f.appendChild(a); app.appendChild(f); }
  }

  // ---------- render ----------
  function render() {
    live.forEach(function (f) { try { f(); } catch (e) {} });
    live = [];
    app.textContent = "";
    var old = document.querySelector(".preview"); if (old) old.remove();
    if (!V) return;
    document.getElementById("skip").href = V.war || "index.html?war=1";
    var ending = FORCED || (V.outcome === "lose" ? "lose" : "win");
    if (FORCED) document.body.appendChild(el("div", "preview", "ตัวอย่าง"));
    var scenes = ((V.scenes || {})[ending] || []).filter(function (s) { return s && s.id; });
    var thanks = null, firstAfterHero = true;
    for (var i = 0; i < scenes.length; i++) {
      var s = scenes[i], start = app.childElementCount;
      if (s.id === "hero") heroScene(s, ending);
      else if (s.id === "plan") planScene(s);
      else if (s.id === "thanks") thanks = thanksScene(s);
      else if (RACE_IDS[s.id]) {
        var run = [s];
        while (i + 1 < scenes.length && RACE_IDS[scenes[i + 1].id]) run.push(scenes[++i]);
        raceScene(run, ending);
      } else soloScene(s, ending);
      if (s.id !== "hero" && firstAfterHero && app.children[start]) { app.children[start].id = "s2"; firstAfterHero = false; }
    }
    backButton(thanks);
  }

  var stamp = V ? JSON.stringify(V) : "";
  render();
  try {
    fetch("v-c2120a14ff9b.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.scenes) return;
        var s2 = JSON.stringify(d);
        if (s2 === stamp) return;
        V = d; stamp = s2; render();
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
